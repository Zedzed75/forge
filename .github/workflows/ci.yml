# ---------------------------------------------------------------------------
# Continuous integration for forge.
# ---------------------------------------------------------------------------
# CI is authoritative: it is the only Linux environment where every domain's
# validation tools can run natively (decision DESIGN.md §8 Q7). Every
# delivered domain installs its validators here. Without them, the tests
# marked `integration` skip silently, and a green suite would no longer mean
# that the generated project is valid.
#
# Two jobs, and the difference between them is one label:
#
#   tests   the gate. Three interpreters on `ubuntu-24.04`, the label D10
#           pins. These are the checks a merge reads.
#   canary  advisory. The same suite on `ubuntu-26.04`, non-gating, so that
#           the image `ubuntu-latest` is migrating to is exercised here
#           before the pin moves onto it rather than after.
#
# Both get their toolchain from `.github/actions/forge-ci-setup`, which is one
# definition rather than two copies on purpose -- see the long note at the top
# of that file for why a `matrix.include` canary silently is not one.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    # Pinned, not floating (decision D10). `ubuntu-latest` migrates to Ubuntu 26
    # gradually between 19 Oct and 19 Nov 2026 (actions/runner-images#14748), and
    # during that window a run lands on 24.04 or 26.04 without us choosing which.
    # For the one environment that decides whether a generated project is valid,
    # that nondeterminism is the thing to remove: a validator that changes
    # version, packaging or availability under 26.04 does not turn the suite red,
    # it makes the `integration` tests skip and leaves a green suite that no
    # longer proves anything.
    #
    # A literal label, deliberately not an expression. The first attempt at this
    # change tried `${{ matrix.runner || 'ubuntu-24.04' }}` with the Ubuntu 26
    # canary added as a `matrix.include` entry, on the theory that a combination
    # carrying no `runner` key would fall back and so keep its check-run name.
    # It does fall back -- but no such combination was ever created. `include`
    # does not add a combination when its keys match an existing one: it *merges*
    # into it. `{python-version: "3.13", runner: "ubuntu-26.04"}` therefore moved
    # the 3.13 leg onto 26.04 and, with a `continue-on-error` keyed on the same
    # expression, stopped it gating. Six checks still reported green, which is
    # how it nearly survived review.
    #
    # The canary is therefore the `canary` job below, and the install steps the
    # two jobs share live in a composite action so that there is still only one
    # toolchain. Nothing about this job's identity changed when that happened:
    # the three check-runs are still `tests (3.11)`, `tests (3.12)` and
    # `tests (3.13)` on `ubuntu-24.04`, which is what D4's merge clause counts.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # Full history is required: copier resolves a template by git reference,
      # and `copier update` compares two commits.
      #
      # This step stays in the workflow rather than moving into the composite
      # action, because a local action has to be on disk before `uses:` can
      # resolve it. The SHA-pinning rule that governs it is written out beside
      # the one `uses:` the action does contain.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/forge-ci-setup
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ubuntu-24.04

      # FORGE_REQUIRE_TOOLS=1 turns "validator binary missing" from a skip into a
      # failure (tests/conftest.py::require_tools). Every install step in the
      # composite action can degrade silently -- a moved release URL, a renamed
      # tarball member, a changed archive layout -- and without this flag the
      # integration tests would skip and the build would still go green,
      # asserting nothing about the generated projects. With it, a green check
      # positively proves that all five domains' real validators ran.
      #
      # The same flag also forbids an `integration` test from skipping for any
      # other reason (tests/conftest.py::pytest_runtest_makereport). The first
      # rule only covered a missing binary, and the hole next to it was already
      # occupied: the only test of `forge update` skipped in every run, because
      # `uv run` wrote an untracked `uv.lock` and the checkout was therefore
      # dirty. `uv.lock` is gitignored now, and should anything else dirty the
      # tree, this job goes red instead of quietly asserting less.
      #
      # `-rs` and no `-q`: `pyproject.toml` already puts `-q` in `addopts`, so
      # `pytest -q` was really `-qq`, which suppresses the count line. The CI log
      # therefore never said how many tests ran or how many skipped -- on a
      # workflow whose whole job is to assert what actually ran. `-rs` lists the
      # skips by reason, so "no validator was missing" is readable instead of
      # inferred.
      - name: Run the test suite
        env:
          FORGE_REQUIRE_TOOLS: "1"
        run: uv run pytest -rs

  # -------------------------------------------------------------------------
  # The Ubuntu 26 canary (decision D10)
  # -------------------------------------------------------------------------
  # D10 pins `runs-on` and, in the same breath, obliges the pin to move
  # deliberately rather than sit until the label is retired: "the move to
  # `ubuntu-26.04` is proven by a canary job running the suite on the new label
  # *before* the pinned label changes". This job is that proof, standing.
  #
  # It is a fourth check-run, named `canary (3.13, ubuntu-26.04)`, and it is
  # **not** one of the six D4 counts. `continue-on-error: true` is what makes
  # that true mechanically: a failure here marks the job failed and still lets
  # the workflow run conclude successfully, so this job can sit red for a month
  # without blocking a single merge. Read it, do not gate on it -- and never
  # move this flag onto a `tests` leg, which is exactly the mistake the note on
  # that job records.
  #
  # One leg, not three. The question a canary answers is "does this image still
  # carry a working toolchain", which is a property of the image rather than of
  # the interpreter; 3.13 is the newest in the matrix and so the one most likely
  # to be what a future pinned runner pairs with. Three legs would triple the
  # minutes for a second copy of the same answer.
  canary:
    name: canary (3.13, ubuntu-26.04)
    # Generally available since actions/runner-images#14747, which is why this
    # can run today rather than waiting for the migration window to open on
    # 19 Oct 2026. Same target triple as `ubuntu-24.04` -- x86_64 glibc Linux --
    # so every pinned download in the composite action resolves to the same
    # artifact, including uv's, whose checksum is pinned there.
    runs-on: ubuntu-26.04
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/forge-ci-setup
        with:
          python-version: "3.13"
          # Never `ubuntu-24.04`, and never omitted. setup-uv keys its cache on
          # OS and architecture, which both images report identically, so a
          # shared key would let this job restore wheels built on 24.04 and
          # report green about an image it never built anything on.
          cache-suffix: ubuntu-26.04

      # `FORGE_REQUIRE_TOOLS=1` here for the same reason as on the gating job,
      # and with more force: the failure this job exists to catch is precisely a
      # validator that stops installing on the new image. Without the flag that
      # would present as a green canary with the integration tests skipped,
      # which is the one outcome that would make this job actively misleading.
      - name: Run the test suite
        env:
          FORGE_REQUIRE_TOOLS: "1"
        run: uv run pytest -rs
