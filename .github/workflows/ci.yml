# ---------------------------------------------------------------------------
# Integration continue de forge.
# ---------------------------------------------------------------------------
# La CI fait autorite : c'est le seul environnement Linux ou tous les outils de
# validation des domaines peuvent tourner nativement (decision DESIGN.md §8 Q7).
# Chaque domaine livre installe ici ses validateurs. Sans eux, les tests
# marques `integration` s'ignorent en silence : une suite verte ne voudrait
# alors plus dire que le projet genere est valide.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      # L'historique complet est necessaire : copier resout un gabarit par
      # reference git, et `copier update` compare deux commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # copier commit dans un clone temporaire quand le gabarit est modifie :
      # sans identite git, cette etape echoue.
      - name: Configurer l'identite git
        run: |
          git config --global user.name "forge-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      # `python-version` est passe a uv : sans lui, la matrice ne serait qu'un
      # decor et les trois jobs tourneraient sur le meme interpreteur.
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          # Sans cette cle, l'action cherche un uv.lock ou un requirements.txt,
          # n'en trouve aucun, et pose un cache qui ne s'invalide jamais : les
          # dependances resteraient figees a leur premiere resolution.
          cache-dependency-glob: "pyproject.toml"

      - name: Installer forge
        run: |
          # `--clear` et non `uv venv` seul : setup-uv cree desormais
          # l'environnement lui-meme et pose VIRTUAL_ENV, si bien qu'un
          # `uv venv` nu echoue sur « a virtual environment already exists ».
          # `--clear` marche que l'action l'ait cree ou non.
          uv venv --clear
          uv pip install -e ".[dev]"

      # La CI fait autorite pour la validation Ansible : ansible-core ne
      # supporte pas Windows comme noeud de controle, le poste de
      # developpement passe donc par WSL (decision DESIGN.md §8 Q7).
      #
      # Tout est epingle, comme les binaires des quatre autres domaines. Ces
      # deux installations etaient les seules a ne pas l'etre, et ca s'est vu :
      # community.postgresql 5.0.0 a supprime postgresql_set, et la CI est
      # passee au rouge sur un commit vieux de trois semaines, sans qu'une
      # ligne du depot ait bouge. Un validateur qui change tout seul ne valide
      # plus rien de reproductible.
      #
      # Procedure de montee de version : changer le numero ici, lancer la CI,
      # corriger les gabarits si le validateur a durci ses regles, et livrer la
      # montee dans son propre commit. Jamais en passager d'un autre.
      #
      # ansible-core reste en 2.19 : c'est la derniere branche qui accepte
      # Python 3.11 comme noeud de controle, et 3.11 est dans la matrice.
      # Passer en 2.20 ou 2.21 demande d'abord de retirer 3.11 de la matrice.
      - name: Installer les outils du domaine Ansible
        run: |
          uv pip install 'ansible-core==2.19.13' 'ansible-lint==26.9.0'
          # galaxy.ansible.com coupe parfois la connexion quand les trois jobs
          # de la matrice l'interrogent en meme temps (« Connection reset by
          # peer »). L'etape tombait alors en rouge sans qu'une ligne du depot
          # soit en cause, ce qui est exactement le bruit que cette CI doit
          # cesser de produire. Trois essais, puis on echoue pour de bon.
          ok=
          for attempt in 1 2 3; do
            if uv run ansible-galaxy collection install \
                 community.general:13.4.0 \
                 ansible.posix:2.2.2 \
                 community.postgresql:5.0.0 \
                 -p "$HOME/.ansible/collections"; then
              ok=1
              break
            fi
            echo "ansible-galaxy a echoue (essai ${attempt}/3), nouvel essai dans 15 s"
            sleep 15
          done
          test -n "$ok"
          echo "FORGE_ANSIBLE_COLLECTIONS=$HOME/.ansible/collections" >> "$GITHUB_ENV"
          # Les quatre autres domaines affichent la version de leurs outils :
          # le journal dit alors contre quoi le projet genere a ete valide.
          uv run ansible --version
          uv run ansible-lint --version
          uv run ansible-galaxy collection list -p "$HOME/.ansible/collections"

      # Domaine Helm. Les tests marques `integration` s'ignorent si ces outils
      # manquent : les installer est ce qui rend la CI concluante.
      #
      # Tous les `curl` de ce workflow portent `--retry 5 --retry-delay 5
      # --retry-all-errors`. Sans ces options, un 500 passager de
      # github.com/releases ou un reset de connexion suffit a faire tomber un
      # job en rouge alors que rien du depot n'est en cause, et on ne distingue
      # plus une vraie regression d'un hoquet de reseau. `--retry-all-errors`
      # est necessaire : `--retry` seul ignore les erreurs HTTP non transitoires
      # renvoyees a tort par les CDN.
      - name: Installer les outils du domaine Helm
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3             | bash -s -- --version v3.16.3
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/kubeconform.tar.gz             https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          helm version --short
          kubeconform -v

      # Domaine Terraform. `terraform init` telecharge les providers : le cache
      # evite de recommencer pour chaque racine d'environnement.
      - name: Installer les outils du domaine Terraform
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/terraform.zip             https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -qo /tmp/terraform.zip -d /tmp
          sudo install -m 0755 /tmp/terraform /usr/local/bin/terraform
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/tflint.zip             https://github.com/terraform-linters/tflint/releases/download/v0.59.1/tflint_linux_amd64.zip
          unzip -qo /tmp/tflint.zip -d /tmp
          sudo install -m 0755 /tmp/tflint /usr/local/bin/tflint
          mkdir -p "$HOME/.terraform.d/plugin-cache"
          echo "FORGE_TF_PLUGIN_CACHE=$HOME/.terraform.d/plugin-cache" >> "$GITHUB_ENV"
          terraform version
          tflint --version

      # Domaine monitoring. `promtool test rules` est le seul validateur du
      # projet qui verifie quelque chose de semantique : que les alertes se
      # declenchent reellement.
      - name: Installer les outils du domaine monitoring
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/prometheus.tar.gz             https://github.com/prometheus/prometheus/releases/download/v3.6.0/prometheus-3.6.0.linux-amd64.tar.gz
          tar -xzf /tmp/prometheus.tar.gz -C /tmp --strip-components=1             prometheus-3.6.0.linux-amd64/promtool
          sudo install -m 0755 /tmp/promtool /usr/local/bin/promtool
          promtool --version

      # Domaine pipeline. actionlint connait le schema des workflows GitHub ;
      # cote GitLab il n'existe pas d'equivalent hors ligne, et yamllint ne
      # verifie que la forme du document. La dissymetrie est documentee.
      - name: Installer les outils du domaine pipeline
        run: |
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/actionlint.tar.gz             https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
          uv pip install 'yamllint==1.38.0'
          actionlint --version
          yamllint --version

      # `uv run` garantit que le pytest execute est celui de l'environnement
      # qu'on vient de creer, et non un pytest quelconque du PATH.
      - name: Verifier l'interpreteur
        run: uv run python -c "import sys; print(sys.version)"

      # FORGE_REQUIRE_TOOLS=1 turns "validator binary missing" from a skip into a
      # failure (tests/conftest.py::require_tools). Every install step above can
      # degrade silently -- a moved release URL, a renamed tarball member, a
      # changed archive layout -- and without this flag the integration tests
      # would skip and the build would still go green, asserting nothing about
      # the generated projects. With it, a green check positively proves that
      # all five domains' real validators ran.
      - name: Lancer la suite de tests
        env:
          FORGE_REQUIRE_TOOLS: "1"
        run: uv run pytest -q
