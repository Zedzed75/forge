# ---------------------------------------------------------------------------
# Publishing the `iac-forge` distribution to PyPI.
# ---------------------------------------------------------------------------
# Three names are in play and only one of them is this file's: the published
# distribution is `iac-forge`, the installed command stays `forge`, the
# imported package stays `forge`. See the comment on `name` in pyproject.toml.
#
# Authentication: **Trusted Publishing (OIDC)**, never a token. GitHub signs a
# short-lived OIDC token for this repository, this workflow and this
# environment; PyPI verifies it against the publisher declared on the PyPI
# side. No PyPI secret therefore exists in this repository, and there is
# nothing to leak the day it goes public. `permissions: id-token: write` is
# what authorises requesting that token — without that line the upload fails
# with a 403, and it is the only permission the publish jobs add.
#
# Two triggers, deliberately asymmetric:
#
#   push of a v* tag    -> the real PyPI. Irreversible: a version published on
#                          PyPI cannot be replaced, not even after deletion.
#                          Hence the tag/version guard below.
#   workflow_dispatch   -> TestPyPI only. This is the dress rehearsal, run by
#                          hand as many times as we like.
#
# TestPyPI is never triggered by a tag: the second tag of the same version
# would be refused with "File already exists" and would fail a real
# publication for a reason that has nothing to do with it.
#
# Prerequisite on the PyPI side (done once, by a human, in the web UI):
# declare a "pending publisher" on pypi.org AND on test.pypi.org for the
# `iac-forge` project, with owner `Zedzed75`, repository `forge`, workflow
# `release.yml`, and the matching environment name (`pypi` / `testpypi`). The
# first successful upload creates the project, reserves the name, and converts
# the pending publisher into an established one.
#
# Runner: all three jobs name `ubuntu-24.04` explicitly, never `ubuntu-latest`
# (decision D10). It matters more here than in ci.yml, because publishing is
# irreversible: `ubuntu-latest` is migrating to Ubuntu 26 gradually between
# 19 Oct and 19 Nov 2026 (actions/runner-images#14748), so a tag pushed during
# that window would build the artifact on whichever image the runner happened
# to hand out. The wheel that reaches PyPI should be built on an image this
# file names, not on one a rollout picked. ci.yml carries an `ubuntu-26.04`
# canary; there is deliberately no canary here, because the only way to
# exercise this workflow end to end is to publish.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The two publish jobs widen that themselves, and only
# for `id-token`.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # A single build. The two targets publish EXACTLY the same files: if
  # TestPyPI rebuilt on its own side, the dress rehearsal would be worthless —
  # we would have validated an artifact PyPI is never going to receive.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    steps:
      # Every `uses:` below is pinned to a full commit SHA with the version in a
      # trailing comment, the form the publish action already used. It matters
      # more here than anywhere else in the repository: this job holds no
      # `id-token` permission and so cannot publish, but it can alter `dist/`
      # before the upload, and the job that does hold `id-token` then sends that
      # artifact to PyPI under our identity, as `iac-forge`. A PyPI version is
      # never replaceable, not even after deletion, so the distance between a
      # tampered build and a permanent bad release wearing our name is one job
      # boundary with no human step in it. A mutable tag is not an acceptable
      # entry point for that. Dependabot rewrites both the SHA and the comment
      # (.github/dependabot.yml).
      #
      # `fetch-depth: 0` so the tags are available: the guard below needs the
      # tag, and hatchling reads the version from the source file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `version:` and `checksum:` pin the uv this job installs, for the reason
      # the comment above gives about `uses:` -- and with more force, because
      # this is the job that produces the artifact the publish job uploads under
      # our identity. uv is the build frontend here (`uv build` below), so an
      # unpinned uv is an unpinned step in the path to a permanent PyPI release.
      # The pin, the checksum and the bump procedure are explained once, at the
      # matching step in ci.yml; keep the two numbers equal.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          # `true` / `false` / `auto`, and here it is a security choice rather
          # than the speed one it is in ci.yml. `false`: this job restores
          # nothing it did not build itself.
          #
          # The reason is the paragraph above about `dist/`. A restorable uv
          # cache is an input to the build whose output the publish job uploads
          # under our identity, and an Actions cache entry is writable by
          # anything that can run a workflow on the default branch. The exposure
          # is modest -- cache scoping means a fork PR cannot write the branch
          # scope, so the realistic writer already has push access -- but so is
          # the cost of declining it: `uv build` and `uvx twine check` resolve
          # the build-system requirements and nothing else, and releases are
          # rare. Upstream reached the same conclusion from its side, and
          # v10.0.0 made `auto` deliberately disable the cache for release, tag
          # push, `pull_request_target` and `workflow_run`
          # (astral-sh/setup-uv#984). This workflow triggers on tag push,
          # squarely in that set.
          #
          # `false` and not `auto`, which the pin would now honour. `auto` is
          # upstream's default, and its meaning already moved under us once: at
          # the v5.4.2 this step carried until recently it meant only "cache on
          # GitHub-hosted runners" and would have cached this very tag push.
          # Writing the posture out rather than inheriting it means the next
          # major cannot change what the publish path restores without this line
          # changing with it. Same argument as `prune-cache` in ci.yml.
          enable-cache: false
          python-version: "3.13"
          # No `cache-dependency-glob`. It computed the cache key, and there is
          # no longer a cache to key -- it keyed `pyproject.toml` rather than
          # `uv.lock` because this job never syncs the project environment, only
          # the build-system requirements. Re-enabling the cache means restoring
          # that line and that reasoning together, not finding it already here
          # doing nothing.

      - name: Build the sdist and the wheel
        run: uv build

      # `twine check --strict` and not `twine check`: without `--strict`, a
      # malformed long description is only a warning, and you only find out by
      # seeing the PyPI page render raw Markdown. In strict mode it is an
      # error here, before the upload.
      - name: Check the metadata
        run: uvx twine check --strict dist/*

      # The repository has already seen the version diverge from its tag:
      # `forge --version` announced 0.1.0 on a repository tagged v1.1.0. On
      # PyPI the same mistake is final, since a version is never republished.
      # So we compare the pushed tag against the produced file name, and
      # refuse before the upload.
      - name: Check that the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/iac_forge-(.+)\.tar\.gz|\1|')
          echo "tag=${tag} built version=${built}"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the built version ${built}" \
                 "— fix src/forge/__init__.py or the tag, then re-tag."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  # -------------------------------------------------------------------------
  # Dress rehearsal. The job only publishes to TestPyPI on a manual trigger;
  # it is the one that proves the OIDC chain end to end before we touch the
  # real PyPI.
  # -------------------------------------------------------------------------
  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/iac-forge
    permissions:
      # The only permission added: requesting the short-lived OIDC token.
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # A dress rehearsal gets run again. Without `skip-existing`, the
          # second attempt on an already-uploaded version goes red with
          # nothing whatsoever to fix.
          skip-existing: true

  # -------------------------------------------------------------------------
  # The real PyPI. Tag only, and behind a GitHub environment: that is where a
  # mandatory review rule gets hooked on if the board wants one, and it is the
  # name the publisher declared on the PyPI side pins.
  # -------------------------------------------------------------------------
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/iac-forge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # No `skip-existing` here, unlike TestPyPI: on PyPI, "this version
      # already exists" means we are republishing by mistake, and we want to
      # know it in red rather than watch the job pass without uploading
      # anything.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
