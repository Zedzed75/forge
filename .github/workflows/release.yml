# ---------------------------------------------------------------------------
# Publishing the `iac-forge` distribution to PyPI.
# ---------------------------------------------------------------------------
# Three names are in play and only one of them is this file's: the published
# distribution is `iac-forge`, the installed command stays `forge`, the
# imported package stays `forge`. See the comment on `name` in pyproject.toml.
#
# Authentication: **Trusted Publishing (OIDC)**, never a token. GitHub signs a
# short-lived OIDC token for this repository, this workflow and this
# environment; PyPI verifies it against the publisher declared on the PyPI
# side. No PyPI secret therefore exists in this repository, and there was
# nothing to leak the day it went public. `permissions: id-token: write` is
# what authorises requesting that token — without that line the upload fails
# with a 403, and it is the only permission the publish job adds.
#
# Two triggers, deliberately asymmetric:
#
#   push of a v* tag    -> the real PyPI. Irreversible: a version published on
#                          PyPI cannot be replaced, not even after deletion.
#                          Hence the tag/version guard and the gate below.
#   workflow_dispatch   -> build and gate only, publishing nothing. This is the
#                          dress rehearsal, run by hand as many times as we
#                          like.
#
# There is no TestPyPI job (decision D14, ZED-48 — the issue calls it D5, which
# had been taken by another decision by the time this landed). The rehearsal
# used to be an upload to test.pypi.org. It bought down one risk — "does the
# upload mechanism work" — at the price of a *second* Trusted Publisher form to
# be filled in by hand on another service, and that form is the step that failed
# on 2026-09-26 with `invalid-publisher`. It then blocked the release for twelve
# days on a question only the holder of that account could answer.
#
# The risk worth buying down is not "did an upload succeed" but "does the
# uploaded artifact work", and that is provable before anything leaves the
# runner. So the rehearsal moved here, into the `gate` job, which runs on both
# triggers and which nothing outside this repository can hold up.
#
# Prerequisite on the PyPI side (done once, by a human, in the web UI): declare
# a "pending publisher" on pypi.org for the `iac-forge` project, with owner
# `Zedzed75`, repository `forge`, workflow `release.yml` and environment `pypi`.
# One form, four fields — the first successful upload creates the project,
# reserves the name, and converts the pending publisher into an established one.
# ---------------------------------------------------------------------------
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The publish job widens that itself, and only for
# `id-token`.
permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------------
  # A single build. The gate and the upload consume EXACTLY the same files: if
  # the gate rebuilt on its own side, it would be worthless — we would have
  # validated an artifact PyPI is never going to receive.
  # -------------------------------------------------------------------------
  build:
    runs-on: ubuntu-24.04
    steps:
      # Every `uses:` below is pinned to a full commit SHA with the version in a
      # trailing comment, the form the publish action already used. It matters
      # more here than anywhere else in the repository: this job holds no
      # `id-token` permission and so cannot publish, but it can alter `dist/`
      # before the upload, and the job that does hold `id-token` then sends that
      # artifact to PyPI under our identity, as `iac-forge`. A PyPI version is
      # never replaceable, not even after deletion, so the distance between a
      # tampered build and a permanent bad release wearing our name is one job
      # boundary with no human step in it. A mutable tag is not an acceptable
      # entry point for that. Dependabot rewrites both the SHA and the comment
      # (.github/dependabot.yml).
      #
      # `fetch-depth: 0` so the tags are available: the guard below needs the
      # tag, and hatchling reads the version from the source file.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # `version:` and `checksum:` pin the uv this job installs, for the reason
      # the comment above gives about `uses:` -- and with more force, because
      # this is the job that produces the artifact the publish job uploads under
      # our identity. uv is the build frontend here (`uv build` below), so an
      # unpinned uv is an unpinned step in the path to a permanent PyPI release.
      # The pin, the checksum and the bump procedure are explained once, at the
      # matching step in ci.yml; keep the two numbers equal.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          # `true` / `false` / `auto`, and here it is a security choice rather
          # than the speed one it is in ci.yml. `false`: this job restores
          # nothing it did not build itself.
          #
          # The reason is the paragraph above about `dist/`. A restorable uv
          # cache is an input to the build whose output the publish job uploads
          # under our identity, and an Actions cache entry is writable by
          # anything that can run a workflow on the default branch. The exposure
          # is modest -- cache scoping means a fork PR cannot write the branch
          # scope, so the realistic writer already has push access -- but so is
          # the cost of declining it: `uv build` and `uvx twine check` resolve
          # the build-system requirements and nothing else, and releases are
          # rare. Upstream reached the same conclusion from its side, and
          # v10.0.0 made `auto` deliberately disable the cache for release, tag
          # push, `pull_request_target` and `workflow_run`
          # (astral-sh/setup-uv#984). This workflow triggers on tag push,
          # squarely in that set.
          #
          # `false` and not `auto`, which the pin would now honour. `auto` is
          # upstream's default, and its meaning already moved under us once: at
          # the v5.4.2 this step carried until recently it meant only "cache on
          # GitHub-hosted runners" and would have cached this very tag push.
          # Writing the posture out rather than inheriting it means the next
          # major cannot change what the publish path restores without this line
          # changing with it. Same argument as `prune-cache` in ci.yml.
          enable-cache: false
          python-version: "3.13"
          # No `cache-dependency-glob`. It computed the cache key, and there is
          # no longer a cache to key -- it keyed `pyproject.toml` rather than
          # `uv.lock` because this job never syncs the project environment, only
          # the build-system requirements. Re-enabling the cache means restoring
          # that line and that reasoning together, not finding it already here
          # doing nothing.

      - name: Build the sdist and the wheel
        run: uv build

      # `twine check --strict` and not `twine check`: without `--strict`, a
      # malformed long description is only a warning, and you only find out by
      # seeing the PyPI page render raw Markdown. In strict mode it is an
      # error here, before the upload.
      - name: Check the metadata
        run: uvx twine check --strict dist/*

      # The repository has already seen the version diverge from its tag:
      # `forge --version` announced 0.1.0 on a repository tagged v1.1.0. On
      # PyPI the same mistake is final, since a version is never republished.
      # So we compare the pushed tag against the produced file name, and
      # refuse before the upload.
      - name: Check that the tag matches the built version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's|.*/iac_forge-(.+)\.tar\.gz|\1|')
          echo "tag=${tag} built version=${built}"
          if [ "$tag" != "$built" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the built version ${built}" \
                 "— fix src/forge/__init__.py or the tag, then re-tag."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/

  # -------------------------------------------------------------------------
  # Pre-publish gate (decision D14, ZED-48). Installs the built wheel into a
  # clean virtualenv and generates real projects with it. Publishing is
  # `needs:`-gated on this job, so nothing reaches PyPI that has not generated
  # something first.
  #
  # It holds no `id-token` permission: it is the one job here that runs
  # repository code it did not build, and it must not be able to publish.
  # -------------------------------------------------------------------------
  gate:
    needs: build
    # `ubuntu-24.04` and not `ubuntu-latest`, per D10 — as every job in this
    # file now is. An earlier draft of this job said the other three "still
    # float, and pinning them is ZED-100's": that was true when it was written
    # and stopped being true when #80 landed. Re-deriving this file against the
    # newer `master` reintroduced `ubuntu-latest` on `build` and `pypi`, because
    # the draft had been written against a base that predated the pin. Worth the
    # footnote: on the publish path a floating label means the wheel that reaches
    # PyPI was built on an image nobody chose, and that is irreversible.
    runs-on: ubuntu-24.04
    steps:
      # The checkout is here only for `examples/*.yml`. The specs are the ones
      # the README documents, so the gate exercises what users are told to run
      # rather than a fixture invented for the gate. Nothing from this checkout
      # reaches the virtualenv -- see the assertion step below for why that is
      # checked rather than assumed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # Same pin and checksum as the build job, for the same reason and with
          # the same bump procedure (explained once, at the matching step in
          # ci.yml). Keep all three numbers equal.
          version: "0.12.23"
          checksum: "9167d72b3319674b6303c4cbe071854bba13ebdf3d76b1a7cbdc175471fb66d6"
          # `false`, the same security choice the build job makes and for the
          # same reason: a restorable Actions cache is an input that this job did
          # not build, and this job decides whether the artifact gets published.
          # A cache that can alter the environment the wheel is validated in can
          # make a bad wheel pass the gate, which is a worse failure than a slow
          # one. No `cache-dependency-glob` for the same reason it is absent
          # above -- there is no cache to key.
          enable-cache: false
          python-version: "3.13"

      # copier commits inside a temporary clone, which fails without a git
      # identity -- the same step ci.yml runs for the same reason.
      - name: Configure the git identity
        run: |
          git config --global user.name "forge-ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      # The virtualenv lives in `$RUNNER_TEMP`, OUTSIDE the checkout, and that is
      # the whole point of the job rather than an implementation detail.
      # `template_root()` prefers the repository root when the package sits two
      # levels below one carrying a `copier.yml`; a virtualenv created inside the
      # checkout would therefore resolve the templates back to the working tree,
      # the installed shape would never be exercised, and the gate would pass on
      # a wheel that ships no templates at all. That is exactly the ZED-12 bug.
      - name: Install the built wheel into a clean virtualenv
        run: |
          set -euo pipefail
          wheels=(dist/iac_forge-*-py3-none-any.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found ${#wheels[@]}"
            exit 1
          fi
          echo "installing ${wheels[0]}"
          uv venv --python 3.13 "${RUNNER_TEMP}/gate-venv"
          uv pip install --python "${RUNNER_TEMP}/gate-venv/bin/python" "${wheels[0]}"

      # Asserted, not assumed: if the templates resolved to the checkout, every
      # generation below would succeed while the published wheel stayed broken.
      # That is how ZED-12 shipped -- the bug was invisible to anything run from
      # a source tree, which is everything the test suite does.
      #
      # Then every registered domain's template subdirectory, because a wheel
      # that ships four of the five is a working `forge` that cannot produce one
      # domain, and no single generation below proves the absence of that.
      # `resolve_subdir` already raises when the directory is absent; the
      # `missing` list below catches the other shape, a subdirectory that exists
      # and is empty, which it accepts.
      - name: Check that the templates come from the installed package
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gate-venv/bin/python" - <<'PY'
          from forge.plugins_api.manager import default_manager
          from forge.render.copier_runner import (
              package_root,
              resolve_subdir,
              template_root,
          )

          root = template_root()
          print(f"template root: {root}")
          if root != package_root():
              raise SystemExit(
                  f"the gate resolved its templates to {root}, which is not the "
                  f"installed package ({package_root()}): it is testing the "
                  "working tree, not the wheel"
              )
          if not (root / "copier.yml").is_file():
              raise SystemExit(f"no copier.yml under {root}")

          manager = default_manager()
          missing = []
          for name in manager.domain_names():
              subdir = resolve_subdir(root, manager.domain(name).template_subdir())
              path = root / subdir
              count = len(list(path.rglob("*"))) if path.is_dir() else 0
              print(f"  {name}: {subdir} ({count} entries)")
              if count == 0:
                  missing.append(name)
          if missing:
              raise SystemExit(
                  "the distribution ships no template for: "
                  + ", ".join(missing)
                  + " -- check [tool.hatch.build] in pyproject.toml"
              )
          PY

      - name: Check the installed version
        run: |
          set -euo pipefail
          "${RUNNER_TEMP}/gate-venv/bin/forge" --version

      # Every example spec, not one of them: a wheel can ship four plugins'
      # templates and drop the fifth, and a single-spec gate would publish it.
      # The generation runs with `$RUNNER_TEMP` as its working directory, so a
      # path resolved against the current directory instead of the package would
      # fail here too.
      #
      # `forge generate` and not `forge new`: `new` is the interview and has no
      # non-interactive mode, so it cannot run unattended. Everything from
      # `pipeline.generate` onward -- which is where the template root is
      # resolved, and so everything this gate is about -- is the same code.
      - name: Generate every example project from the installed wheel
        run: |
          set -euo pipefail
          for spec in "${GITHUB_WORKSPACE}"/examples/*.yml; do
            name=$(basename "${spec}" .yml)
            out="${RUNNER_TEMP}/gate-out/${name}"
            echo "::group::forge generate -s ${name}.yml"
            (cd "${RUNNER_TEMP}" && "${RUNNER_TEMP}/gate-venv/bin/forge" generate \
              --spec "${spec}" --out "${out}")
            # A generation that writes nothing is a failure the command does not
            # report: `forge generate` is happy to produce an empty tree, and an
            # unpackaged template subdirectory looks exactly like that. The
            # threshold is 1 and not a per-spec count on purpose -- which domain
            # writes how many files is the business of the golden tests, and a
            # number duplicated here would only ever go stale.
            written=$(find "${out}" -type f -not -path '*/.git/*' | wc -l)
            echo "${name}: ${written} files"
            if [ "${written}" -lt 1 ]; then
              echo "::error::${name} generated nothing from the installed wheel"
              exit 1
            fi
            echo "::endgroup::"
          done

  # -------------------------------------------------------------------------
  # The real PyPI. Tag only, and behind a GitHub environment: that is where a
  # mandatory review rule gets hooked on if the board wants one, and it is the
  # name the publisher declared on the PyPI side pins.
  # -------------------------------------------------------------------------
  pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    # `needs: gate` and not `needs: build`: the gate is what makes this job
    # safe to reach, so it has to be upstream of it rather than beside it.
    needs: gate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/iac-forge
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist/

      # No `skip-existing`: on PyPI, "this version already exists" means we are
      # republishing by mistake, and we want to know it in red rather than watch
      # the job pass without uploading anything.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
