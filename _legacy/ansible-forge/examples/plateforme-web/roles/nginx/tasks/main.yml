---
# ---------------------------------------------------------------------------
# roles/nginx/tasks/main.yml — serveur web nginx
# ---------------------------------------------------------------------------
# Ordre d'exécution : installation, configuration globale, racine des
# documents, hôte virtuel, retrait du site par défaut, activation du
# service. Les fichiers de configuration sont validés par « nginx -t »
# avant d'être installés : une erreur de syntaxe n'interrompt pas le
# service en place.
#
# Fichier généré par ansible-forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

- name: Installer nginx
  ansible.builtin.package:
    name: nginx
    state: present

- name: Créer la racine des documents
  ansible.builtin.file:
    path: "{{ nginx_document_root }}"
    state: directory
    owner: "{{ nginx_user }}"
    group: "{{ nginx_user }}"
    mode: "0755"

- name: Déployer la configuration globale de nginx
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ nginx_config_dir ~ '/nginx.conf' }}"
    owner: root
    group: root
    mode: "0644"
    validate: nginx -t -c %s
  notify: Recharger nginx

- name: Déployer l'hôte virtuel principal
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "{{ nginx_config_dir ~ '/conf.d/' ~ nginx_server_name ~ '.conf' }}"
    owner: root
    group: root
    mode: "0644"
  notify: Recharger nginx

- name: Désactiver le site par défaut de la distribution
  ansible.builtin.file:
    path: "{{ nginx_default_site_path }}"
    state: absent
  when:
    - nginx_remove_default_site | bool
    - nginx_default_site_path | length > 0
  notify: Recharger nginx

- name: Activer et démarrer le service nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
