[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ansible-forge"
version = "0.1.0"
description = "Generateur deterministe de projets Ansible complets et commentes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
ansible-forge = "ansible_forge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/ansible_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
