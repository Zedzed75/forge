---
# ---------------------------------------------------------------------------
# forge.yml - Spécification du projet Ansible
# ---------------------------------------------------------------------------
# Ce fichier décrit entièrement le projet à générer. Il est rejouable :
#   ansible-forge generate --spec forge.yml
# produit exactement la même arborescence, octet pour octet.
#
# Éditez-le à la main puis relancez la génération ; ne modifiez pas
# 'spec_version' manuellement.
# ---------------------------------------------------------------------------
spec_version: 1
project_name: full-stack
description: Plateforme complète - web, conteneurs et base de données
author: Equipe Plateforme
os_family: debian
remote_user: deploy
become: true
ssh_port: 22
python_interpreter: auto_silent
environments:
  - name: prod
    hosts:
      webservers:
        - name: web-prod-01
          ansible_host: 10.30.0.11
          ansible_port: null
          ansible_user: null
          vars: {}
      dbservers:
        - name: db-prod-01
          ansible_host: 10.30.0.21
          ansible_port: null
          ansible_user: null
          vars: {}
    group_vars: {}
groups:
  - name: webservers
    description: Serveurs web frontaux
    roles:
      - common
      - users
      - ssh_hardening
      - firewall
      - nginx
      - docker
    vars: {}
  - name: dbservers
    description: Serveurs de base de données
    roles:
      - common
      - users
      - ssh_hardening
      - firewall
      - postgresql
    vars: {}
roles:
  - name: common
    options:
      timezone: Europe/Paris
      packages:
        - ca-certificates
        - curl
        - htop
        - vim
      manage_timezone: true
      enable_ntp: true
      manage_motd: true
  - name: users
    options:
      accounts:
        - name: deploy
          groups:
            - adm
          sudo: true
          shell: /bin/bash
          ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExempleDeCleFactice deploy@forge
          state: present
      manage_sudoers: true
      remove_absent_home: false
  - name: ssh_hardening
    options:
      port: 22
      permit_root_login: prohibit-password
      password_authentication: false
      pubkey_authentication: true
      x11_forwarding: false
      max_auth_tries: 3
      allow_groups: []
  - name: firewall
    options:
      backend: auto
      default_incoming_policy: deny
      default_outgoing_policy: allow
      allowed_tcp_ports:
        - 22
        - 80
        - 443
        - 5432
      allowed_udp_ports: []
      enabled: true
      log_level: low
  - name: nginx
    options:
      server_name: app.exemple.test
      document_root: /var/www/app
      listen_port: 80
      enable_https: false
      ssl_certificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
      ssl_certificate_key: /etc/ssl/private/ssl-cert-snakeoil.key
      remove_default_site: true
      worker_processes: auto
      client_max_body_size: 1m
  - name: docker
    options:
      channel: stable
      install_compose_plugin: true
      users_in_docker_group:
        - deploy
      log_driver: json-file
      log_max_size: 10m
      log_max_file: 3
      service_enabled: true
  - name: postgresql
    options:
      version: '16'
      listen_addresses: '*'
      port: 5432
      databases:
        - name: application
          owner: app
          encoding: UTF8
      db_users:
        - name: app
          password_var: vault_postgresql_app_password
          privileges: application:ALL
      hba_entries:
        - host application app 10.30.0.0/24 scram-sha-256
      max_connections: 100
options:
  use_vault: true
  write_lint_config: true
  embed_spec: true
  write_ci: false
