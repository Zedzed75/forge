---
# ---------------------------------------------------------------------------
# roles/firewall/tasks/firewalld.yml — pare-feu firewalld (RedHat et dérivés)
# ---------------------------------------------------------------------------
# Les règles sont posées à la fois en mémoire (immediate) et sur disque
# (permanent) afin de survivre à un redémarrage sans recharge manuelle.
#
# Fichier généré par ansible-forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

- name: Installer firewalld
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Activer et démarrer firewalld
  ansible.builtin.service:
    name: firewalld
    state: "{{ 'started' if firewall_enabled else 'stopped' }}"
    enabled: "{{ firewall_enabled }}"

- name: Ouvrir les ports TCP autorisés
  ansible.posix.firewalld:
    port: "{{ item ~ '/tcp' }}"
    zone: "{{ firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_tcp_ports }}"
  when: firewall_enabled | bool

- name: Ouvrir les ports UDP autorisés
  ansible.posix.firewalld:
    port: "{{ item ~ '/udp' }}"
    zone: "{{ firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_udp_ports }}"
  when: firewall_enabled | bool

- name: Appliquer la politique par défaut de la zone
  ansible.posix.firewalld:
    zone: "{{ firewall_zone }}"
    target: "{{ firewall_zone_target }}"
    permanent: true
    state: present
  when: firewall_enabled | bool
  notify: Recharger le pare-feu
