---
# ---------------------------------------------------------------------------
# forge.yml - Spécification du projet Ansible
# ---------------------------------------------------------------------------
# Ce fichier décrit entièrement le projet à générer. Il est rejouable :
#   ansible-forge generate --spec forge.yml
# produit exactement la même arborescence, octet pour octet.
#
# Éditez-le à la main puis relancez la génération ; ne modifiez pas
# 'spec_version' manuellement.
# ---------------------------------------------------------------------------
spec_version: 1
project_name: multi-env-infra
description: Plateforme applicative déployée sur trois environnements
author: Equipe Infra
os_family: debian
remote_user: deploy
become: true
ssh_port: 2222
python_interpreter: /usr/bin/python3
environments:
  - name: dev
    hosts:
      webservers:
        - name: web-dev-01
          ansible_host: 192.168.56.11
          ansible_port: null
          ansible_user: null
          vars: {}
      dbservers:
        - name: db-dev-01
          ansible_host: 192.168.56.21
          ansible_port: 22
          ansible_user: null
          vars: {}
    group_vars:
      all:
        ntp_server: 10.0.0.1
      webservers:
        web_worker_count: 2
  - name: staging
    hosts:
      webservers:
        - name: web-stg-01
          ansible_host: 10.20.0.11
          ansible_port: null
          ansible_user: null
          vars: {}
      dbservers:
        - name: db-stg-01
          ansible_host: 10.20.0.21
          ansible_port: null
          ansible_user: null
          vars: {}
    group_vars: {}
  - name: prod
    hosts:
      webservers:
        - name: web-prod-01
          ansible_host: 10.30.0.11
          ansible_port: null
          ansible_user: null
          vars: {}
        - name: web-prod-02
          ansible_host: 10.30.0.12
          ansible_port: null
          ansible_user: root
          vars: {}
      dbservers:
        - name: db-prod-01
          ansible_host: 10.30.0.21
          ansible_port: null
          ansible_user: null
          vars:
            db_shared_buffers: 4GB
    group_vars:
      all:
        ntp_server: 10.30.0.1
groups:
  - name: webservers
    description: Serveurs web frontaux
    roles:
      - common
    vars:
      web_worker_count: 4
  - name: dbservers
    description: Serveurs de base de données
    roles:
      - common
    vars: {}
roles:
  - name: common
    options:
      timezone: UTC
      packages:
        - ca-certificates
        - curl
        - rsync
      manage_timezone: true
      enable_ntp: true
      manage_motd: false
options:
  use_vault: true
  write_lint_config: true
  embed_spec: true
  write_ci: false
