# Spécification exerçant les sept rôles du catalogue.
spec_version: 1
project_name: full-stack
description: Plateforme complète - web, conteneurs et base de données
author: Equipe Plateforme
os_family: debian
remote_user: deploy
ssh_port: 22
groups:
  - name: webservers
    description: Serveurs web frontaux
    roles:
      - common
      - users
      - ssh_hardening
      - firewall
      - nginx
      - docker
  - name: dbservers
    description: Serveurs de base de données
    roles:
      - common
      - users
      - ssh_hardening
      - firewall
      - postgresql
roles:
  - name: users
    options:
      accounts:
        - name: deploy
          groups:
            - adm
          sudo: true
          shell: /bin/bash
          ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExempleDeCleFactice deploy@forge
          state: present
  - name: firewall
    options:
      allowed_tcp_ports:
        - 22
        - 80
        - 443
        - 5432
  - name: nginx
    options:
      server_name: app.exemple.test
      document_root: /var/www/app
  - name: docker
    options:
      users_in_docker_group:
        - deploy
  - name: postgresql
    options:
      version: '16'
      listen_addresses: '*'
      databases:
        - name: application
          owner: app
          encoding: UTF8
      db_users:
        - name: app
          password_var: vault_postgresql_app_password
          privileges: application:ALL
      hba_entries:
        - host application app 10.30.0.0/24 scram-sha-256
environments:
  - name: prod
    hosts:
      webservers:
        - name: web-prod-01
          ansible_host: 10.30.0.11
      dbservers:
        - name: db-prod-01
          ansible_host: 10.30.0.21
