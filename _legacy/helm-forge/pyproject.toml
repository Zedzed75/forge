[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "helm-forge"
version = "0.1.0"
description = "Generateur deterministe de projets Kubernetes/Helm entierement commentes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zed" }]
keywords = ["helm", "kubernetes", "generator", "scaffolding"]

# Dependances minimales, conformement a CLAUDE.md.
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
helm-forge = "helm_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/helm_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests d'integration exigent les binaires helm et kubeconform : ils sont
# sautes automatiquement lorsque ceux-ci sont absents de la machine.
markers = [
    "integration: necessite helm et/ou kubeconform installes",
]
addopts = "-q"
