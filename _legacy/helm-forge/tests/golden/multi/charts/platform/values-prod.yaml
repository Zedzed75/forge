# =============================================================================
# values-prod.yaml — surcharges de l'environnement « prod »
# =============================================================================
# Fichier généré par helm-forge. Il ne contient que les écarts par rapport à
# values.yaml : tout ce qui n'apparaît pas ici garde sa valeur par défaut.
#
# Namespace cible de cet environnement : platform
#
# Utilisation :
#   helm upgrade --install platform ./charts/platform \
#     --namespace platform --create-namespace \
#     --values ./charts/platform/values.yaml \
#     --values ./charts/platform/values-prod.yaml
#
# Le namespace n'est pas une valeur du chart : il est choisi par l'option
# --namespace de Helm. Il est rappelé ci-dessus à titre documentaire, et le
# Makefile du projet l'applique automatiquement.
# =============================================================================

global:
  # Alimente le label « environment » posé sur toutes les ressources, ce qui
  # permet de filtrer par environnement avec kubectl -l environment=prod.
  environment: prod

# -----------------------------------------------------------------------------
# Composant « api »
# -----------------------------------------------------------------------------
api:
  # Profil « prod » : 3 réplique(s).
  replicaCount: 3
  image:
    # Stratégie de tag « per_env » : renseignez ici le tag déployé sur
    # prod. Laissé vide, le chart retombe sur appVersion du Chart.yaml.
    tag: ""
  # Ressources ajustées pour cet environnement.
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: '2'
      memory: 1024Mi

# -----------------------------------------------------------------------------
# Composant « worker »
# -----------------------------------------------------------------------------
worker:
  # Profil « prod » : 3 réplique(s).
  replicaCount: 3
  image:
    # Stratégie de tag « per_env » : renseignez ici le tag déployé sur
    # prod. Laissé vide, le chart retombe sur appVersion du Chart.yaml.
    tag: ""
  # Ressources ajustées pour cet environnement.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi
