# ---------------------------------------------------------------------------
# copier.yml - forge's single root template
# ---------------------------------------------------------------------------
# One copier template for every plugin (decision DESIGN.md §8 Q2): `src_path`
# points at the root of this repository, and `_subdirectory` — supplied as an
# answer — selects the template of the domain being rendered. That is the only
# shape in which copier recognises a versioned template, and therefore the only
# one that makes `copier update` possible (MIGRATION.md §2.3).
#
# This file is never edited to add a domain: a plugin brings its own template
# subdirectory and declares it through `forge_template_subdir()`.
# ---------------------------------------------------------------------------

# The template actually rendered, chosen by the plugin being called.
_subdirectory: "[[ template_subdir ]]"

# Every generated domain keeps its own answers file: that is what makes it
# updatable independently (`forge update --only <domain>`).
_answers_file: .copier-answers.yml

# Only .jinja files are rendered; everything else is copied verbatim.
_templates_suffix: .jinja

# copier accepts no filters passed in from Python: they arrive as an extension.
# A plugin's own filters are loaded by ForgeExtension itself, through the
# FORGE_PLUGIN_JINJA environment variable (see forge/jinja_ext.py).
_jinja_extensions:
  - forge.jinja_ext.ForgeExtension

# ---------------------------------------------------------------------------
# Delimiters: [[ ]] / [% %] / [# #] for ALL plugins (decision Q1).
# Consequence: Helm and Ansible write {{ ... }} literally in their templates,
# with no raw block and no escaping helper.
# ---------------------------------------------------------------------------
_envops:
  block_start_string: "[%"
  block_end_string: "%]"
  variable_start_string: "[["
  variable_end_string: "]]"
  comment_start_string: "[#"
  comment_end_string: "#]"
  trim_blocks: true
  lstrip_blocks: true
  keep_trailing_newline: true

# ---------------------------------------------------------------------------
# Declared questions. IMPORTANT: only the questions declared here are recorded
# in .copier-answers.yml, so only they survive a `copier update`
# (MIGRATION.md §2.5). Hence this five-key shape rather than one question per
# business field (decision Q3).
# ---------------------------------------------------------------------------

# Name of the domain plugin being rendered (e.g. ansible, helm). Traceability.
plugin:
  type: str

# Template subdirectory, relative to the root of the forge repository.
template_subdir:
  type: str

# Specification format version, copied over from forge.yml.
forge_version:
  type: int
  default: 1

# Shared block of the specification: service identity and environments.
service:
  type: json

# Domain-specific section, as produced by its forge_answers() hook.
domain:
  type: json
