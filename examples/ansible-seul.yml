# ---------------------------------------------------------------------------
# Example: a service that needs NOTHING BUT Ansible.
# ---------------------------------------------------------------------------
# Machines to configure, no container, no infrastructure to create. That is a
# complete and frequent need — not a degraded version of anything.
#
#   forge generate -s examples/ansible-seul.yml -o /tmp/gateway
#
# Produces `ansible/` and nothing else: no Helm chart, no Terraform foundation.
# The `helm:` and `terraform:` sections are absent, so those domains are not
# generated. That is the only mechanism, and it has no exception.
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: gateway
  description: "Application gateway fronting the internal services"
  owner: "Platform Team"
  owner_email: platform@example.net
  environments:
    - name: staging
      domain: staging.example.net
    - name: prod
      domain: example.net
      production: true

ansible:
  # System family of the target machines: determines the package manager and the
  # paths the roles use.
  os_family: debian

  # SSH login account. Never root: the roles escalate privileges task by task,
  # which makes visible what actually needs them.
  remote_user: deploy
  ssh_port: 22

  options:
    # forge never writes a real secret. `use_vault: true` generates the
    # ansible-vault plumbing, not values.
    use_vault: false
    write_lint_config: true
    write_ci: false

  groups:
    - name: gateways
      description: "Gateways exposed to the outside"
      roles:
        - common
        - ssh_hardening
        - nginx

    - name: databases
      description: "PostgreSQL databases"
      roles:
        - common
        - postgresql

  # The machines, environment by environment. An environment declared in
  # `service:` but absent here produces an empty inventory — `forge validate`
  # reports it rather than letting it through in silence.
  hosts:
    staging:
      gateways:
        - name: gw-staging-01
          ansible_host: 10.20.0.11
      databases:
        - name: db-staging-01
          ansible_host: 10.20.0.21
    prod:
      gateways:
        - name: gw-prod-01
          ansible_host: 10.30.0.11
        - name: gw-prod-02
          ansible_host: 10.30.0.12
      databases:
        - name: db-prod-01
          ansible_host: 10.30.0.21
