# ---------------------------------------------------------------------------
# Example: two domains together, because this project needs both.
# ---------------------------------------------------------------------------
# Terraform creates the namespace and its budget; Helm deploys the service into
# it. This is ONE possible use, not the normal use — compare it with the
# single-domain examples next to it.
#
#   forge generate -s examples/foundation-and-chart.yml -o /tmp/inventory
#   forge validate -o /tmp/inventory
#
# What the second domain adds: `forge validate` compares what each domain claims
# to produce. Both declare the `namespaces` facet here — Terraform creates it,
# Helm deploys into it. If they stopped agreeing on its name, the chart would
# target a namespace nobody creates, and forge would say so. No "if terraform
# then helm" rule exists in the core: the comparison is generic.
#
# To regenerate only one of the two:
#
#   forge generate -s examples/foundation-and-chart.yml -o /tmp/inventory --only helm
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: inventory
  description: "Catalogue inventory service"
  owner: "Logistics Team"
  owner_email: logistics@example.net
  labels:
    tier: backend
  environments:
    - name: dev
      domain: dev.example.net
    - name: prod
      domain: example.net
      production: true

terraform:
  terraform_version: "~> 1.9"
  namespace_strategy: per_env
  resources:
    - namespace
    - quota
    - registry_secret
  backend:
    kind: gcs
    config:
      bucket: terraform-states-logistics
  kubernetes:
    auth: kubeconfig
    context_per_environment: true
  environments:
    prod:
      kube_context: logistics-prod
      quota:
        cpu: "8"
        memory: 16Gi
        pods: 60

helm:
  chart_version: 0.4.0
  app_version: "2026.08.1"
  kubernetes:
    version: "1.34"
  # The same strategy as Terraform: that is what makes both domains name the
  # same namespace. `forge validate` checks it rather than assuming it.
  namespace_strategy: per_env
  image:
    registry: ghcr.io
    repository: acme/inventory
    strategy: appVersion
    pull_secret_name: inventory-registry
  components:
    - name: api
      kind: deployment
      addons:
        - service
        - ingress
        - configmap
      container_port: 8080
      port_name: http
      ingress:
        base_domain: example.net
        tls: true
      config:
        keys:
          - LOG_LEVEL
          - CATALOG_URL
  environments:
    prod:
      log_level: warn
      components:
        api:
          replicas: 3
