# ---------------------------------------------------------------------------
# Example: a service that needs NOTHING BUT a Helm chart.
# ---------------------------------------------------------------------------
# The cluster already exists, the namespace is provided by the platform team,
# there is no machine to configure. What is left is packaging the service.
#
#   forge generate -s examples/helm-only.yml -o /tmp/storefront
#
# Produces `helm/` and nothing else. The `ansible:` and `terraform:` sections
# are absent, so those domains are not generated.
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: storefront
  description: "Online store"
  owner: "Product Team"
  owner_email: product@example.net
  labels:
    tier: frontend
  environments:
    - name: dev
      domain: dev.example.net
    - name: prod
      domain: example.net
      production: true

helm:
  # Version of the chart itself, to bump on every template change.
  chart_version: 1.0.0

  # Version of the packaged application. Used as the default image tag with the
  # `appVersion` strategy.
  app_version: "2026.08.1"

  kubernetes:
    # Target cluster version: determines the apiVersions used and the version
    # kubeconform validates the rendered manifests against.
    version: "1.34"

  # `per_env` derives `<service>-<env>`: storefront-dev, storefront-prod.
  namespace_strategy: per_env

  image:
    registry: ghcr.io
    repository: acme/storefront
    # appVersion | per_env | fixed — where the image tag comes from.
    strategy: appVersion

  components:
    # Workload exposed to the outside.
    - name: api
      kind: deployment
      addons:
        - service
        - ingress
        - configmap
        - hpa
        - pdb
        - serviceaccount
      container_port: 8080
      port_name: http
      ingress:
        base_domain: example.net
        tls: true
      config:
        keys:
          - LOG_LEVEL
          - DATABASE_HOST

    # Background processing: neither Service nor Ingress.
    - name: worker
      kind: deployment
      addons:
        - configmap
      container_port: 9000
      config:
        keys:
          - QUEUE_NAME

  environments:
    prod:
      log_level: warn
      components:
        api:
          replicas: 4
