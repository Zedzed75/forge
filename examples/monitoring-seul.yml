# ---------------------------------------------------------------------------
# Example: a service that needs NOTHING BUT monitoring.
# ---------------------------------------------------------------------------
# The service already exists, it is deployed by other means, and what is
# missing is knowing when it goes wrong. The monitoring domain reads no other
# section: what it watches is declared here, and nowhere else.
#
#   forge generate -s examples/monitoring-seul.yml -o /tmp/payments
#
# Produces `monitoring/` and nothing else.
#
# Every alerting rule comes with a unit test played by `promtool test rules`:
# that is the only check proving an alert actually fires. A flawless-looking
# rule can name a metric that does not exist and stay silent forever.
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: payments
  description: "Payment service"
  owner: "Transactions Team"
  owner_email: transactions@example.net
  environments:
    - name: staging
      domain: staging.example.net
    - name: prod
      domain: example.net
      production: true

monitoring:
  scrape:
    # The timeout must stay below the interval, otherwise scrapes overlap. The
    # model refuses it.
    interval: 15s
    timeout: 10s
    metrics_path: /metrics

  metrics:
    # These names depend on the application's client library. Getting them wrong
    # produces a valid and permanently silent rule.
    requests_total: http_requests_total
    request_duration_seconds: http_request_duration_seconds
    status_label: status

  # Selected families. The choice also applies INSIDE a domain: a family absent
  # from here produces neither rule nor test.
  rules:
    - availability
    - error_rate
    - latency
    - probe

  environments:
    staging:
      targets:
        - payments-staging.example.net:9090
      probe_urls:
        - https://payments.staging.example.net
      thresholds:
        # More permissive outside production: we want to know, not to be woken.
        error_rate: 0.15
        latency_p95_seconds: 3

    prod:
      targets:
        - payments-1.example.net:9090
        - payments-2.example.net:9090
      probe_urls:
        - https://payments.example.net
      thresholds:
        error_rate: 0.01
        latency_p95_seconds: 0.5
        certificate_days: 30

  extras:
    makefile: true
    dashboard: true
