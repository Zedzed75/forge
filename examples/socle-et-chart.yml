# ---------------------------------------------------------------------------
# Exemple : deux domaines ensemble, parce que ce projet-là en a besoin.
# ---------------------------------------------------------------------------
# Terraform crée le namespace et son budget ; Helm y déploie le service. C'est
# UN usage possible, pas l'usage normal — comparez avec les trois exemples
# mono-domaine à côté.
#
#   forge generate -s examples/socle-et-chart.yml -o /tmp/inventaire
#   forge validate -o /tmp/inventaire
#
# Ce que le second domaine apporte : `forge validate` compare ce que chaque
# domaine affirme produire. Les deux déclarent ici la facette `namespaces` —
# Terraform le crée, Helm y déploie. S'ils cessaient de s'accorder sur son nom,
# le chart viserait un namespace que personne ne crée, et forge le dirait.
# Aucune règle « si terraform alors helm » n'existe dans le cœur : la
# comparaison est générique.
#
# Pour ne régénérer qu'un des deux :
#
#   forge generate -s examples/socle-et-chart.yml -o /tmp/inventaire --only helm
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: inventaire
  description: "Service d'inventaire du catalogue"
  owner: "Equipe Logistique"
  owner_email: logistique@example.net
  labels:
    tier: backend
  environments:
    - name: dev
      domain: dev.example.net
    - name: prod
      domain: example.net
      production: true

terraform:
  terraform_version: "~> 1.9"
  namespace_strategy: per_env
  resources:
    - namespace
    - quota
    - registry_secret
  backend:
    kind: gcs
    config:
      bucket: etats-terraform-logistique
  kubernetes:
    auth: kubeconfig
    context_per_environment: true
  environments:
    prod:
      kube_context: logistique-prod
      quota:
        cpu: "8"
        memory: 16Gi
        pods: 60

helm:
  chart_version: 0.4.0
  app_version: "2026.08.1"
  kubernetes:
    version: "1.34"
  # La même stratégie que Terraform : c'est ce qui fait que les deux domaines
  # nomment le même namespace. `forge validate` le vérifie plutôt que de le
  # supposer.
  namespace_strategy: per_env
  image:
    registry: ghcr.io
    repository: acme/inventaire
    strategy: appVersion
    pull_secret_name: inventaire-registry
  components:
    - name: api
      kind: deployment
      addons:
        - service
        - ingress
        - configmap
      container_port: 8080
      port_name: http
      ingress:
        base_domain: example.net
        tls: true
      config:
        keys:
          - LOG_LEVEL
          - CATALOG_URL
  environments:
    prod:
      log_level: warn
      components:
        api:
          replicas: 3
