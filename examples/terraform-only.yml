# ---------------------------------------------------------------------------
# Example: a service that needs NOTHING BUT Terraform.
# ---------------------------------------------------------------------------
# Laying the foundation — the partition, its budget, the identity that deploys
# into it — without deploying anything yourself. That is the need of a platform
# team preparing the ground for product teams.
#
#   forge generate -s examples/terraform-only.yml -o /tmp/foundation
#
# Produces `terraform/` and nothing else. The `ansible:` and `helm:` sections
# are absent, so those domains are not generated.
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: foundation
  description: "Landing foundation for the product team's services"
  owner: "Platform Team"
  owner_email: platform@example.net
  environments:
    - name: dev
    - name: prod
      production: true

terraform:
  # A constraint, never a bare version: a version pinned to one exact patch is
  # almost always a typo, and the model refuses it.
  terraform_version: "~> 1.9"

  # `per_env` derives `<service>-<env>`: foundation-dev, foundation-prod.
  namespace_strategy: per_env

  # Selected families. The choice also applies INSIDE a domain: a family absent
  # from here produces no file at all.
  resources:
    - namespace
    - quota
    - service_account

  backend:
    # local | s3 | gcs | azurerm | http. `forge validate` reports local state on
    # a production environment: neither locking nor encryption.
    kind: s3
    config:
      bucket: platform-terraform-state
      region: eu-west-3
      encrypt: "true"
      # `key` is NOT asked for here: it is derived per environment, so that two
      # roots never write the same state.

  kubernetes:
    auth: kubeconfig
    # With no named context, Terraform applies against the machine's current
    # context. Leave this at `true`.
    context_per_environment: true

  environments:
    dev:
      quota:
        cpu: "2"
        memory: 4Gi
        pods: 20
    prod:
      kube_context: platform-prod-eu-west-3
      quota:
        cpu: "16"
        memory: 32Gi
        pods: 120
