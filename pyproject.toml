[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forge"
# Version lue dans src/forge/__init__.py : une seule source. Elle etait
# dupliquee ici et la, et les deux avaient deja diverge — `forge --version`
# annoncait 0.1.0 sur un depot tague v1.1.0.
dynamic = ["version"]
description = "Generateur deterministe de projets IaC complets et commentes, a base de plugins"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "copier>=9.7",
    "pluggy>=1.5",
    "typer>=0.12",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
forge = "forge.cli:app"

[tool.hatch.version]
path = "src/forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: necessite un outil externe (helm, ansible-lint, wsl)",
]
