[build-system]
# Plancher explicite : `license-files` et l'expression SPDX de PEP 639 ne sont
# comprises qu'a partir de hatchling 1.27. Sans ce minimum, une version plus
# ancienne tiree d'un cache produirait des metadonnees muettes sur la licence.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Nom de distribution, et lui seul. Trois noms sont en jeu ici, et ils ne sont
# volontairement PAS alignes :
#
#   distribution (ce que PyPI indexe)     iac-forge  <- cette ligne, elle seule
#   commande installee (ce qu'on tape)    forge      <- [project.scripts] plus bas
#   paquet importe (ce que le code lit)   forge      <- src/forge, inchange
#
# `forge` est deja pris sur PyPI par un projet sans rapport : `pip install forge`
# ne sera jamais nous. L'utilisateur tape `pip install iac-forge` une fois, puis
# `forge` pour toujours. Aligner la commande ou le paquet importe sur le nom de
# distribution casserait toutes les lignes de commande et tous les imports
# existants sans rien apporter — le nom de distribution est le seul que PyPI
# contraigne.
name = "iac-forge"
# Version lue dans src/forge/__init__.py : une seule source. Elle etait
# dupliquee ici et la, et les deux avaient deja diverge — `forge --version`
# annoncait 0.1.0 sur un depot tague v1.1.0.
dynamic = ["version"]
description = "Plugin-based deterministic generator of complete, commented IaC projects"
# Table explicite plutot que la forme courte. `readme = "README.md"` laisse le
# backend *deduire* le type de contenu du suffixe ; PyPI rend la page du projet
# d'apres le `Description-Content-Type` declare, et un type absent ou faux y
# affiche le Markdown brut. Le declarer supprime la deduction.
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
# Forme PEP 639 : une expression SPDX, plus le fichier de licence declare a
# part. La table `{ text = "MIT" }` est obsolete et n'embarquait aucun fichier
# dans la distribution — le depot annoncait MIT sans en livrer le texte.
license = "MIT"
license-files = ["LICENSE"]
# Les mots-clefs sont ce sur quoi la recherche PyPI indexe. Ils nomment les cinq
# domaines livres, pas des generalites : quelqu'un qui cherche « ansible
# generator » ou « helm scaffold » doit tomber dessus.
keywords = [
    "iac",
    "infrastructure-as-code",
    "generator",
    "scaffolding",
    "ansible",
    "helm",
    "terraform",
    "prometheus",
    "ci-cd",
    "copier",
    "jinja2",
]
# Deux pieges dans cette liste, tous deux verifies contre les trove classifiers
# de PyPI :
#
# 1. Pas de « License :: OSI Approved :: MIT License ». La licence est declaree
#    plus haut comme expression SPDX (PEP 639), ce qui produit un champ
#    `License-Expression` en metadata 2.4 ; PyPI *rejette* un envoi qui porte a
#    la fois ce champ et un classifier `License ::`. Les deux formes ne
#    coexistent pas, et c'est l'expression qu'on garde.
# 2. « 4 - Beta » et non « 5 - Production/Stable » malgre le tag v1.1.0 : le
#    paquet n'a jamais ete installe par personne hors de ce depot. On passera en
#    Production/Stable quand des retours d'usage reel le justifieront, pas parce
#    que le numero de version y ressemble.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "copier>=9.7",
    "pluggy>=1.5",
    "typer>=0.12",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Les liens de la colonne de droite sur la page PyPI. Sans eux, la page ne donne
# aucun moyen d'atteindre le code, de signaler un bug ou de lire la licence :
# c'est la difference entre un paquet publie et un paquet adoptable.
#
# `Changelog` doit rester identique a `CHANGELOG_URL` dans src/forge/cli.py :
# c'est l'URL que `forge update` affiche a l'utilisateur avant de toucher a son
# projet genere. Deux orthographes de la meme adresse, c'est une de trop.
[project.urls]
Homepage = "https://github.com/Zedzed75/forge"
Repository = "https://github.com/Zedzed75/forge"
Issues = "https://github.com/Zedzed75/forge/issues"
Documentation = "https://github.com/Zedzed75/forge#readme"
Changelog = "https://github.com/Zedzed75/forge/blob/master/CHANGELOG.md"

# Le nom de la commande, et il ne suit PAS le nom de la distribution : on
# installe `iac-forge` et on tape `forge`. Voir le commentaire de `name` plus
# haut. Ne pas renommer.
[project.scripts]
forge = "forge.cli:app"

[tool.hatch.version]
path = "src/forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

# The template root has to exist inside the wheel, or an installed forge cannot
# render anything (DESIGN.md §8 Q2-bis). `packages` carries everything under
# `src/forge/`, which is where the domain templates already live -- but
# `copier.yml` and `partials/` sit at the REPOSITORY root, because that is the
# only shape in which copier sees a versioned template and so the only one in
# which `forge update` works from a checkout. They are therefore copied into the
# package at build time rather than moved: one source of truth in the repository,
# one copy in the distribution.
#
# `tests/test_cli.py::test_the_wheel_ships_the_whole_template_root` asserts both
# land where the renderer looks for them. Do not trust this table without it --
# non-.py files are the usual trap of a build backend.
[tool.hatch.build.targets.wheel.force-include]
"copier.yml" = "forge/copier.yml"
"partials" = "forge/partials"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: necessite un outil externe (helm, ansible-lint, wsl)",
]
