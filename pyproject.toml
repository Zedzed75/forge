[build-system]
# Explicit floor: `license-files` and PEP 639's SPDX expression are only
# understood from hatchling 1.27 onwards. Without this minimum, an older
# version pulled from a cache would produce metadata silent about the licence.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# The distribution name, and nothing else. Three names are in play here, and
# they are deliberately NOT aligned:
#
#   distribution (what PyPI indexes)     iac-forge  <- this line, and only this
#   installed command (what you type)    forge      <- [project.scripts] below
#   imported package (what code reads)   forge      <- src/forge, unchanged
#
# `forge` is already taken on PyPI by an unrelated project: `pip install forge`
# will never be us. The user types `pip install iac-forge` once, then `forge`
# forever. Aligning the command or the imported package on the distribution
# name would break every existing command line and every existing import for
# no gain — the distribution name is the only one PyPI constrains.
name = "iac-forge"
# The version is read from src/forge/__init__.py: a single source. It used to
# be duplicated here as well, and the two had already diverged — `forge
# --version` announced 0.1.0 on a repository tagged v1.1.0.
dynamic = ["version"]
description = "Plugin-based deterministic generator of complete, commented IaC projects"
# An explicit table rather than the short form. `readme = "README.md"` lets
# the backend *infer* the content type from the suffix; PyPI renders the
# project page from the declared `Description-Content-Type`, and a missing or
# wrong type shows raw Markdown there. Declaring it removes the inference.
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
# PEP 639 form: an SPDX expression, plus the licence file declared separately.
# The `{ text = "MIT" }` table is obsolete and shipped no file at all in the
# distribution — the repository announced MIT without delivering its text.
license = "MIT"
license-files = ["LICENSE"]
# The keywords are what PyPI search indexes on. They name the five delivered
# domains, not generalities: somebody searching for "ansible generator" or
# "helm scaffold" has to land on this.
keywords = [
    "iac",
    "infrastructure-as-code",
    "generator",
    "scaffolding",
    "ansible",
    "helm",
    "terraform",
    "prometheus",
    "ci-cd",
    "copier",
    "jinja2",
]
# Two traps in this list, both checked against PyPI's trove classifiers:
#
# 1. No "License :: OSI Approved :: MIT License". The licence is declared above
#    as an SPDX expression (PEP 639), which produces a `License-Expression`
#    field in metadata 2.4; PyPI *rejects* an upload carrying both that field
#    and a `License ::` classifier. The two forms do not coexist, and the
#    expression is the one we keep.
# 2. "4 - Beta" and not "5 - Production/Stable" despite the v1.1.0 tag: the
#    package has never been installed by anyone outside this repository. We
#    will move to Production/Stable when real usage feedback justifies it, not
#    because the version number looks like it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Code Generators",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "copier>=9.7",
    "pluggy>=1.5",
    "typer>=0.12",
    "questionary>=2.0",
    "pyyaml>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# The links in the right-hand column of the PyPI page. Without them the page
# offers no way to reach the code, report a bug or read the licence: that is
# the difference between a published package and an adoptable one.
#
# `Changelog` must stay identical to `CHANGELOG_URL` in src/forge/cli.py: that
# is the URL `forge update` shows the user before touching their generated
# project. Two spellings of the same address is one too many.
[project.urls]
Homepage = "https://github.com/Zedzed75/forge"
Repository = "https://github.com/Zedzed75/forge"
Issues = "https://github.com/Zedzed75/forge/issues"
Documentation = "https://github.com/Zedzed75/forge#readme"
Changelog = "https://github.com/Zedzed75/forge/blob/master/CHANGELOG.md"

# The command name, and it does NOT follow the distribution name: you install
# `iac-forge` and you type `forge`. See the comment on `name` above. Do not
# rename.
[project.scripts]
forge = "forge.cli:app"

[tool.hatch.version]
path = "src/forge/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/forge"]

# The template root has to exist inside the wheel, or an installed forge cannot
# render anything (DESIGN.md §8 Q2-bis). `packages` carries everything under
# `src/forge/`, which is where the domain templates already live -- but
# `copier.yml` and `partials/` sit at the REPOSITORY root, because that is the
# only shape in which copier sees a versioned template and so the only one in
# which `forge update` works from a checkout. They are therefore copied into the
# package at build time rather than moved: one source of truth in the repository,
# one copy in the distribution.
#
# `tests/test_cli.py::test_the_wheel_ships_the_whole_template_root` asserts both
# land where the renderer looks for them. Do not trust this table without it --
# non-.py files are the usual trap of a build backend.
[tool.hatch.build.targets.wheel.force-include]
"copier.yml" = "forge/copier.yml"
"partials" = "forge/partials"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires an external tool (helm, ansible-lint, wsl)",
]
