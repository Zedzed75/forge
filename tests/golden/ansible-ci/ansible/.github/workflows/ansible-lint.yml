---
# ---------------------------------------------------------------------------
# .github/workflows/ansible-lint.yml — quality gate of the project
# ---------------------------------------------------------------------------
# Replays on every push the two checks the project requires:
# the syntax of each environment, and ansible-lint.
# ansible-core does not support Windows as a control node: this workflow
# is the authority if you develop on Windows.
# Each action is pinned to a commit SHA rather than to a tag. A tag can be
# repointed at new code by whoever owns the action, and this job runs in
# your repository with your permissions -- a moved tag is code you never
# reviewed, running where you cannot see it. The comment beside each SHA
# is the release that SHA is.
# A pin does not update itself. Add a `.github/dependabot.yml` enabling the
# `github-actions` ecosystem and these pins become update pull requests you
# read before merging, which is the posture forge keeps on its own CI.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

name: ansible-lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install ansible-core and ansible-lint
        run: python -m pip install --upgrade ansible-core ansible-lint

      - name: Install the Galaxy collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Check the syntax of the prod environment
        run: ansible-playbook -i inventories/prod playbooks/site.yml --syntax-check

      - name: Run ansible-lint
        run: ansible-lint
