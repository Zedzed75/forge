# ---------------------------------------------------------------------------
# playbooks/gateways.yml — configuration of the "gateways" group
# ---------------------------------------------------------------------------
# Passerelles exposées
# Targeted run:
#   ansible-playbook -i inventories/<env> playbooks/gateways.yml
# Partial run by tag:
#   ansible-playbook -i inventories/<env> playbooks/gateways.yml --tags common
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

- name: Apply the configuration of the "gateways" group
  hosts: gateways
  # Privilege escalation: most system tasks require it.
  become: true
  # Fact gathering is needed by the roles that adapt their behaviour to the
  # detected distribution.
  gather_facts: true

  roles:
    # System baseline: base packages, time zone, NTP synchronisation, MOTD banner.
    - role: common
      tags:
        - common
        - base

    # OpenSSH hardening: root login, password authentication, limits.
    - role: ssh_hardening
      tags:
        - ssh
        - security
        - hardening
