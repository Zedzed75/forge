---
# ---------------------------------------------------------------------------
# roles/common/defaults/main.yml — valeurs par défaut du rôle
# ---------------------------------------------------------------------------
# Socle système : paquets de base, fuseau horaire, synchronisation NTP, bannière MOTD.
# Ces valeurs ont la précédence la plus faible : n'importe quel fichier
# group_vars ou host_vars les surcharge. Modifiez-les de préférence là-bas
# plutôt qu'ici, afin de garder le rôle réutilisable tel quel.
#
# Fichier généré par forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

# Fuseau horaire appliqué à toutes les machines du groupe.
# Valeurs admises : identifiant de la base tz, par exemple 'Europe/Paris' ou 'UTC'.
common_timezone: Europe/Paris

# Paquets installés sur toutes les machines du groupe.
# Valeurs admises : liste de noms de paquets valides pour la famille d'OS ciblée.
common_packages:
  - ca-certificates
  - curl
  - htop
  - vim

# Active la configuration du fuseau horaire par le rôle.
# Valeurs admises : true ou false.
common_manage_timezone: true

# Installe et active la synchronisation horaire (systemd-timesyncd).
# Valeurs admises : true ou false.
common_enable_ntp: true

# Déploie un fichier /etc/motd décrivant le rôle de la machine.
# Valeurs admises : true ou false.
common_manage_motd: true
