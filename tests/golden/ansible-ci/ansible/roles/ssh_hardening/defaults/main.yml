---
# ---------------------------------------------------------------------------
# roles/ssh_hardening/defaults/main.yml — default values of the role
# ---------------------------------------------------------------------------
# OpenSSH hardening: root login, password authentication, limits.
# These values have the lowest precedence: any group_vars or host_vars
# file overrides them. Prefer changing them there rather than here, so
# that the role stays reusable as it is.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

# TCP port sshd listens on.
# Allowed values: integer from 1 to 65535.
ssh_hardening_port: 22

# Value of the PermitRootLogin directive.
# Allowed values: yes, no, prohibit-password or forced-commands-only.
ssh_hardening_permit_root_login: prohibit-password

# Value of the PasswordAuthentication directive.
# Allowed values: true or false.
ssh_hardening_password_authentication: false

# Value of the PubkeyAuthentication directive.
# Allowed values: true or false.
ssh_hardening_pubkey_authentication: true

# Value of the X11Forwarding directive.
# Allowed values: true or false.
ssh_hardening_x11_forwarding: false

# Value of the MaxAuthTries directive.
# Allowed values: integer from 1 to 10.
ssh_hardening_max_auth_tries: 3

# Value of the AllowGroups directive; empty disables the directive.
# Allowed values: list of system group names.
ssh_hardening_allow_groups: []
