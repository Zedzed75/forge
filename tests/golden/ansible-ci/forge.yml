---
# ---------------------------------------------------------------------------
# forge.yml - Service specification
# ---------------------------------------------------------------------------
# This file describes in full what has to be generated. It is replayable:
#   forge generate --spec forge.yml
# produces exactly the same tree, byte for byte.
#
# Edit it by hand, then run the generator again; do not edit
# 'forge_version' yourself.
#
# Domains generated by this specification:
#   - ansible
# ---------------------------------------------------------------------------
forge_version: 1
service:
  name: passerelle
  description: Passerelle applicative
  owner: Equipe Plateforme
  environments:
    - name: prod
      production: true
ansible:
  os_family: debian
  remote_user: deploy
  ssh_port: 22
  options:
    use_vault: false
    write_lint_config: true
    write_ci: true
  groups:
    - name: gateways
      description: Passerelles exposées
      roles:
        - common
        - ssh_hardening
  hosts:
    prod:
      gateways:
        - name: gw-prod-01
          ansible_host: 10.30.0.11
