---
# ---------------------------------------------------------------------------
# forge.yml - Specification du service
# ---------------------------------------------------------------------------
# Ce fichier decrit entierement ce qui doit etre genere. Il est rejouable :
#   forge generate --spec forge.yml
# produit exactement la meme arborescence, octet pour octet.
#
# Editez-le a la main puis relancez la generation ; ne modifiez pas
# 'forge_version' manuellement.
#
# Domaines generes par cette specification :
#   - ansible
# ---------------------------------------------------------------------------
forge_version: 1
service:
  name: passerelle
  description: Passerelle applicative
  owner: Equipe Plateforme
  environments:
    - name: prod
      production: true
ansible:
  os_family: debian
  remote_user: deploy
  ssh_port: 22
  options:
    use_vault: false
    write_lint_config: true
    write_ci: true
  groups:
    - name: gateways
      description: Passerelles exposées
      roles:
        - common
        - ssh_hardening
  hosts:
    prod:
      gateways:
        - name: gw-prod-01
          ansible_host: 10.30.0.11
