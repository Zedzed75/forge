# ---------------------------------------------------------------------------
# forge.yml - Service specification
# ---------------------------------------------------------------------------
# This file describes in full what has to be generated. It is replayable:
#   forge generate --spec forge.yml
# produces exactly the same tree, byte for byte.
#
# Edit it by hand, then run the generator again; do not edit
# 'forge_version' yourself.
#
# Domains generated by this specification:
#   - demo
# ---------------------------------------------------------------------------
forge_version: 1
service:
  name: boutique
  description: Boutique en ligne de demonstration
  owner: Equipe Plateforme
  owner_email: plateforme@example.net
  labels:
    app.kubernetes.io/part-of: commerce
    tier: frontend
  environments:
    - name: dev
      domain: dev.example.net
    - name: prod
      domain: example.net
      production: true
demo:
  greeting: bonjour
  widgets:
    - name: cpu
      kind: gauge
      detailed: true
    - name: requetes
      kind: counter
