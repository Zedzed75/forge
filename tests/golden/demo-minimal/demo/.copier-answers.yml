# ---------------------------------------------------------------------------
# Reponses copier du domaine « demo ».
# ---------------------------------------------------------------------------
# Genere par forge. Ce fichier permet de rejouer la generation et d'appliquer
# les evolutions de gabarit avec :
#   forge update --only demo
# Ne le modifiez pas a la main : editez forge.yml a la racine du projet.
# ---------------------------------------------------------------------------
_commit: <commit>
_src_path: <src>
domain:
    environments:
    -   name: prod
        production: true
    greeting: bonjour
    widgets:
    -   detailed: false
        kind: log
        name: sante
forge_version: 1
plugin: demo
service:
    description: Service minimal
    environments:
    -   domain: null
        name: prod
        production: true
    labels: {}
    name: api
    owner: Equipe Plateforme
    owner_email: null
template_subdir: src/forge/plugins/demo/template

