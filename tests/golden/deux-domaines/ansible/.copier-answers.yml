forge_version: 1
plugin: ansible
service:
    description: Boutique en ligne, deployee sur Kubernetes et administree par Ansible
    environments:
    -   domain: null
        name: dev
        production: false
    -   domain: example.net
        name: prod
        production: true
    labels:
        app.kubernetes.io/part-of: commerce
        tier: frontend
    name: boutique
    owner: Equipe Plateforme
    owner_email: plateforme@example.net
template_subdir: src/forge/plugins/ansible/template

