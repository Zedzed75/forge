---
# ---------------------------------------------------------------------------
# playbooks/dbservers.yml — configuration du groupe « dbservers »
# ---------------------------------------------------------------------------
# Serveurs de base de donnees, hors cluster
# Exécution ciblée :
#   ansible-playbook -i inventories/<env> playbooks/dbservers.yml
# Exécution partielle par étiquette :
#   ansible-playbook -i inventories/<env> playbooks/dbservers.yml --tags common
#
# Fichier généré par forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

- name: Appliquer la configuration du groupe « dbservers »
  hosts: dbservers
  # Escalade de privilèges : la plupart des tâches système l'exigent.
  become: true
  # La collecte des faits est nécessaire aux rôles qui adaptent leur
  # comportement à la distribution détectée.
  gather_facts: true

  roles:
    # Socle système : paquets de base, fuseau horaire, synchronisation NTP, bannière
    # MOTD.
    - role: common
      tags:
        - common
        - base

    # Comptes locaux : création, groupes secondaires, sudo et clés SSH autorisées.
    - role: users
      tags:
        - users
        - security

    # Durcissement OpenSSH : connexion root, authentification par mot de passe, limites.
    - role: ssh_hardening
      tags:
        - ssh
        - security
        - hardening

    # Pare-feu local : ufw (Debian) ou firewalld (RedHat), politique par défaut et ports
    # ouverts.
    - role: firewall
      tags:
        - firewall
        - security

    # Serveur PostgreSQL : installation, écoute réseau, bases, rôles et règles pg_hba.
    - role: postgresql
      tags:
        - postgresql
        - database
