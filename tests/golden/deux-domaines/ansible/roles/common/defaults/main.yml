---
# ---------------------------------------------------------------------------
# roles/common/defaults/main.yml — default values of the role
# ---------------------------------------------------------------------------
# System baseline: base packages, time zone, NTP synchronisation, MOTD banner.
# These values have the lowest precedence: any group_vars or host_vars
# file overrides them. Prefer changing them there rather than here, so
# that the role stays reusable as it is.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

# Time zone applied to every machine of the group.
# Allowed values: identifier from the tz database, for instance 'Europe/Paris' or 'UTC'.
common_timezone: Europe/Paris

# Packages installed on every machine of the group.
# Allowed values: list of package names valid for the targeted OS family.
common_packages:
  - ca-certificates
  - curl
  - htop
  - vim

# Enables the configuration of the time zone by the role.
# Allowed values: true or false.
common_manage_timezone: true

# Installs and enables time synchronisation (systemd-timesyncd).
# Allowed values: true or false.
common_enable_ntp: true

# Deploys an /etc/motd file describing the purpose of the machine.
# Allowed values: true or false.
common_manage_motd: true
