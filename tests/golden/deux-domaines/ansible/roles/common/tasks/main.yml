---
# ---------------------------------------------------------------------------
# roles/common/tasks/main.yml — system baseline applied to every machine
# ---------------------------------------------------------------------------
# Order of execution: base packages, time zone, time synchronisation,
# then the MOTD banner. Every block is guarded by a variable so that it
# can be switched off without editing the role.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

- name: Install the base packages
  ansible.builtin.package:
    name: "{{ common_packages }}"
    state: present
  when: common_packages | length > 0

- name: Configure the time zone of the machine
  community.general.timezone:
    name: "{{ common_timezone }}"
  when: common_manage_timezone | bool

- name: Install the time synchronisation package
  ansible.builtin.package:
    name: "{{ common_ntp_package }}"
    state: present
  when: common_enable_ntp | bool

- name: Enable and start the time synchronisation service
  ansible.builtin.service:
    name: "{{ common_ntp_service }}"
    state: started
    enabled: true
  when: common_enable_ntp | bool

- name: Deploy the MOTD banner of the project
  ansible.builtin.template:
    src: motd.j2
    dest: /etc/motd
    owner: root
    group: root
    mode: "0644"
  when: common_manage_motd | bool
