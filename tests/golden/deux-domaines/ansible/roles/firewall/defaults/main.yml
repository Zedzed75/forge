---
# ---------------------------------------------------------------------------
# roles/firewall/defaults/main.yml — valeurs par défaut du rôle
# ---------------------------------------------------------------------------
# Pare-feu local : ufw (Debian) ou firewalld (RedHat), politique par défaut et ports
# ouverts.
# Ces valeurs ont la précédence la plus faible : n'importe quel fichier
# group_vars ou host_vars les surcharge. Modifiez-les de préférence là-bas
# plutôt qu'ici, afin de garder le rôle réutilisable tel quel.
#
# Fichier généré par forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

# Backend utilisé ; 'auto' choisit ufw sur Debian et firewalld sur RedHat.
# Valeurs admises : auto, ufw ou firewalld.
firewall_backend: auto

# Action appliquée au trafic entrant non explicitement autorisé.
# Valeurs admises : deny, reject ou allow.
firewall_default_incoming_policy: deny

# Action appliquée au trafic sortant non explicitement autorisé.
# Valeurs admises : allow, deny ou reject.
firewall_default_outgoing_policy: allow

# Ports TCP ouverts en entrée.
# Valeurs admises : liste d'entiers de 1 à 65535.
firewall_allowed_tcp_ports:
  - 22
  - 80
  - 443

# Ports UDP ouverts en entrée.
# Valeurs admises : liste d'entiers de 1 à 65535.
firewall_allowed_udp_ports: []

# Active et démarre le service de pare-feu.
# Valeurs admises : true ou false.
firewall_enabled: true

# Verbosité des journaux du pare-feu.
# Valeurs admises : off, low, medium, high ou full.
firewall_log_level: low
