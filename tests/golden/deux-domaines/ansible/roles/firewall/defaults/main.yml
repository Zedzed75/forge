---
# ---------------------------------------------------------------------------
# roles/firewall/defaults/main.yml — default values of the role
# ---------------------------------------------------------------------------
# Local firewall: ufw (Debian) or firewalld (RedHat), default policy and open ports.
# These values have the lowest precedence: any group_vars or host_vars
# file overrides them. Prefer changing them there rather than here, so
# that the role stays reusable as it is.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

# Backend used; 'auto' picks ufw on Debian and firewalld on RedHat.
# Allowed values: auto, ufw or firewalld.
firewall_backend: auto

# Action applied to incoming traffic that is not explicitly allowed.
# Allowed values: deny, reject or allow.
firewall_default_incoming_policy: deny

# Action applied to outgoing traffic that is not explicitly allowed.
# Allowed values: allow, deny or reject.
firewall_default_outgoing_policy: allow

# TCP ports opened for inbound traffic.
# Allowed values: list of integers from 1 to 65535.
firewall_allowed_tcp_ports:
  - 22
  - 80
  - 443

# UDP ports opened for inbound traffic.
# Allowed values: list of integers from 1 to 65535.
firewall_allowed_udp_ports: []

# Enables and starts the firewall service.
# Allowed values: true or false.
firewall_enabled: true

# Verbosity of the firewall logs.
# Allowed values: off, low, medium, high or full.
firewall_log_level: low
