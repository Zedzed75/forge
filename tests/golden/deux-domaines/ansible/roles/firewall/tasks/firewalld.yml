---
# ---------------------------------------------------------------------------
# roles/firewall/tasks/firewalld.yml — firewalld firewall (RedHat and derivatives)
# ---------------------------------------------------------------------------
# The rules are set both in memory (immediate) and on disk (permanent) so
# that they survive a reboot without a manual reload.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

- name: Install firewalld
  ansible.builtin.package:
    name: firewalld
    state: present

- name: Enable and start firewalld
  ansible.builtin.service:
    name: firewalld
    state: "{{ 'started' if firewall_enabled else 'stopped' }}"
    enabled: "{{ firewall_enabled }}"

- name: Open the allowed TCP ports
  ansible.posix.firewalld:
    port: "{{ item ~ '/tcp' }}"
    zone: "{{ firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_tcp_ports }}"
  when: firewall_enabled | bool

- name: Open the allowed UDP ports
  ansible.posix.firewalld:
    port: "{{ item ~ '/udp' }}"
    zone: "{{ firewall_zone }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_allowed_udp_ports }}"
  when: firewall_enabled | bool

- name: Apply the default policy of the zone
  ansible.posix.firewalld:
    zone: "{{ firewall_zone }}"
    target: "{{ firewall_zone_target }}"
    permanent: true
    state: present
  when: firewall_enabled | bool
  notify: Reload the firewall
