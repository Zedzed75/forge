---
# ---------------------------------------------------------------------------
# roles/firewall/tasks/ufw.yml — ufw firewall (Debian and derivatives)
# ---------------------------------------------------------------------------
# The default policies are set before the ports are opened, and the
# firewall is only enabled last: the rule allowing SSH is therefore
# always in place before filtering starts.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

- name: Install ufw
  ansible.builtin.package:
    name: ufw
    state: present

- name: Set the default policy for incoming traffic
  community.general.ufw:
    direction: incoming
    policy: "{{ firewall_default_incoming_policy }}"
  notify: Reload the firewall

- name: Set the default policy for outgoing traffic
  community.general.ufw:
    direction: outgoing
    policy: "{{ firewall_default_outgoing_policy }}"
  notify: Reload the firewall

- name: Open the allowed TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"
  notify: Reload the firewall

- name: Open the allowed UDP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: udp
  loop: "{{ firewall_allowed_udp_ports }}"
  notify: Reload the firewall

- name: Set the logging level
  community.general.ufw:
    logging: "{{ firewall_log_level }}"

- name: Enable or disable the firewall
  community.general.ufw:
    state: "{{ 'enabled' if firewall_enabled else 'disabled' }}"
