---
# ---------------------------------------------------------------------------
# roles/postgresql/defaults/main.yml — default values of the role
# ---------------------------------------------------------------------------
# PostgreSQL server: installation, network listening, databases, roles and pg_hba rules.
# These values have the lowest precedence: any group_vars or host_vars
# file overrides them. Prefer changing them there rather than here, so
# that the role stays reusable as it is.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

# Major version installed from the repositories of the distribution.
# Allowed values: major version number, for instance '15' or '16'.
postgresql_version: '16'

# Value of listen_addresses in postgresql.conf.
# Allowed values: 'localhost', '*' or a comma-separated list of addresses.
postgresql_listen_addresses: localhost

# TCP port of the PostgreSQL server.
# Allowed values: integer from 1 to 65535.
postgresql_port: 5432

# Databases created and maintained by the role.
# Allowed values: list of dictionaries (name, owner, encoding).
postgresql_databases: []

# Login roles created and maintained by the role.
# Allowed values: list of dictionaries (name, password_var, privileges).
postgresql_db_users: []

# Lines added to pg_hba.conf on top of the default local rules.
# Allowed values: list of five-field strings "type database user address method", for
# instance 'host all all 10.0.0.0/8 scram-sha-256'.
postgresql_hba_entries: []

# Value of max_connections in postgresql.conf.
# Allowed values: positive integer.
postgresql_max_connections: 100
