---
# ---------------------------------------------------------------------------
# roles/postgresql/tasks/main.yml — serveur PostgreSQL
# ---------------------------------------------------------------------------
# Ordre d'exécution : paquets, initialisation du cluster (RedHat),
# démarrage du service, réglages du serveur, rôles, bases puis règles
# d'authentification. Les rôles sont créés avant les bases car une base
# référence son propriétaire.
# Les mots de passe proviennent du vault : chaque entrée de
# postgresql_db_users nomme la variable qui le contient.
#
# Fichier généré par forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

- name: Installer PostgreSQL et ses dépendances
  ansible.builtin.package:
    name: "{{ postgresql_packages }}"
    state: present

- name: Initialiser le cluster PostgreSQL
  ansible.builtin.command:
    cmd: /usr/bin/postgresql-setup --initdb
    creates: "{{ postgresql_config_dir ~ '/PG_VERSION' }}"
  when: ansible_facts['os_family'] == 'RedHat'

- name: Activer et démarrer le service PostgreSQL
  ansible.builtin.service:
    name: "{{ postgresql_service }}"
    state: started
    enabled: true

# Requiert community.postgresql >= 3.13.0 : `postgresql_alter_system` y est
# apparu, et a remplacé `postgresql_set` supprimé en 5.0.0. Le module écrit
# dans postgresql.auto.conf puis recharge la configuration ; les paramètres
# qui exigent un redémarrage passent par le handler ci-dessous.
# `value` est obligatoire et typé chaîne, d'où le `| string` appliqué aux
# valeurs numériques dans vars/main.yml.
- name: Appliquer les réglages du serveur
  community.postgresql.postgresql_alter_system:
    param: "{{ item.name }}"
    value: "{{ item.value }}"
  become: true
  become_user: "{{ postgresql_system_user }}"
  loop: "{{ postgresql_settings }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Redémarrer PostgreSQL

- name: Créer les rôles de connexion
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    password: "{{ lookup('vars', item.password_var) }}"
    state: present
  become: true
  become_user: "{{ postgresql_system_user }}"
  loop: "{{ postgresql_users_with_password }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true

- name: Créer les bases de données
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.owner | default(omit, true) }}"
    encoding: "{{ item.encoding }}"
    state: present
  become: true
  become_user: "{{ postgresql_system_user }}"
  loop: "{{ postgresql_databases }}"
  loop_control:
    label: "{{ item.name }}"

- name: Accorder les privilèges déclarés
  community.postgresql.postgresql_privs:
    database: "{{ item.privileges.split(':')[0] }}"
    privs: "{{ item.privileges.split(':')[1] }}"
    type: database
    role: "{{ item.name }}"
    state: present
  become: true
  become_user: "{{ postgresql_system_user }}"
  loop: "{{ postgresql_users_with_privileges }}"
  loop_control:
    label: "{{ item.name }}"

- name: Déclarer les règles d'authentification supplémentaires
  community.postgresql.postgresql_pg_hba:
    dest: "{{ postgresql_config_dir ~ '/pg_hba.conf' }}"
    contype: "{{ item.split()[0] }}"
    databases: "{{ item.split()[1] }}"
    users: "{{ item.split()[2] }}"
    address: "{{ item.split()[3] }}"
    method: "{{ item.split()[4] }}"
    state: present
  loop: "{{ postgresql_hba_entries }}"
  notify: Recharger PostgreSQL
