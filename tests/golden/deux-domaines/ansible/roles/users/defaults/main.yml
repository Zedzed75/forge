---
# ---------------------------------------------------------------------------
# roles/users/defaults/main.yml — valeurs par défaut du rôle
# ---------------------------------------------------------------------------
# Comptes locaux : création, groupes secondaires, sudo et clés SSH autorisées.
# Ces valeurs ont la précédence la plus faible : n'importe quel fichier
# group_vars ou host_vars les surcharge. Modifiez-les de préférence là-bas
# plutôt qu'ici, afin de garder le rôle réutilisable tel quel.
#
# Fichier généré par forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

# Liste des comptes locaux gérés par le rôle.
# Valeurs admises : liste de dictionnaires (name, groups, sudo, shell, ssh_public_key,
# state).
users_accounts: []

# Écrit un fichier dans /etc/sudoers.d pour les comptes marqués sudo.
# Valeurs admises : true ou false.
users_manage_sudoers: true

# Supprime /home/<user> lorsque le compte passe à l'état absent.
# Valeurs admises : true ou false.
users_remove_absent_home: false
