---
# ---------------------------------------------------------------------------
# forge.yml - Service specification
# ---------------------------------------------------------------------------
# This file describes in full what has to be generated. It is replayable:
#   forge generate --spec forge.yml
# produces exactly the same tree, byte for byte.
#
# Edit it by hand, then run the generator again; do not edit
# 'forge_version' yourself.
#
# Domains generated by this specification:
#   - helm
# ---------------------------------------------------------------------------
forge_version: 1
service:
  name: boutique
  description: Online store, full chart
  owner: Platform Team
  owner_email: plateforme@example.net
  labels:
    app.kubernetes.io/part-of: commerce
  environments:
    - name: dev
    - name: prod
      domain: boutique.example.net
      production: true
helm:
  chart_version: 1.2.0
  app_version: 2026.08.1
  kubernetes:
    version: '1.34'
  namespace_strategy: per_env
  image:
    registry: ghcr.io
    repository: acme/boutique
    strategy: appVersion
    pull_secret_name: registre-prive
  components:
    - name: api
      kind: deployment
      addons:
        - service
        - ingress
        - configmap
        - secret
        - hpa
        - pdb
        - serviceaccount
        - networkpolicy
      container_port: 8080
      port_name: http
      ingress:
        base_domain: example.net
        tls: true
      config:
        keys:
          - LOG_LEVEL
          - APP_ENV
      secret:
        keys:
          - API_KEY
      rbac:
        create: true
        rules:
          - apiGroups:
              - ''
            resources:
              - configmaps
            verbs:
              - get
              - list
              - watch
    - name: db-proxy
      kind: statefulset
      addons:
        - configmap
        - serviceaccount
      container_port: 5432
      port_name: postgres
      persistence:
        size: 20Gi
      config:
        keys:
          - POOL_SIZE
        mount_as: file
    - name: cleanup
      kind: cronjob
      addons:
        - configmap
      cron:
        schedule: 0 3 * * *
        concurrency_policy: Forbid
      config:
        keys:
          - RETENTION_DAYS
  environments:
    prod:
      log_level: warn
      extra_values:
        global:
          monitoring: true
      components:
        api:
          replicas: 4
