{{- /*
===============================================================================
Service of the "db-proxy" component
===============================================================================
File generated by forge.

Exposes the pods of db-proxy behind a stable DNS name and a virtual address.
The Service selects its pods by the selection labels of the component, never by
their name.
===============================================================================
*/}}
{{- if and (index .Values "db-proxy").enabled (index .Values "db-proxy").service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "boutique.db-proxy.fullname" . }}
  labels:
    {{- include "boutique.db-proxy.labels" . | nindent 4 }}
  {{- with (index .Values "db-proxy").service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /*
    Headless Service: with no virtual address, DNS returns the addresses of the
    pods directly. That is what gives each pod of a StatefulSet an individual
    and stable DNS name.
  */}}
  clusterIP: None
  ports:
    - name: {{ (index .Values "db-proxy").portName }}
      port: {{ (index .Values "db-proxy").service.port }}
      {{- /* targetPort designates the port of the container, here by its name. */}}
      targetPort: {{ (index .Values "db-proxy").portName }}
      protocol: TCP
  selector:
    {{- include "boutique.db-proxy.selectorLabels" . | nindent 4 }}
{{- end }}
