# =============================================================================
# values-prod.yaml — overrides of the "prod" environment
# =============================================================================
# File generated by forge. It only contains the divergences with respect to
# values.yaml: everything that does not appear here keeps its default value.
#
# Target namespace of this environment: boutique-prod
#
# Usage:
#   helm upgrade --install boutique ./charts/boutique \
#     --namespace boutique-prod --create-namespace \
#     --values ./charts/boutique/values.yaml \
#     --values ./charts/boutique/values-prod.yaml
#
# The namespace is not a value of the chart: it is chosen by the --namespace
# option of Helm. It is recalled above for documentation purposes, and the
# Makefile of the project applies it automatically.
# =============================================================================

global:
  # Feeds the "environment" label set on every resource, which makes it possible
  # to filter by environment with kubectl -l environment=prod.
  environment: prod

# -----------------------------------------------------------------------------
# Component "api"
# -----------------------------------------------------------------------------
api:
  # "prod" profile: 4 replica(s).
  replicaCount: 4
  # Resources adjusted for this environment.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi
  # "prod" profile: autoscaling enabled. The number of replicas is then
  # imposed by the HorizontalPodAutoscaler, between hpa.minReplicas and
  # hpa.maxReplicas; replicaCount stops being rendered in the manifest, failing
  # which Helm and the autoscaler would fight over the value.
  hpa:
    enabled: true
  # "prod" profile: disruption budget active; the node drains will have
  # to respect pdb.minAvailable.
  pdb:
    enabled: true
  # Host served by the Ingress in this environment.
  # Derived from the domain declared for "prod" (boutique.example.net): that
  # domain already carrying the environment, its name is not inserted again.
  ingress:
    host: boutique.boutique.example.net

# -----------------------------------------------------------------------------
# Component "db-proxy"
# -----------------------------------------------------------------------------
db-proxy:
  # "prod" profile: 3 replica(s).
  replicaCount: 3
  # Resources adjusted for this environment.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi

# -----------------------------------------------------------------------------
# Component "cleanup"
# -----------------------------------------------------------------------------
cleanup:
  # Resources adjusted for this environment.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 400m
      memory: 256Mi


# -----------------------------------------------------------------------------
# Free values of this environment
# -----------------------------------------------------------------------------
# Values specific to this environment, taken as they are from forge.yml
# (helm.environments.prod.extra_values). forge does not interpret
# them: they are merged by Helm like any other values override.
global:
  monitoring: true
