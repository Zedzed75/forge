{{- /*
===============================================================================
Deployment of the "api" component
===============================================================================
File generated by forge.

Deploys api as a stateless workload: the pods are interchangeable and
replaced by fresh copies on every update.

No value is hardcoded here. Everything comes from the "api" key of
values.yaml, overridable per environment.
===============================================================================
*/}}
{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "storefront.api.fullname" . }}
  labels:
    {{- include "storefront.api.labels" . | nindent 4 }}
spec:
  {{- /*
    When autoscaling is active, "replicas" is deliberately not rendered: Helm
    would reset it to replicaCount on every update, the HorizontalPodAutoscaler
    would recompute it straight away, and the two would fight on every
    "helm upgrade".
  */}}
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "storefront.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "storefront.api.selectorLabels" . | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- /*
        The fingerprint of the ConfigMap restarts the pods as soon as the
        configuration changes: without it, a "helm upgrade" that only touches the
        ConfigMap would leave the pods on the old configuration, without any sign.
        The path quoted is exactly that of the template file produced — any
        divergence would make the rendering fail on a template that cannot be
        found.
      */}}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-api.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- /*
        Without this line, the pods would run under the "default" account of the
        namespace, whose rights are shared by everything deployed there.
      */}}
      serviceAccountName: {{ include "storefront.api.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "storefront.api.image" . }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: {{ .Values.api.portName }}
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          {{- if .Values.api.probes.enabled }}
          {{- /* A failing liveness probe makes the container restart. */}}
          livenessProbe:
            httpGet:
              path: {{ .Values.api.probes.liveness.path }}
              port: {{ .Values.api.portName }}
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          {{- /* A failing readiness probe removes the pod from the Service, without killing it. */}}
          readinessProbe:
            httpGet:
              path: {{ .Values.api.probes.readiness.path }}
              port: {{ .Values.api.portName }}
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          {{- if .Values.api.probes.startup.enabled }}
          {{- /*
            The startup probe suspends liveness and readiness as long as it has
            not succeeded: that is what prevents an application slow to start from
            being killed in a loop by the liveness probe.
          */}}
          startupProbe:
            httpGet:
              path: {{ .Values.api.probes.startup.path }}
              port: {{ .Values.api.portName }}
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          {{- end }}
          {{- end }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.global.environment | quote }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- /*
            The sources injected as environment variables are accumulated in a
            list, then rendered in one block: an "envFrom:" key with no element
            would amount to null and would be refused.
            The mountAs key decides, source by source, between injection as
            variables (env) and mounting as files (file, further down).
          */}}
          {{- $envFrom := list }}
          {{- if and .Values.api.config.enabled (eq .Values.api.config.mountAs "env") }}
          {{- $envFrom = append $envFrom (dict "configMapRef" (dict "name" (include "storefront.api.configMapName" .))) }}
          {{- end }}
          {{- if and .Values.api.secret.enabled (eq .Values.api.secret.mountAs "env") }}
          {{- $envFrom = append $envFrom (dict "secretRef" (dict "name" (include "storefront.api.secretName" .))) }}
          {{- end }}
          {{- with $envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* File mounts, for the sources whose mountAs is file. */}}
          {{- $volumeMounts := list }}
          {{- if and .Values.api.config.enabled (eq .Values.api.config.mountAs "file") }}
          {{- $volumeMounts = append $volumeMounts (dict "name" "config" "mountPath" .Values.api.config.mountPath "readOnly" true) }}
          {{- end }}
          {{- if and .Values.api.secret.enabled (eq .Values.api.secret.mountAs "file") }}
          {{- $volumeMounts = append $volumeMounts (dict "name" "secret" "mountPath" .Values.api.secret.mountPath "readOnly" true) }}
          {{- end }}
          {{- with $volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /*
        Volumes corresponding to the file mounts declared above. The list stays
        empty as long as no source is in "file" mode, and the "volumes:" key then
        disappears entirely.
      */}}
      {{- $volumes := list }}
      {{- if and .Values.api.config.enabled (eq .Values.api.config.mountAs "file") }}
      {{- $volumes = append $volumes (dict "name" "config" "configMap" (dict "name" (include "storefront.api.configMapName" .))) }}
      {{- end }}
      {{- if and .Values.api.secret.enabled (eq .Values.api.secret.mountAs "file") }}
      {{- $volumes = append $volumes (dict "name" "secret" "secret" (dict "secretName" (include "storefront.api.secretName" .))) }}
      {{- end }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
