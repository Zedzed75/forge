{{- /*
===============================================================================
NetworkPolicy of the "api" component
===============================================================================
File generated by forge.

Partitions the network traffic of the pods of api: closed by default,
opened explicitly, source by source.

This is the resource where a mistake does not show. Two confusions are enough to
invert everything, and each guard in this file is there for one of them:

  * an empty rule "- {}" allows EVERYTHING, where the absence of a rule forbids
    everything. The two look alike, and no validator tells them apart;
  * announcing "Egress" in policyTypes without writing a single egress rule cuts
    all outgoing traffic, name resolution included: the component reaches nothing
    any more, without the slightest error message.

No value is hardcoded: everything comes from the "api.networkPolicy" key
of values.yaml, overridable per environment.
===============================================================================
*/}}
{{- if and .Values.api.enabled .Values.api.networkPolicy.enabled }}
{{- /*
  The rule lists are decided BEFORE writing policyTypes: that is the only way to
  announce a traffic type only if a rule concerning it really follows.
*/ -}}
{{- $np := .Values.api.networkPolicy -}}
{{- $fromNamespaces := $np.allowFromNamespaces | default list -}}
{{- $hasIngressRule := or $np.allowFromSameNamespace (gt (len $fromNamespaces) 0) -}}
{{- $hasEgressRule := or $np.allowEgressAll $np.allowDNS -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "storefront.api.fullname" . }}
  labels:
    {{- include "storefront.api.labels" . | nindent 4 }}
spec:
  {{- /*
    podSelector is mandatory, even empty — but an empty podSelector would target
    ALL the pods of the namespace, hence also the other components of the chart and
    everything deployed alongside. The selection labels of api are put
    there, and them alone: the policy only governs its own pods.
    Those labels come from the helper, never copied: they must stay identical to
    the ones the workload sets on its pods.
  */}}
  podSelector:
    matchLabels:
      {{- include "storefront.api.selectorLabels" . | nindent 6 }}
  {{- /*
    policyTypes is explicit: a type absent from this list is not governed by this
    policy and therefore stays free.
    "Ingress" always appears there — restricting ingress is the very purpose of
    this resource. "Egress" only appears if an egress rule follows: announcing it
    without a rule would cut all outgoing traffic, DNS included.
    To partition egress as well, leave allowDNS at true and allowEgressAll at
    false: egress is then reduced to name resolution only.
  */}}
  policyTypes:
    - Ingress
    {{- if $hasEgressRule }}
    - Egress
    {{- end }}
  {{- if $hasIngressRule }}
  {{- /*
    A single ingress rule element. Inside it, "from" and "ports" combine as an AND:
    the source must be allowed AND target the right port.
  */}}
  ingress:
    - from:
        {{- if $np.allowFromSameNamespace }}
        {{- /*
          An empty podSelector designates all the pods; alone in its element, with
          no namespaceSelector beside it, it stays bounded to the namespace of the
          policy. It really is "the whole namespace", not "the whole cluster".
        */}}
        - podSelector: {}
        {{- end }}
        {{- range $fromNamespaces }}
        {{- /*
          Each allowed namespace is a distinct element of the list: two selectors
          placed in the SAME element would be an AND (this namespace AND those
          pods), in two elements an OR. The difference comes down to a dash, and it
          is silent.
          The kubernetes.io/metadata.name label is set automatically by Kubernetes
          on every namespace: there is nothing to label by hand.
        */}}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
      {{- /*
        The port quoted is that of the CONTAINER, never that of the Service: the
        policy applies to the pods, the Service is only an intermediary and its
        port has no meaning here.
        The Service of api listens on its own "service.port" key and
        redirects to containerPort: it is the latter that must be named here, even
        when the two ports differ.
        Any other port of the container stays closed: that is intended.
      */}}
      ports:
        - protocol: TCP
          port: {{ .Values.api.containerPort }}
  {{- else }}
  {{- /*
    No allowed source. The list is written empty, explicitly: an empty rule list
    forbids all incoming traffic. That is the intended result, and writing it down
    in black and white avoids reading an oversight into it.
  */}}
  ingress: []
  {{- end }}
  {{- /*
    Reminder: api is exposed by an Ingress, and the traffic does not come
    from the client but from the pods of the Ingress controller, which most often
    live in another namespace. As long as that namespace does not appear in
    allowFromNamespaces, the Ingress will answer 502: the policy will have done
    exactly what it was asked to.
  */}}
  {{- if $hasEgressRule }}
  egress:
    {{- if $np.allowEgressAll }}
    {{- /*
      Deliberately empty rule. With neither "to" nor "ports", it allows ANY
      destination on ANY port, name resolution included — the exact opposite of the
      absence of a rule, which forbids everything. Nothing in the syntax says so:
      that is the reason this comment exists.
    */}}
    - {}
    {{- else if $np.allowDNS }}
    {{- /*
      Egress reduced to name resolution, the only traffic without which the
      component reaches nothing any more — not even by its Service name.
      The rule deliberately carries no "to": only the ports are constrained, the
      destination stays free. The resolver may be a CoreDNS of the kube-system
      namespace as well as a cache local to the node, reached on the address of the
      node, which no namespaceSelector could designate.
      Both protocols are necessary: UDP for the common case, TCP for the answers
      too large for a datagram.
    */}}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
  {{- end }}
{{- end }}
