domain:
    alert_prefix: Boutique
    blackbox:
        address: blackbox-exporter:9115
        job: blackbox
        module: http_2xx
        needed: true
    dash:
    -   name: boutique
    dashboard_file: grafana/dashboards/boutique.json
    dashboard_panels:
    -   alert: BoutiqueCibleInjoignable
        expr: up{job="boutique"}
        family: availability
        threshold: ''
        title: The target no longer answers the collector
    -   alert: BoutiqueTauxErreurEleve
        expr: "sum(rate(http_requests_total{job=\"boutique\", status=~\"5..\"}[5m]))\n\
            \  /\nsum(rate(http_requests_total{job=\"boutique\"}[5m]))"
        family: error_rate
        threshold: '0.2'
        title: Too many responses in error
    -   alert: BoutiqueLatenceElevee
        expr: "histogram_quantile(0.95,\n  sum by (le) (rate(http_request_duration_seconds_bucket{job=\"\
            boutique\"}[5m]))\n)"
        family: latency
        threshold: '2'
        title: The service answers too slowly
    -   alert: BoutiqueMemoireProcheDeLaLimite
        expr: "container_memory_working_set_bytes{namespace=\"boutique-dev\", container!=\"\
            \"}\n  /\ncontainer_spec_memory_limit_bytes{namespace=\"boutique-dev\"\
            , container!=\"\"}"
        family: saturation
        threshold: '0.9'
        title: A container is approaching its memory limit
    -   alert: BoutiqueCpuEleve
        expr: "sum by (pod) (\n  rate(container_cpu_usage_seconds_total{namespace=\"\
            boutique-dev\", container!=\"\"}[5m])\n)"
        family: saturation
        threshold: '1.5'
        title: A pod is durably consuming a lot of CPU
    -   alert: BoutiqueRedemarragesEnBoucle
        expr: "increase(\n  kube_pod_container_status_restarts_total{namespace=\"\
            boutique-dev\"}[1h]\n)"
        family: restarts
        threshold: '3'
        title: A container is restarting in a loop
    -   alert: BoutiqueSondeExterneEnEchec
        expr: probe_success{job="blackbox"}
        family: probe
        threshold: ''
        title: The service is no longer reachable from the outside
    -   alert: BoutiqueCertificatBientotExpire
        expr: "(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"} - time()\n) /\
            \ 86400"
        family: probe
        threshold: '21'
        title: A TLS certificate is approaching its expiry
    default_env: dev
    env_names:
    - dev
    - prod
    environments:
    -   domain: dev.example.net
        family_names:
        - availability
        - error_rate
        - latency
        - saturation
        - restarts
        - probe
        labels:
            tier: frontend
        name: dev
        namespace: boutique-dev
        probe_urls:
        - https://boutique.dev.example.net
        production: false
        rules:
            availability:
                alerts:
                -   description: Instance {{ $labels.instance }} of job {{ $labels.job
                        }} has not answered for 5 minutes.
                    expr: up{job="boutique"} == 0
                    for: 5m
                    labels:
                        env: dev
                        service: boutique
                        severity: critical
                    name: BoutiqueCibleInjoignable
                    panel_expr: up{job="boutique"}
                    severity: critical
                    summary: The target no longer answers the collector
                    test:
                        eval_time: 6m
                        exp_annotations:
                            description: Instance test-instance:9090 of job boutique
                                has not answered for 5 minutes.
                            summary: The target no longer answers the collector
                        exp_labels:
                            env: dev
                            instance: test-instance:9090
                            job: boutique
                            service: boutique
                            severity: critical
                        series:
                        -   points: 0+0x10
                            series: up{job="boutique", instance="test-instance:9090"}
                    threshold: ''
                    threshold_field: ''
                    threshold_unit: ''
                group: boutique-dev-availability
                summary: The target no longer answers the collector
                traps:
                - '`up == 0` only fires if the target is **known** to the collector.
                    A target never declared produces no series, and therefore no alert:
                    silence is not health. That is why the targets are written in
                    the configuration rather than discovered.'
