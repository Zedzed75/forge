                    With a `for` that is too long, a real outage waits. Five minutes
                    is the usual compromise, not a truth.
                - An alert that fires for **every** instance at once almost always
                    points at the collector or the network, not at the service. A
                    receiver that does not tell the difference drowns the on-call
                    rota.
            error_rate:
                alerts:
                -   description: More than 20 % of the responses of the service have
                        been server errors for 10 minutes.
                    expr: "sum(rate(http_requests_total{job=\"boutique\", status=~\"\
                        5..\"}[5m]))\n  /\nsum(rate(http_requests_total{job=\"boutique\"\
                        }[5m]))\n  > 0.2"
                    for: 10m
                    labels:
                        env: dev
                        service: boutique
                        severity: critical
                    name: BoutiqueTauxErreurEleve
                    panel_expr: "sum(rate(http_requests_total{job=\"boutique\", status=~\"\
                        5..\"}[5m]))\n  /\nsum(rate(http_requests_total{job=\"boutique\"\
                        }[5m]))"
                    severity: critical
                    summary: Too many responses in error
                    test:
                        eval_time: 15m
                        exp_annotations:
                            description: More than 20 % of the responses of the service
                                have been server errors for 10 minutes.
                            summary: Too many responses in error
                        exp_labels:
                            env: dev
                            service: boutique
                            severity: critical
                        series:
                        -   points: 0+1000x20
                            series: http_requests_total{job="boutique", status="500"}
                        -   points: 0+667x20
                            series: http_requests_total{job="boutique", status="200"}
                    threshold: '0.2'
                    threshold_field: error_rate
                    threshold_unit: proportion (0.05 = 5 %)
                group: boutique-dev-error_rate
                summary: Too many responses in server error
                traps:
                - 'A ratio over a null denominator gives `NaN`, and a comparison with
                    `NaN` is false: the alert does not fire. A service that no longer
                    receives **any** request is therefore invisible here -- it is
                    the `availability` family that sees it.'
                - '`rate()` over a window shorter than two collection intervals returns
                    `NaN`. With a collection every 30 s, a 5-minute window leaves
                    room; a one-minute window leaves none.'
                - 'The status label is not standardised: `status`, `code`, `status_code`
                    depending on the library. Getting the name wrong gives a valid
                    rule, accepted by promtool, and permanently mute.'
                - Counting only the 5xx lets through the client-side timeouts and
                    the refused connections, which produce no response and therefore
                    no line in the counter.
            latency:
                alerts:
                -   description: The 95th percentile of the response time has exceeded
                        2 second(s) for 10 minutes.
                    expr: "histogram_quantile(0.95,\n  sum by (le) (rate(http_request_duration_seconds_bucket{job=\"\
                        boutique\"}[5m]))\n) > 2"
                    for: 10m
                    labels:
                        env: dev
                        service: boutique
                        severity: warning
                    name: BoutiqueLatenceElevee
                    panel_expr: "histogram_quantile(0.95,\n  sum by (le) (rate(http_request_duration_seconds_bucket{job=\"\
                        boutique\"}[5m]))\n)"
                    severity: warning
                    summary: The service answers too slowly
                    test:
                        eval_time: 15m
                        exp_annotations:
                            description: The 95th percentile of the response time
                                has exceeded 2 second(s) for 10 minutes.
                            summary: The service answers too slowly
                        exp_labels:
                            env: dev
                            service: boutique
                            severity: warning
                        series:
                        -   points: 0+10x20
                            series: http_request_duration_seconds_bucket{job="boutique",
                                le="2"}
                        -   points: 0+100x20
                            series: http_request_duration_seconds_bucket{job="boutique",
                                le="4"}
                        -   points: 0+100x20
                            series: http_request_duration_seconds_bucket{job="boutique",
                                le="+Inf"}
                    threshold: '2'
                    threshold_field: latency_p95_seconds
                    threshold_unit: seconds
                group: boutique-dev-latency
                summary: The service answers too slowly
                traps:
                - '`histogram_quantile` **interpolates linearly** in the bucket the
                    percentile falls into. The precision of the result therefore never
                    exceeds that of the bucket layout: with 0.5 s / 2 s buckets, no
                    percentile can be worth 1.2 s other than by interpolation.'
                - If the percentile falls into the last bucket (`+Inf`), the function
                    returns the upper bound of the previous bucket -- never infinity.
                    A catastrophic latency can therefore show up as equal to the bound
                    of the largest finite bucket, and not cross a threshold placed
                    above it.
                - 'The `sum by (le)` aggregation is mandatory before `histogram_quantile`:
                    applying the function to non-aggregated buckets computes one percentile
                    per instance, which makes no sense when the one of the service
                    is wanted.'
                - 'The buckets of a histogram are **cumulative**: `le="2"` also counts
                    the observations below 0.5 s. Writing a test series with decreasing
                    buckets produces an invalid histogram that Prometheus accepts
                    and interprets wrongly.'
            probe:
                alerts:
                -   description: 'The external probe on {{ $labels.instance }} has
                        been failing for 5 minutes. The service can be running and
                        stay unreachable: that is precisely what this probe sees and
                        the others do not.'
                    expr: probe_success{job="blackbox"} == 0
                    for: 5m
                    labels:
                        env: dev
                        service: boutique
                        severity: critical
                    name: BoutiqueSondeExterneEnEchec
                    panel_expr: probe_success{job="blackbox"}
                    severity: critical
                    summary: The service is no longer reachable from the outside
                    test:
                        eval_time: 6m
                        exp_annotations:
                            description: 'The external probe on https://test-probe.invalid
                                has been failing for 5 minutes. The service can be
                                running and stay unreachable: that is precisely what
                                this probe sees and the others do not.'
                            summary: The service is no longer reachable from the outside
                        exp_labels:
                            env: dev
                            instance: https://test-probe.invalid
                            job: blackbox
                            service: boutique
                            severity: critical
                        series:
                        -   points: 0+0x10
                            series: probe_success{job="blackbox", instance="https://test-probe.invalid"}
                    threshold: ''
                    threshold_field: ''
                    threshold_unit: ''
                -   description: 'The certificate served on {{ $labels.instance }}
                        expires in less than 21 days. An expired certificate gives
                        no warning: it breaks every connection at once.'
                    expr: "(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"} -\
                        \ time()\n) / 86400 < 21"
                    for: 15m
                    labels:
                        env: dev
                        service: boutique
                        severity: warning
                    name: BoutiqueCertificatBientotExpire
                    panel_expr: "(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"\
                        } - time()\n) / 86400"
                    severity: warning
                    summary: A TLS certificate is approaching its expiry
