                    the observations below 0.5 s. Writing a test series with decreasing
                    buckets produces an invalid histogram that Prometheus accepts
                    and interprets wrongly.'
            probe:
                alerts:
                -   description: 'The external probe on {{ $labels.instance }} has
                        been failing for 5 minutes. The service can be running and
                        stay unreachable: that is precisely what this probe sees and
                        the others do not.'
                    expr: probe_success{job="blackbox"} == 0
                    for: 5m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: critical
                    name: BoutiqueSondeExterneEnEchec
                    panel_expr: probe_success{job="blackbox"}
                    severity: critical
                    summary: The service is no longer reachable from the outside
                    test:
                        eval_time: 6m
                        exp_annotations:
                            description: 'The external probe on https://test-probe.invalid
                                has been failing for 5 minutes. The service can be
                                running and stay unreachable: that is precisely what
                                this probe sees and the others do not.'
                            summary: The service is no longer reachable from the outside
                        exp_labels:
                            criticality: high
                            env: prod
                            instance: https://test-probe.invalid
                            job: blackbox
                            service: boutique
                            severity: critical
                        series:
                        -   points: 0+0x10
                            series: probe_success{job="blackbox", instance="https://test-probe.invalid"}
                    threshold: ''
                    threshold_field: ''
                    threshold_unit: ''
                -   description: 'The certificate served on {{ $labels.instance }}
                        expires in less than 30 days. An expired certificate gives
                        no warning: it breaks every connection at once.'
                    expr: "(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"} -\
                        \ time()\n) / 86400 < 30"
                    for: 15m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueCertificatBientotExpire
                    panel_expr: "(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"\
                        } - time()\n) / 86400"
                    severity: warning
                    summary: A TLS certificate is approaching its expiry
                    test:
                        eval_time: 20m
                        exp_annotations:
                            description: 'The certificate served on https://test-probe.invalid
                                expires in less than 30 days. An expired certificate
                                gives no warning: it breaks every connection at once.'
                            summary: A TLS certificate is approaching its expiry
                        exp_labels:
                            criticality: high
                            env: prod
                            instance: https://test-probe.invalid
                            job: blackbox
                            service: boutique
                            severity: warning
                        series:
                        -   points: 1297200+0x25
                            series: probe_ssl_earliest_cert_expiry{job="blackbox",
                                instance="https://test-probe.invalid"}
                    threshold: '30'
                    threshold_field: certificate_days
                    threshold_unit: days before expiry
                group: boutique-prod-probe
                summary: 'External probe: reachability and certificate expiry'
                traps:
                - 'The probe configuration of the blackbox exporter is a ballet of
                    `relabel_configs`: the address to probe goes through `__param_target`,
                    then becomes `instance`, and `__address__` is finally replaced
                    by the address of the exporter. Skipping a step makes it probe
                    the exporter itself, which always answers.'
                - '`probe_ssl_earliest_cert_expiry` only exists for **HTTPS** probes.
                    A URL in `http://` does not produce this series, and the certificate
                    alert stays mute without anything reporting it.'
                - The probe sees what a client sees from the network of the collector.
                    If that one is inside the cluster, it tests neither the public
                    DNS, nor the load balancer, nor the firewall -- that is to say,
                    most of what breaks.
                - A certificate renewed automatically still triggers the alert if
                    the renewal fails silently. That is the point; it is not a false
                    positive.
            restarts:
                alerts:
                -   description: Container {{ $labels.container }} of pod {{ $labels.pod
                        }} has restarted more than 2 times in one hour.
                    expr: "increase(\n  kube_pod_container_status_restarts_total{namespace=\"\
                        boutique-prod\"}[1h]\n) > 2"
                    for: 5m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueRedemarragesEnBoucle
                    panel_expr: "increase(\n  kube_pod_container_status_restarts_total{namespace=\"\
                        boutique-prod\"}[1h]\n)"
                    severity: warning
                    summary: A container is restarting in a loop
                    test:
                        eval_time: 70m
                        exp_annotations:
                            description: Container test-container of pod test-pod
                                has restarted more than 2 times in one hour.
                            summary: A container is restarting in a loop
                        exp_labels:
                            container: test-container
                            criticality: high
                            env: prod
                            namespace: boutique-prod
                            pod: test-pod
                            service: boutique
                            severity: warning
                        series:
                        -   points: 0+1x70
                            series: kube_pod_container_status_restarts_total{namespace="boutique-prod",
                                pod="test-pod", container="test-container"}
                    threshold: '2'
                    threshold_field: restarts_per_hour
                    threshold_unit: restarts per hour
                group: boutique-prod-restarts
                summary: A container is restarting in a loop
                traps:
                - '`kube_pod_container_status_restarts_total` is reset to zero when
                    the pod is recreated -- it is not a monotonic counter from the
                    point of view of the service. `increase()` handles the reset of
                    a series, but not the disappearance of a series in favour of another:
                    a replaced pod loses the history.'
                - A liveness probe that is too strict produces exactly this alert,
                    while the application is fine. Checking the tuning of the probe
                    before looking in the code saves hours.
                - kube-state-metrics has to be running **and** be collected. Its absence
                    makes this family silent without any error appearing anywhere.
            saturation:
                alerts:
                -   description: Container {{ $labels.container }} of pod {{ $labels.pod
                        }} has exceeded 85 % of its memory limit for 10 minutes. An
                        actual overrun causes an OOMKill, not a slowdown.
                    expr: "container_memory_working_set_bytes{namespace=\"boutique-prod\"\
                        , container!=\"\"}\n  /\ncontainer_spec_memory_limit_bytes{namespace=\"\
                        boutique-prod\", container!=\"\"}\n  > 0.85"
                    for: 10m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueMemoireProcheDeLaLimite
                    panel_expr: "container_memory_working_set_bytes{namespace=\"boutique-prod\"\
                        , container!=\"\"}\n  /\ncontainer_spec_memory_limit_bytes{namespace=\"\
                        boutique-prod\", container!=\"\"}"
                    severity: warning
                    summary: A container is approaching its memory limit
                    test:
                        eval_time: 15m
                        exp_annotations:
                            description: Container test-container of pod test-pod
                                has exceeded 85 % of its memory limit for 10 minutes.
                                An actual overrun causes an OOMKill, not a slowdown.
                            summary: A container is approaching its memory limit
                        exp_labels:
                            container: test-container
                            criticality: high
                            env: prod
                            namespace: boutique-prod
                            pod: test-pod
                            service: boutique
                            severity: warning
                        series:
                        -   points: 925000000+0x20
                            series: container_memory_working_set_bytes{namespace="boutique-prod",
                                pod="test-pod", container="test-container"}
                        -   points: 1000000000+0x20
                            series: container_spec_memory_limit_bytes{namespace="boutique-prod",
                                pod="test-pod", container="test-container"}
                    threshold: '0.85'
                    threshold_field: memory_ratio
                    threshold_unit: proportion of the limit (0.9 = 90 %)
                -   description: Pod {{ $labels.pod }} has been consuming more than
                        3 core(s) for 10 minutes.
                    expr: "sum by (pod) (\n  rate(container_cpu_usage_seconds_total{namespace=\"\
                        boutique-prod\", container!=\"\"}[5m])\n) > 3"
                    for: 10m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueCpuEleve
                    panel_expr: "sum by (pod) (\n  rate(container_cpu_usage_seconds_total{namespace=\"\
                        boutique-prod\", container!=\"\"}[5m])\n)"
                    severity: warning
                    summary: A pod is durably consuming a lot of CPU
                    test:
                        eval_time: 15m
                        exp_annotations:
                            description: Pod test-pod has been consuming more than
                                3 core(s) for 10 minutes.
                            summary: A pod is durably consuming a lot of CPU
                        exp_labels:
                            criticality: high
                            env: prod
                            pod: test-pod
                            service: boutique
                            severity: warning
                        series:
                        -   points: 0+240x20
                            series: container_cpu_usage_seconds_total{namespace="boutique-prod",
                                pod="test-pod", container="test-container"}
                    threshold: '3'
                    threshold_field: cpu_cores
                    threshold_unit: cores
                group: boutique-prod-saturation
                summary: Consumption close to the limits (memory, CPU)
                traps:
                - 'A container **with no memory limit** does not expose `container_spec_memory_limit_bytes`,
                    or exposes it at zero: the division gives no result, and the alert
                    stays mute. The absence of an alert therefore says nothing about
                    the health of the pod.'
                - '`container_memory_working_set_bytes` is the metric the kubelet
                    compares to the limit in order to decide on an OOMKill -- not
                    `container_memory_usage_bytes`, which includes the reclaimable
                    file cache and largely overestimates the real pressure.'
                - 'The `container!=""` filter is not cosmetic: cAdvisor also exposes
                    series aggregated at the pod level, with an empty `container`
                    label. Counting them twice doubles the apparent consumption.'
                - 'CPU throttling is not visible in `container_cpu_usage_seconds_total`:
                    a throttled pod consumes less, and therefore looks healthy. It
                    is `container_cpu_cfs_throttled_seconds_total` that shows it.'
        targets:
        - api-1.example.net:9090
        - api-2.example.net:9090
        thresholds:
            certificate_days: '30'
            cpu_cores: '3'
            error_rate: '0.02'
            latency_p95_seconds: '0.8'
            memory_ratio: '0.85'
            restarts_per_hour: '2'
    envs:
    -   name: dev
    -   name: prod
    expected_paths:
    - .copier-answers.yml
    - .gitignore
    - Makefile
    - README.md
    - grafana/dashboards/boutique.json
    - prometheus/dev/prometheus.yml
    - prometheus/prod/prometheus.yml
    - rules/dev/availability.yml
    - rules/dev/error_rate.yml
    - rules/dev/latency.yml
    - rules/dev/probe.yml
    - rules/dev/restarts.yml
    - rules/dev/saturation.yml
    - rules/prod/availability.yml
    - rules/prod/error_rate.yml
    - rules/prod/latency.yml
    - rules/prod/probe.yml
    - rules/prod/restarts.yml
    - rules/prod/saturation.yml
    - tests/dev/availability.yml
    - tests/dev/error_rate.yml
    - tests/dev/latency.yml
    - tests/dev/probe.yml
    - tests/dev/restarts.yml
    - tests/dev/saturation.yml
    - tests/prod/availability.yml
    - tests/prod/error_rate.yml
    - tests/prod/latency.yml
    - tests/prod/probe.yml
    - tests/prod/restarts.yml
    - tests/prod/saturation.yml
    extras:
        dashboard: true
        makefile: true
    families:
    -   alert_names:
        - CibleInjoignable
        details: 'The simplest alert, and the one most often forgotten: `up == 0`.
            Prometheus builds the `up` metric itself on every collection, without
            any exporter having to expose it.


            It is the only family that depends on no naming convention: it works from
            the very first collection.'
        exporters: []
        name: availability
        needs_namespace: false
        needs_probe: false
        summary: The target no longer answers the collector
        traps:
        - '`up == 0` only fires if the target is **known** to the collector. A target
            never declared produces no series, and therefore no alert: silence is
            not health. That is why the targets are written in the configuration rather
            than discovered.'
        - Without a `for` clause, a two-minute restart wakes somebody up. With a `for`
            that is too long, a real outage waits. Five minutes is the usual compromise,
            not a truth.
        - An alert that fires for **every** instance at once almost always points
            at the collector or the network, not at the service. A receiver that does
            not tell the difference drowns the on-call rota.
    -   alert_names:
        - TauxErreurEleve
        details: 'A ratio, never a count: a hundred errors out of a million requests
            is not the same thing as a hundred errors out of two hundred.


            The name of the counter and that of the status code label are **configurable**:
            they depend on the client library used, and guessing one would produce
            an alert that never fires.'
        exporters:
        - the application itself (Prometheus client)
        name: error_rate
        needs_namespace: false
        needs_probe: false
        summary: Too many responses in server error
        traps:
        - 'A ratio over a null denominator gives `NaN`, and a comparison with `NaN`
            is false: the alert does not fire. A service that no longer receives **any**
            request is therefore invisible here -- it is the `availability` family
            that sees it.'
        - '`rate()` over a window shorter than two collection intervals returns `NaN`.
            With a collection every 30 s, a 5-minute window leaves room; a one-minute
            window leaves none.'
        - 'The status label is not standardised: `status`, `code`, `status_code` depending
            on the library. Getting the name wrong gives a valid rule, accepted by
            promtool, and permanently mute.'
        - Counting only the 5xx lets through the client-side timeouts and the refused
            connections, which produce no response and therefore no line in the counter.
    -   alert_names:
        - LatenceElevee
        details: '95th percentile computed on a histogram, not an average: an average
            response time hides exactly what is being looked for.


            Requires a histogram, not a summary: `histogram_quantile` works on the
            `_bucket` buckets, which a summary does not expose.'
        exporters:
        - the application itself (Prometheus client)
        name: latency
        needs_namespace: false
        needs_probe: false
        summary: The service answers too slowly
        traps:
        - '`histogram_quantile` **interpolates linearly** in the bucket the percentile
            falls into. The precision of the result therefore never exceeds that of
            the bucket layout: with 0.5 s / 2 s buckets, no percentile can be worth
            1.2 s other than by interpolation.'
        - If the percentile falls into the last bucket (`+Inf`), the function returns
            the upper bound of the previous bucket -- never infinity. A catastrophic
            latency can therefore show up as equal to the bound of the largest finite
            bucket, and not cross a threshold placed above it.
        - 'The `sum by (le)` aggregation is mandatory before `histogram_quantile`:
            applying the function to non-aggregated buckets computes one percentile
            per instance, which makes no sense when the one of the service is wanted.'
        - 'The buckets of a histogram are **cumulative**: `le="2"` also counts the
            observations below 0.5 s. Writing a test series with decreasing buckets
            produces an invalid histogram that Prometheus accepts and interprets wrongly.'
    -   alert_names:
        - MemoireProcheDeLaLimite
        - CpuEleve
        details: 'Two alerts of a different nature, and the distinction matters: exceeding
            its memory limit gets the container **killed** (OOMKill), exceeding its
            CPU limit only makes it slow down (throttling).


            Memory is therefore watched as a proportion of its limit; CPU in absolute
            value, because a pod with no CPU limit is frequent and legitimate.'
        exporters:
        - cAdvisor, exposed by the kubelet
        name: saturation
        needs_namespace: true
        needs_probe: false
        summary: Consumption close to the limits (memory, CPU)
        traps:
        - 'A container **with no memory limit** does not expose `container_spec_memory_limit_bytes`,
            or exposes it at zero: the division gives no result, and the alert stays
            mute. The absence of an alert therefore says nothing about the health
            of the pod.'
        - '`container_memory_working_set_bytes` is the metric the kubelet compares
            to the limit in order to decide on an OOMKill -- not `container_memory_usage_bytes`,
            which includes the reclaimable file cache and largely overestimates the
            real pressure.'
        - 'The `container!=""` filter is not cosmetic: cAdvisor also exposes series
            aggregated at the pod level, with an empty `container` label. Counting
            them twice doubles the apparent consumption.'
        - 'CPU throttling is not visible in `container_cpu_usage_seconds_total`: a
            throttled pod consumes less, and therefore looks healthy. It is `container_cpu_cfs_throttled_seconds_total`
            that shows it.'
    -   alert_names:
        - RedemarragesEnBoucle
        details: 'A service can answer correctly and restart every ten minutes. None
            of the other families sees it: availability is good between two restarts,
            and so is the error rate.


            It is often the first visible sign of a memory leak or of a badly tuned
            liveness probe.'
        exporters:
        - kube-state-metrics
        name: restarts
        needs_namespace: true
        needs_probe: false
        summary: A container is restarting in a loop
        traps:
        - '`kube_pod_container_status_restarts_total` is reset to zero when the pod
            is recreated -- it is not a monotonic counter from the point of view of
            the service. `increase()` handles the reset of a series, but not the disappearance
            of a series in favour of another: a replaced pod loses the history.'
        - A liveness probe that is too strict produces exactly this alert, while the
            application is fine. Checking the tuning of the probe before looking in
            the code saves hours.
        - kube-state-metrics has to be running **and** be collected. Its absence makes
            this family silent without any error appearing anywhere.
    -   alert_names:
        - SondeExterneEnEchec
        - CertificatBientotExpire
        details: 'The only family that looks at the service **from the outside**,
            like a user. A service can be running perfectly and stay unreachable:
            broken DNS, badly configured ingress, expired certificate. No internal
            metric shows it.


            Requires a blackbox exporter reachable by the collector, and URLs to probe
            declared per environment.'
        exporters:
        - blackbox exporter
        name: probe
        needs_namespace: false
        needs_probe: true
        summary: 'External probe: reachability and certificate expiry'
        traps:
        - 'The probe configuration of the blackbox exporter is a ballet of `relabel_configs`:
            the address to probe goes through `__param_target`, then becomes `instance`,
            and `__address__` is finally replaced by the address of the exporter.
            Skipping a step makes it probe the exporter itself, which always answers.'
        - '`probe_ssl_earliest_cert_expiry` only exists for **HTTPS** probes. A URL
            in `http://` does not produce this series, and the certificate alert stays
            mute without anything reporting it.'
        - The probe sees what a client sees from the network of the collector. If
            that one is inside the cluster, it tests neither the public DNS, nor the
            load balancer, nor the firewall -- that is to say, most of what breaks.
        - A certificate renewed automatically still triggers the alert if the renewal
            fails silently. That is the point; it is not a false positive.
    family_names:
    - availability
    - error_rate
    - latency
    - saturation
    - restarts
    - probe
    fams:
    -   name: availability
    -   name: error_rate
    -   name: latency
    -   name: saturation
    -   name: restarts
    -   name: probe
    job_name: boutique
    metrics:
        request_duration_seconds: http_request_duration_seconds
        requests_total: http_requests_total
        status_label: status
    root_files:
    -   path: .copier-answers.yml
        purpose: Reponses du gabarit, relues par `forge update`. Ne pas editer.
    -   path: .gitignore
        purpose: Exclut les donnees du collecteur et les rendus locaux.
    -   path: Makefile
        purpose: 'Raccourcis : `make check`, `make test`, `make check ENV=prod`.'
    -   path: README.md
        purpose: 'Ce fichier : ce qui est surveille, et comment.'
    scrape:
        interval: 30s
        metrics_path: /metrics
        timeout: 10s
forge_version: 1
plugin: monitoring
service:
    description: Boutique en ligne, supervision
    environments:
    -   domain: dev.example.net
        name: dev
        production: false
    -   domain: example.net
        name: prod
        production: true
    labels:
        tier: frontend
    name: boutique
    owner: Equipe Plateforme
    owner_email: plateforme@example.net
template_subdir: src/forge/plugins/monitoring/template

