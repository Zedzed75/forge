                    Un recepteur qui ne fait pas la difference noie l'astreinte.
            error_rate:
                alerts:
                -   description: Plus de 2 % des reponses du service sont en erreur
                        serveur depuis 10 minutes.
                    expr: "sum(rate(http_requests_total{job=\"boutique\", status=~\"\
                        5..\"}[5m]))\n  /\nsum(rate(http_requests_total{job=\"boutique\"\
                        }[5m]))\n  > 0.02"
                    for: 10m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: critical
                    name: BoutiqueTauxErreurEleve
                    panel_expr: "sum(rate(http_requests_total{job=\"boutique\", status=~\"\
                        5..\"}[5m]))\n  /\nsum(rate(http_requests_total{job=\"boutique\"\
                        }[5m]))"
                    severity: critical
                    summary: Trop de reponses en erreur
                    test:
                        eval_time: 15m
                        exp_annotations:
                            description: Plus de 2 % des reponses du service sont
                                en erreur serveur depuis 10 minutes.
                            summary: Trop de reponses en erreur
                        exp_labels:
                            criticality: high
                            env: prod
                            service: boutique
                            severity: critical
                        series:
                        -   points: 0+1000x20
                            series: http_requests_total{job="boutique", status="500"}
                        -   points: 0+961x20
                            series: http_requests_total{job="boutique", status="200"}
                    threshold: '0.02'
                    threshold_field: error_rate
                    threshold_unit: proportion (0.05 = 5 %)
                group: boutique-prod-error_rate
                summary: Trop de reponses en erreur serveur
                traps:
                - 'Un ratio sur un denominateur nul donne `NaN`, et une comparaison
                    avec `NaN` est fausse : l''alerte ne se declenche pas. Un service
                    qui ne recoit plus **aucune** requete est donc invisible ici —
                    c''est la famille `availability` qui le voit.'
                - '`rate()` sur une fenetre plus courte que deux intervalles de collecte
                    rend `NaN`. Avec une collecte toutes les 30 s, une fenetre de
                    5 minutes laisse de la marge ; une fenetre d''une minute n''en
                    laisse aucune.'
                - 'Le libelle de statut n''est pas normalise : `status`, `code`, `status_code`
                    selon la bibliotheque. Se tromper de nom donne une regle valide,
                    acceptee par promtool, et definitivement muette.'
                - Compter les 5xx seulement laisse passer les timeouts cote client
                    et les connexions refusees, qui ne produisent aucune reponse et
                    donc aucune ligne dans le compteur.
            latency:
                alerts:
                -   description: Le quantile 95 du temps de reponse depasse 0.8 seconde(s)
                        depuis 10 minutes.
                    expr: "histogram_quantile(0.95,\n  sum by (le) (rate(http_request_duration_seconds_bucket{job=\"\
                        boutique\"}[5m]))\n) > 0.8"
                    for: 10m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueLatenceElevee
                    panel_expr: "histogram_quantile(0.95,\n  sum by (le) (rate(http_request_duration_seconds_bucket{job=\"\
                        boutique\"}[5m]))\n)"
                    severity: warning
                    summary: Le service repond trop lentement
                    test:
                        eval_time: 15m
                        exp_annotations:
                            description: Le quantile 95 du temps de reponse depasse
                                0.8 seconde(s) depuis 10 minutes.
                            summary: Le service repond trop lentement
                        exp_labels:
                            criticality: high
                            env: prod
                            service: boutique
                            severity: warning
                        series:
                        -   points: 0+10x20
                            series: http_request_duration_seconds_bucket{job="boutique",
                                le="0.8"}
                        -   points: 0+100x20
                            series: http_request_duration_seconds_bucket{job="boutique",
                                le="1.6"}
                        -   points: 0+100x20
                            series: http_request_duration_seconds_bucket{job="boutique",
                                le="+Inf"}
                    threshold: '0.8'
                    threshold_field: latency_p95_seconds
                    threshold_unit: secondes
                group: boutique-prod-latency
                summary: Le service repond trop lentement
                traps:
                - '`histogram_quantile` **interpole lineairement** dans le seau ou
                    tombe le quantile. La precision du resultat ne depasse donc jamais
                    celle du decoupage en seaux : avec des seaux 0.5 s / 2 s, aucun
                    quantile ne peut valoir 1.2 s autrement que par interpolation.'
                - Si le quantile tombe dans le dernier seau (`+Inf`), la fonction
                    rend la borne haute du seau precedent — jamais l'infini. Une latence
                    catastrophique peut donc s'afficher comme egale a la borne du
                    plus grand seau fini, et ne pas franchir un seuil place au-dessus.
                - 'L''agregation `sum by (le)` est obligatoire avant `histogram_quantile`
                    : appliquer la fonction a des seaux non agreges calcule un quantile
                    par instance, ce qui n''a pas de sens quand on veut celui du service.'
                - 'Les seaux d''un histogramme sont **cumulatifs** : `le="2"` compte
                    aussi les observations sous 0.5 s. Ecrire une serie de test avec
                    des seaux decroissants produit un histogramme invalide que Prometheus
                    accepte et interprete de travers.'
            probe:
                alerts:
                -   description: 'La sonde externe sur {{ $labels.instance }} echoue
                        depuis 5 minutes. Le service peut tourner et rester injoignable
                        : c''est precisement ce que cette sonde voit et que les autres
                        ne voient pas.'
                    expr: probe_success{job="blackbox"} == 0
                    for: 5m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: critical
                    name: BoutiqueSondeExterneEnEchec
                    panel_expr: probe_success{job="blackbox"}
                    severity: critical
                    summary: Le service n'est plus joignable de l'exterieur
                    test:
                        eval_time: 6m
                        exp_annotations:
                            description: 'La sonde externe sur https://sonde-de-test.invalid
                                echoue depuis 5 minutes. Le service peut tourner et
                                rester injoignable : c''est precisement ce que cette
                                sonde voit et que les autres ne voient pas.'
                            summary: Le service n'est plus joignable de l'exterieur
                        exp_labels:
                            criticality: high
                            env: prod
                            instance: https://sonde-de-test.invalid
                            job: blackbox
                            service: boutique
                            severity: critical
                        series:
                        -   points: 0+0x10
                            series: probe_success{job="blackbox", instance="https://sonde-de-test.invalid"}
                    threshold: ''
                    threshold_field: ''
                    threshold_unit: ''
                -   description: 'Le certificat servi sur {{ $labels.instance }} expire
                        dans moins de 30 jours. Un certificat expire ne previent pas
                        : il casse toutes les connexions d''un coup.'
                    expr: "(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"} -\
                        \ time()\n) / 86400 < 30"
                    for: 15m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueCertificatBientotExpire
                    panel_expr: "(\n  probe_ssl_earliest_cert_expiry{job=\"blackbox\"\
                        } - time()\n) / 86400"
                    severity: warning
                    summary: Un certificat TLS approche de son expiration
                    test:
                        eval_time: 20m
                        exp_annotations:
                            description: 'Le certificat servi sur https://sonde-de-test.invalid
                                expire dans moins de 30 jours. Un certificat expire
                                ne previent pas : il casse toutes les connexions d''un
                                coup.'
                            summary: Un certificat TLS approche de son expiration
                        exp_labels:
                            criticality: high
                            env: prod
                            instance: https://sonde-de-test.invalid
                            job: blackbox
                            service: boutique
                            severity: warning
                        series:
                        -   points: 1297200+0x25
                            series: probe_ssl_earliest_cert_expiry{job="blackbox",
                                instance="https://sonde-de-test.invalid"}
                    threshold: '30'
                    threshold_field: certificate_days
                    threshold_unit: jours avant expiration
                group: boutique-prod-probe
                summary: 'Sonde externe : joignabilite et expiration du certificat'
                traps:
                - 'La configuration de sonde du blackbox exporter est un ballet de
                    `relabel_configs` : l''adresse a sonder passe par `__param_target`,
                    puis devient `instance`, et `__address__` est finalement remplace
                    par l''adresse de l''exporter. Sauter une etape fait sonder l''exporter
                    lui-meme, qui repond toujours.'
                - '`probe_ssl_earliest_cert_expiry` n''existe que pour les sondes
                    **HTTPS**. Une URL en `http://` ne produit pas cette serie, et
                    l''alerte de certificat reste muette sans que rien ne le signale.'
                - La sonde voit ce qu'un client voit depuis le reseau du collecteur.
                    Si celui-ci est dans le cluster, elle ne teste ni le DNS public,
                    ni le repartiteur de charge, ni le pare-feu — c'est-a-dire l'essentiel
                    de ce qui casse.
                - Un certificat renouvele automatiquement declenche quand meme l'alerte
                    si le renouvellement echoue silencieusement. C'est le but ; ce
                    n'est pas un faux positif.
            restarts:
                alerts:
                -   description: Le conteneur {{ $labels.container }} du pod {{ $labels.pod
                        }} a redemarre plus de 2 fois en une heure.
                    expr: "increase(\n  kube_pod_container_status_restarts_total{namespace=\"\
                        boutique-prod\"}[1h]\n) > 2"
                    for: 5m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueRedemarragesEnBoucle
                    panel_expr: "increase(\n  kube_pod_container_status_restarts_total{namespace=\"\
                        boutique-prod\"}[1h]\n)"
                    severity: warning
                    summary: Un conteneur redemarre en boucle
                    test:
                        eval_time: 70m
                        exp_annotations:
                            description: Le conteneur conteneur-de-test du pod pod-de-test
                                a redemarre plus de 2 fois en une heure.
                            summary: Un conteneur redemarre en boucle
                        exp_labels:
                            container: conteneur-de-test
                            criticality: high
                            env: prod
                            namespace: boutique-prod
                            pod: pod-de-test
                            service: boutique
                            severity: warning
                        series:
                        -   points: 0+1x70
                            series: kube_pod_container_status_restarts_total{namespace="boutique-prod",
                                pod="pod-de-test", container="conteneur-de-test"}
                    threshold: '2'
                    threshold_field: restarts_per_hour
                    threshold_unit: redemarrages par heure
                group: boutique-prod-restarts
                summary: Un conteneur redemarre en boucle
                traps:
                - '`kube_pod_container_status_restarts_total` est remis a zero quand
                    le pod est recree — ce n''est pas un compteur monotone du point
                    de vue du service. `increase()` gere la remise a zero d''une serie,
                    mais pas la disparition d''une serie au profit d''une autre :
                    un pod remplace fait perdre l''historique.'
                - Une sonde de vivacite trop stricte produit exactement cette alerte,
                    alors que l'application va bien. Verifier le reglage de la sonde
                    avant de chercher dans le code fait gagner des heures.
                - kube-state-metrics doit tourner **et** etre collecte. Son absence
                    rend cette famille silencieuse sans qu'aucune erreur n'apparaisse
                    nulle part.
            saturation:
                alerts:
                -   description: Le conteneur {{ $labels.container }} du pod {{ $labels.pod
                        }} depasse 85 % de sa limite memoire depuis 10 minutes. Un
                        depassement effectif provoque un OOMKill, pas un ralentissement.
                    expr: "container_memory_working_set_bytes{namespace=\"boutique-prod\"\
                        , container!=\"\"}\n  /\ncontainer_spec_memory_limit_bytes{namespace=\"\
                        boutique-prod\", container!=\"\"}\n  > 0.85"
                    for: 10m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueMemoireProcheDeLaLimite
                    panel_expr: "container_memory_working_set_bytes{namespace=\"boutique-prod\"\
                        , container!=\"\"}\n  /\ncontainer_spec_memory_limit_bytes{namespace=\"\
                        boutique-prod\", container!=\"\"}"
                    severity: warning
                    summary: Un conteneur approche de sa limite memoire
                    test:
                        eval_time: 15m
                        exp_annotations:
                            description: Le conteneur conteneur-de-test du pod pod-de-test
                                depasse 85 % de sa limite memoire depuis 10 minutes.
                                Un depassement effectif provoque un OOMKill, pas un
                                ralentissement.
                            summary: Un conteneur approche de sa limite memoire
                        exp_labels:
                            container: conteneur-de-test
                            criticality: high
                            env: prod
                            namespace: boutique-prod
                            pod: pod-de-test
                            service: boutique
                            severity: warning
                        series:
                        -   points: 925000000+0x20
                            series: container_memory_working_set_bytes{namespace="boutique-prod",
                                pod="pod-de-test", container="conteneur-de-test"}
                        -   points: 1000000000+0x20
                            series: container_spec_memory_limit_bytes{namespace="boutique-prod",
                                pod="pod-de-test", container="conteneur-de-test"}
                    threshold: '0.85'
                    threshold_field: memory_ratio
                    threshold_unit: proportion de la limite (0.9 = 90 %)
                -   description: Le pod {{ $labels.pod }} consomme plus de 3 cœur(s)
                        depuis 10 minutes.
                    expr: "sum by (pod) (\n  rate(container_cpu_usage_seconds_total{namespace=\"\
                        boutique-prod\", container!=\"\"}[5m])\n) > 3"
                    for: 10m
                    labels:
                        criticality: high
                        env: prod
                        service: boutique
                        severity: warning
                    name: BoutiqueCpuEleve
                    panel_expr: "sum by (pod) (\n  rate(container_cpu_usage_seconds_total{namespace=\"\
                        boutique-prod\", container!=\"\"}[5m])\n)"
                    severity: warning
                    summary: Un pod consomme durablement beaucoup de CPU
                    test:
                        eval_time: 15m
                        exp_annotations:
                            description: Le pod pod-de-test consomme plus de 3 cœur(s)
                                depuis 10 minutes.
                            summary: Un pod consomme durablement beaucoup de CPU
                        exp_labels:
                            criticality: high
                            env: prod
                            pod: pod-de-test
                            service: boutique
                            severity: warning
                        series:
                        -   points: 0+240x20
                            series: container_cpu_usage_seconds_total{namespace="boutique-prod",
                                pod="pod-de-test", container="conteneur-de-test"}
                    threshold: '3'
                    threshold_field: cpu_cores
                    threshold_unit: cœurs
                group: boutique-prod-saturation
                summary: Consommation proche des limites (memoire, CPU)
                traps:
                - 'Un conteneur **sans limite memoire** n''expose pas `container_spec_memory_limit_bytes`,
                    ou l''expose a zero : la division ne donne aucun resultat, et
                    l''alerte reste muette. L''absence d''alerte ne dit donc rien
                    de la sante du pod.'
                - '`container_memory_working_set_bytes` est la metrique que le kubelet
                    compare a la limite pour decider d''un OOMKill — pas `container_memory_usage_bytes`,
                    qui inclut le cache de fichiers recuperable et surestime largement
                    la pression reelle.'
                - 'Le filtre `container!=""` n''est pas cosmetique : cAdvisor expose
                    aussi des series agregees au niveau du pod, avec un libelle `container`
                    vide. Les compter deux fois double la consommation apparente.'
                - 'Le throttling CPU ne se voit pas dans `container_cpu_usage_seconds_total`
                    : un pod bride consomme moins, donc parait sain. C''est `container_cpu_cfs_throttled_seconds_total`
                    qui le montre.'
        targets:
        - api-1.example.net:9090
        - api-2.example.net:9090
        thresholds:
            certificate_days: '30'
            cpu_cores: '3'
            error_rate: '0.02'
            latency_p95_seconds: '0.8'
            memory_ratio: '0.85'
            restarts_per_hour: '2'
