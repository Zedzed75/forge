# =============================================================================
# availability — The target no longer answers the collector
# =============================================================================
# Alerting rules of "boutique", environment dev.
# File generated by forge.
#
# The simplest alert, and the one most often forgotten: `up == 0`.
# Prometheus builds the `up` metric itself on every collection, without any
# exporter having to expose it.
#
# It is the only family that depends on no naming convention: it works from
# the very first collection.
#
# POINTS TO WATCH
#
# `up == 0` only fires if the target is **known** to the collector. A target
# never declared produces no series, and therefore no alert: silence is not
# health. That is why the targets are written in the configuration rather
# than discovered.
#
# Without a `for` clause, a two-minute restart wakes somebody up. With a
# `for` that is too long, a real outage waits. Five minutes is the usual
# compromise, not a truth.
#
# An alert that fires for **every** instance at once almost always points at
# the collector or the network, not at the service. A receiver that does not
# tell the difference drowns the on-call rota.
#
# Every alert of this file is put to the test by a unit test:
#   promtool test rules tests/dev/availability.yml
# =============================================================================

groups:
  - name: boutique-dev-availability
    rules:
      # -----------------------------------------------------------------------
      # The target no longer answers the collector
      # -----------------------------------------------------------------------
      - alert: BoutiqueCibleInjoignable
        expr: |
          up{job="boutique"} == 0
        # The condition has to hold for this duration before firing: without it,
        # the slightest oscillation wakes somebody up.
        for: 5m
        labels:
          env: dev
          service: boutique
          severity: critical
        annotations:
          summary: The target no longer answers the collector
          description: Instance {{ $labels.instance }} of job {{ $labels.job }} has not answered for 5 minutes.
