# =============================================================================
# saturation — Consumption close to the limits (memory, CPU)
# =============================================================================
# Alerting rules of "boutique", environment dev.
# File generated by forge.
#
# Two alerts of a different nature, and the distinction matters: exceeding
# its memory limit gets the container **killed** (OOMKill), exceeding its
# CPU limit only makes it slow down (throttling).
#
# Memory is therefore watched as a proportion of its limit; CPU in absolute
# value, because a pod with no CPU limit is frequent and legitimate.
#
# Requires: cAdvisor, exposed by the kubelet.
#
# POINTS TO WATCH
#
# A container **with no memory limit** does not expose
# `container_spec_memory_limit_bytes`, or exposes it at zero: the division
# gives no result, and the alert stays mute. The absence of an alert
# therefore says nothing about the health of the pod.
#
# `container_memory_working_set_bytes` is the metric the kubelet compares to
# the limit in order to decide on an OOMKill -- not
# `container_memory_usage_bytes`, which includes the reclaimable file cache
# and largely overestimates the real pressure.
#
# The `container!=""` filter is not cosmetic: cAdvisor also exposes series
# aggregated at the pod level, with an empty `container` label. Counting
# them twice doubles the apparent consumption.
#
# CPU throttling is not visible in `container_cpu_usage_seconds_total`: a
# throttled pod consumes less, and therefore looks healthy. It is
# `container_cpu_cfs_throttled_seconds_total` that shows it.
#
# Every alert of this file is put to the test by a unit test:
#   promtool test rules tests/dev/saturation.yml
# =============================================================================

groups:
  - name: boutique-dev-saturation
    rules:
      # -----------------------------------------------------------------------
      # A container is approaching its memory limit
      # Threshold: 0.9 (proportion of the limit (0.9 = 90 %)), adjustable through
      # monitoring.environments.dev.thresholds.memory_ratio
      # in forge.yml.
      # -----------------------------------------------------------------------
      - alert: BoutiqueMemoryNearLimit
        expr: |
          container_memory_working_set_bytes{namespace="boutique-dev", container!=""}
            /
          container_spec_memory_limit_bytes{namespace="boutique-dev", container!=""}
            > 0.9
        # The condition has to hold for this duration before firing: without it,
        # the slightest oscillation wakes somebody up.
        for: 10m
        labels:
          env: dev
          service: boutique
          severity: warning
        annotations:
          summary: A container is approaching its memory limit
          description: Container {{ $labels.container }} of pod {{ $labels.pod }} has exceeded 90 % of its memory limit for 10 minutes. An actual overrun causes an OOMKill, not a slowdown.

      # -----------------------------------------------------------------------
      # A pod is durably consuming a lot of CPU
      # Threshold: 1.5 (cores), adjustable through
      # monitoring.environments.dev.thresholds.cpu_cores
      # in forge.yml.
      # -----------------------------------------------------------------------
      - alert: BoutiqueHighCpuUsage
        expr: |
          sum by (pod) (
            rate(container_cpu_usage_seconds_total{namespace="boutique-dev", container!=""}[5m])
          ) > 1.5
        # The condition has to hold for this duration before firing: without it,
        # the slightest oscillation wakes somebody up.
        for: 10m
        labels:
          env: dev
          service: boutique
          severity: warning
        annotations:
          summary: A pod is durably consuming a lot of CPU
          description: Pod {{ $labels.pod }} has been consuming more than 1.5 core(s) for 10 minutes.
