# =============================================================================
# latency — The service answers too slowly
# =============================================================================
# Alerting rules of "boutique", environment prod.
# File generated by forge.
#
# 95th percentile computed on a histogram, not an average: an average
# response time hides exactly what is being looked for.
#
# Requires a histogram, not a summary: `histogram_quantile` works on the
# `_bucket` buckets, which a summary does not expose.
#
# Requires: the application itself (Prometheus client).
#
# POINTS TO WATCH
#
# `histogram_quantile` **interpolates linearly** in the bucket the
# percentile falls into. The precision of the result therefore never exceeds
# that of the bucket layout: with 0.5 s / 2 s buckets, no percentile can be
# worth 1.2 s other than by interpolation.
#
# If the percentile falls into the last bucket (`+Inf`), the function
# returns the upper bound of the previous bucket -- never infinity. A
# catastrophic latency can therefore show up as equal to the bound of the
# largest finite bucket, and not cross a threshold placed above it.
#
# The `sum by (le)` aggregation is mandatory before `histogram_quantile`:
# applying the function to non-aggregated buckets computes one percentile
# per instance, which makes no sense when the one of the service is wanted.
#
# The buckets of a histogram are **cumulative**: `le="2"` also counts the
# observations below 0.5 s. Writing a test series with decreasing buckets
# produces an invalid histogram that Prometheus accepts and interprets
# wrongly.
#
# Every alert of this file is put to the test by a unit test:
#   promtool test rules tests/prod/latency.yml
# =============================================================================

groups:
  - name: boutique-prod-latency
    rules:
      # -----------------------------------------------------------------------
      # The service answers too slowly
      # Threshold: 0.8 (seconds), adjustable through
      # monitoring.environments.prod.thresholds.latency_p95_seconds
      # in forge.yml.
      # -----------------------------------------------------------------------
      - alert: BoutiqueHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="boutique"}[5m]))
          ) > 0.8
        # The condition has to hold for this duration before firing: without it,
        # the slightest oscillation wakes somebody up.
        for: 10m
        labels:
          criticality: high
          env: prod
          service: boutique
          severity: warning
        annotations:
          summary: The service answers too slowly
          description: The 95th percentile of the response time has exceeded 0.8 second(s) for 10 minutes.
