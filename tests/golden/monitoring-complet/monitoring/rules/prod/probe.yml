# =============================================================================
# probe — External probe: reachability and certificate expiry
# =============================================================================
# Alerting rules of "boutique", environment prod.
# File generated by forge.
#
# The only family that looks at the service **from the outside**, like a
# user. A service can be running perfectly and stay unreachable: broken DNS,
# badly configured ingress, expired certificate. No internal metric shows
# it.
#
# Requires a blackbox exporter reachable by the collector, and URLs to probe
# declared per environment.
#
# Requires: blackbox exporter.
#
# POINTS TO WATCH
#
# The probe configuration of the blackbox exporter is a ballet of
# `relabel_configs`: the address to probe goes through `__param_target`,
# then becomes `instance`, and `__address__` is finally replaced by the
# address of the exporter. Skipping a step makes it probe the exporter
# itself, which always answers.
#
# `probe_ssl_earliest_cert_expiry` only exists for **HTTPS** probes. A URL
# in `http://` does not produce this series, and the certificate alert stays
# mute without anything reporting it.
#
# The probe sees what a client sees from the network of the collector. If
# that one is inside the cluster, it tests neither the public DNS, nor the
# load balancer, nor the firewall -- that is to say, most of what breaks.
#
# A certificate renewed automatically still triggers the alert if the
# renewal fails silently. That is the point; it is not a false positive.
#
# Every alert of this file is put to the test by a unit test:
#   promtool test rules tests/prod/probe.yml
# =============================================================================

groups:
  - name: boutique-prod-probe
    rules:
      # -----------------------------------------------------------------------
      # The service is no longer reachable from the outside
      # -----------------------------------------------------------------------
      - alert: BoutiqueExternalProbeFailed
        expr: |
          probe_success{job="blackbox"} == 0
        # The condition has to hold for this duration before firing: without it,
        # the slightest oscillation wakes somebody up.
        for: 5m
        labels:
          criticality: high
          env: prod
          service: boutique
          severity: critical
        annotations:
          summary: The service is no longer reachable from the outside
          description: 'The external probe on {{ $labels.instance }} has been failing for 5 minutes. The service can be running and stay unreachable: that is precisely what this probe sees and the others do not.'

      # -----------------------------------------------------------------------
      # A TLS certificate is approaching its expiry
      # Threshold: 30 (days before expiry), adjustable through
      # monitoring.environments.prod.thresholds.certificate_days
      # in forge.yml.
      # -----------------------------------------------------------------------
      - alert: BoutiqueCertificateExpiringSoon
        expr: |
          (
            probe_ssl_earliest_cert_expiry{job="blackbox"} - time()
          ) / 86400 < 30
        # The condition has to hold for this duration before firing: without it,
        # the slightest oscillation wakes somebody up.
        for: 15m
        labels:
          criticality: high
          env: prod
          service: boutique
          severity: warning
        annotations:
          summary: A TLS certificate is approaching its expiry
          description: 'The certificate served on {{ $labels.instance }} expires in less than 30 days. An expired certificate gives no warning: it breaks every connection at once.'
