# =============================================================================
# Unit tests of the "latency" alerts — environment dev
# =============================================================================
# File generated by forge, played by:
#
#   promtool test rules tests/dev/latency.yml
#
# What these tests check, and that nothing else checks: **that the alerts really
# fire**. `promtool check rules` only controls the syntax — a faultless rule can
# quote a metric that does not exist, a misspelled label, or compare on the wrong
# side of the threshold, and stay mute for ever.
#
# The series below are SYNTHETIC: promtool builds them itself, they do not need
# to exist anywhere. The instance, pod and container names are therefore test
# names, never real names.
#
# The expected annotations are computed from the same values as the rule: they
# cannot diverge from its wording.
# =============================================================================

rule_files:
  - ../../rules/dev/latency.yml

# Pace at which promtool evaluates the rules during the test.
evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # HighLatency — The service answers too slowly
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: http_request_duration_seconds_bucket{job="boutique", le="2"}
        values: 0+10x20
      - series: http_request_duration_seconds_bucket{job="boutique", le="4"}
        values: 0+100x20
      - series: http_request_duration_seconds_bucket{job="boutique", le="+Inf"}
        values: 0+100x20
    alert_rule_test:
        # The evaluation instant exceeds the `for` clause of the rule
        # (10m): the alert must therefore have moved from "pending" to
        # "firing".
      - eval_time: 15m
        alertname: HighLatency
        exp_alerts:
          - exp_labels:
              env: dev
              service: boutique
              severity: warning
            exp_annotations:
              summary: The service answers too slowly
              description: The 95th percentile of the response time has exceeded 2 second(s) for 10 minutes.
