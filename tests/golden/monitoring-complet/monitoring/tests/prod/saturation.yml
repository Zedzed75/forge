# =============================================================================
# Tests unitaires des alertes « saturation » — environnement prod
# =============================================================================
# Fichier généré par forge, joué par :
#
#   promtool test rules tests/prod/saturation.yml
#
# Ce que ces tests vérifient, et que rien d'autre ne vérifie : **que les alertes
# se déclenchent réellement**. `promtool check rules` ne contrôle que la
# syntaxe — une règle irréprochable peut citer une métrique qui n'existe pas, un
# libellé mal orthographié, ou comparer du mauvais côté du seuil, et rester
# muette pour toujours.
#
# Les séries ci-dessous sont SYNTHÉTIQUES : promtool les fabrique lui-même, elles
# n'ont besoin d'exister nulle part. Les noms d'instance, de pod et de conteneur
# sont donc des noms de test, jamais des noms réels.
#
# Les annotations attendues sont calculées à partir des mêmes valeurs que la
# règle : elles ne peuvent pas diverger de sa formulation.
# =============================================================================

rule_files:
  - ../../rules/prod/saturation.yml

# Rythme auquel promtool évalue les règles pendant le test.
evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # BoutiqueMemoireProcheDeLaLimite — Un conteneur approche de sa limite memoire
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: container_memory_working_set_bytes{namespace="boutique-prod", pod="pod-de-test", container="conteneur-de-test"}
        values: 925000000+0x20
      - series: container_spec_memory_limit_bytes{namespace="boutique-prod", pod="pod-de-test", container="conteneur-de-test"}
        values: 1000000000+0x20
    alert_rule_test:
        # L'instant d'évaluation dépasse la clause `for` de la règle
        # (10m) : l'alerte doit donc être passée de « pending » à
        # « firing ».
      - eval_time: 15m
        alertname: BoutiqueMemoireProcheDeLaLimite
        exp_alerts:
          - exp_labels:
              container: conteneur-de-test
              criticality: high
              env: prod
              namespace: boutique-prod
              pod: pod-de-test
              service: boutique
              severity: warning
            exp_annotations:
              summary: Un conteneur approche de sa limite memoire
              description: Le conteneur conteneur-de-test du pod pod-de-test depasse 85 % de sa limite memoire depuis 10 minutes. Un depassement effectif provoque un OOMKill, pas un ralentissement.

  # ---------------------------------------------------------------------------
  # BoutiqueCpuEleve — Un pod consomme durablement beaucoup de CPU
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: container_cpu_usage_seconds_total{namespace="boutique-prod", pod="pod-de-test", container="conteneur-de-test"}
        values: 0+240x20
    alert_rule_test:
        # L'instant d'évaluation dépasse la clause `for` de la règle
        # (10m) : l'alerte doit donc être passée de « pending » à
        # « firing ».
      - eval_time: 15m
        alertname: BoutiqueCpuEleve
        exp_alerts:
          - exp_labels:
              criticality: high
              env: prod
              pod: pod-de-test
              service: boutique
              severity: warning
            exp_annotations:
              summary: Un pod consomme durablement beaucoup de CPU
              description: Le pod pod-de-test consomme plus de 3 cœur(s) depuis 10 minutes.
