# =============================================================================
# Unit tests of the "saturation" alerts — environment prod
# =============================================================================
# File generated by forge, played by:
#
#   promtool test rules tests/prod/saturation.yml
#
# What these tests check, and that nothing else checks: **that the alerts really
# fire**. `promtool check rules` only controls the syntax — a faultless rule can
# quote a metric that does not exist, a misspelled label, or compare on the wrong
# side of the threshold, and stay mute for ever.
#
# The series below are SYNTHETIC: promtool builds them itself, they do not need
# to exist anywhere. The instance, pod and container names are therefore test
# names, never real names.
#
# The expected annotations are computed from the same values as the rule: they
# cannot diverge from its wording.
# =============================================================================

rule_files:
  - ../../rules/prod/saturation.yml

# Pace at which promtool evaluates the rules during the test.
evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # BoutiqueMemoireProcheDeLaLimite — A container is approaching its memory limit
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: container_memory_working_set_bytes{namespace="boutique-prod", pod="test-pod", container="test-container"}
        values: 925000000+0x20
      - series: container_spec_memory_limit_bytes{namespace="boutique-prod", pod="test-pod", container="test-container"}
        values: 1000000000+0x20
    alert_rule_test:
        # The evaluation instant exceeds the `for` clause of the rule
        # (10m): the alert must therefore have moved from "pending" to
        # "firing".
      - eval_time: 15m
        alertname: BoutiqueMemoireProcheDeLaLimite
        exp_alerts:
          - exp_labels:
              container: test-container
              criticality: high
              env: prod
              namespace: boutique-prod
              pod: test-pod
              service: boutique
              severity: warning
            exp_annotations:
              summary: A container is approaching its memory limit
              description: Container test-container of pod test-pod has exceeded 85 % of its memory limit for 10 minutes. An actual overrun causes an OOMKill, not a slowdown.

  # ---------------------------------------------------------------------------
  # BoutiqueCpuEleve — A pod is durably consuming a lot of CPU
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: container_cpu_usage_seconds_total{namespace="boutique-prod", pod="test-pod", container="test-container"}
        values: 0+240x20
    alert_rule_test:
        # The evaluation instant exceeds the `for` clause of the rule
        # (10m): the alert must therefore have moved from "pending" to
        # "firing".
      - eval_time: 15m
        alertname: BoutiqueCpuEleve
        exp_alerts:
          - exp_labels:
              criticality: high
              env: prod
              pod: test-pod
              service: boutique
              severity: warning
            exp_annotations:
              summary: A pod is durably consuming a lot of CPU
              description: Pod test-pod has been consuming more than 3 core(s) for 10 minutes.
