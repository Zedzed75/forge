# =============================================================================
# error_rate — Too many responses in server error
# =============================================================================
# Alerting rules of "storefront", environment dev.
# File generated by forge.
#
# A ratio, never a count: a hundred errors out of a million requests is not
# the same thing as a hundred errors out of two hundred.
#
# The name of the counter and that of the status code label are
# **configurable**: they depend on the client library used, and guessing one
# would produce an alert that never fires.
#
# Requires: the application itself (Prometheus client).
#
# POINTS TO WATCH
#
# A ratio over a null denominator gives `NaN`, and a comparison with `NaN`
# is false: the alert does not fire. A service that no longer receives
# **any** request is therefore invisible here -- it is the `availability`
# family that sees it.
#
# `rate()` over a window shorter than two collection intervals returns
# `NaN`. With a collection every 30 s, a 5-minute window leaves room; a one-
# minute window leaves none.
#
# The status label is not standardised: `status`, `code`, `status_code`
# depending on the library. Getting the name wrong gives a valid rule,
# accepted by promtool, and permanently mute.
#
# Counting only the 5xx lets through the client-side timeouts and the
# refused connections, which produce no response and therefore no line in
# the counter.
#
# Every alert of this file is put to the test by a unit test:
#   promtool test rules tests/dev/error_rate.yml
# =============================================================================

groups:
  - name: storefront-dev-error_rate
    rules:
      # -----------------------------------------------------------------------
      # Too many responses in error
      # Threshold: 0.2 (proportion (0.05 = 5 %)), adjustable through
      # monitoring.environments.dev.thresholds.error_rate
      # in forge.yml.
      # -----------------------------------------------------------------------
      - alert: HighErrorRate
        expr: |
          sum(rate(http_requests_total{job="storefront", status=~"5.."}[5m]))
            /
          sum(rate(http_requests_total{job="storefront"}[5m]))
            > 0.2
        # The condition has to hold for this duration before firing: without it,
        # the slightest oscillation wakes somebody up.
        for: 10m
        labels:
          env: dev
          service: storefront
          severity: critical
        annotations:
          summary: Too many responses in error
          description: More than 20 % of the responses of the service have been server errors for 10 minutes.
