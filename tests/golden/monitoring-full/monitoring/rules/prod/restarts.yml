# =============================================================================
# restarts — A container is restarting in a loop
# =============================================================================
# Alerting rules of "storefront", environment prod.
# File generated by forge.
#
# A service can answer correctly and restart every ten minutes. None of the
# other families sees it: availability is good between two restarts, and so
# is the error rate.
#
# It is often the first visible sign of a memory leak or of a badly tuned
# liveness probe.
#
# Requires: kube-state-metrics.
#
# POINTS TO WATCH
#
# `kube_pod_container_status_restarts_total` is reset to zero when the pod
# is recreated -- it is not a monotonic counter from the point of view of
# the service. `increase()` handles the reset of a series, but not the
# disappearance of a series in favour of another: a replaced pod loses the
# history.
#
# A liveness probe that is too strict produces exactly this alert, while the
# application is fine. Checking the tuning of the probe before looking in
# the code saves hours.
#
# kube-state-metrics has to be running **and** be collected. Its absence
# makes this family silent without any error appearing anywhere.
#
# Every alert of this file is put to the test by a unit test:
#   promtool test rules tests/prod/restarts.yml
# =============================================================================

groups:
  - name: storefront-prod-restarts
    rules:
      # -----------------------------------------------------------------------
      # A container is restarting in a loop
      # Threshold: 2 (restarts per hour), adjustable through
      # monitoring.environments.prod.thresholds.restarts_per_hour
      # in forge.yml.
      # -----------------------------------------------------------------------
      - alert: ContainerRestartLoop
        expr: |
          increase(
            kube_pod_container_status_restarts_total{namespace="storefront-prod"}[1h]
          ) > 2
        # The condition has to hold for this duration before firing: without it,
        # the slightest oscillation wakes somebody up.
        for: 5m
        labels:
          criticality: high
          env: prod
          service: storefront
          severity: warning
        annotations:
          summary: A container is restarting in a loop
          description: Container {{ $labels.container }} of pod {{ $labels.pod }} has restarted more than 2 times in one hour.
