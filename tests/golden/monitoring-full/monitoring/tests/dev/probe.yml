# =============================================================================
# Unit tests of the "probe" alerts — environment dev
# =============================================================================
# File generated by forge, played by:
#
#   promtool test rules tests/dev/probe.yml
#
# What these tests check, and that nothing else checks: **that the alerts really
# fire**. `promtool check rules` only controls the syntax — a faultless rule can
# quote a metric that does not exist, a misspelled label, or compare on the wrong
# side of the threshold, and stay mute for ever.
#
# The series below are SYNTHETIC: promtool builds them itself, they do not need
# to exist anywhere. The instance, pod and container names are therefore test
# names, never real names.
#
# The expected annotations are computed from the same values as the rule: they
# cannot diverge from its wording.
# =============================================================================

rule_files:
  - ../../rules/dev/probe.yml

# Pace at which promtool evaluates the rules during the test.
evaluation_interval: 1m

tests:
  # ---------------------------------------------------------------------------
  # ExternalProbeFailed — The service is no longer reachable from the outside
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: probe_success{job="blackbox", instance="https://test-probe.invalid"}
        values: 0+0x10
    alert_rule_test:
        # The evaluation instant exceeds the `for` clause of the rule
        # (5m): the alert must therefore have moved from "pending" to
        # "firing".
      - eval_time: 6m
        alertname: ExternalProbeFailed
        exp_alerts:
          - exp_labels:
              env: dev
              instance: https://test-probe.invalid
              job: blackbox
              service: boutique
              severity: critical
            exp_annotations:
              summary: The service is no longer reachable from the outside
              description: 'The external probe on https://test-probe.invalid has been failing for 5 minutes. The service can be running and stay unreachable: that is precisely what this probe sees and the others do not.'

  # ---------------------------------------------------------------------------
  # CertificateExpiringSoon — A TLS certificate is approaching its expiry
  # ---------------------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: probe_ssl_earliest_cert_expiry{job="blackbox", instance="https://test-probe.invalid"}
        values: 908400+0x25
    alert_rule_test:
        # The evaluation instant exceeds the `for` clause of the rule
        # (15m): the alert must therefore have moved from "pending" to
        # "firing".
      - eval_time: 20m
        alertname: CertificateExpiringSoon
        exp_alerts:
          - exp_labels:
              env: dev
              instance: https://test-probe.invalid
              job: blackbox
              service: boutique
              severity: warning
            exp_annotations:
              summary: A TLS certificate is approaching its expiry
              description: 'The certificate served on https://test-probe.invalid expires in less than 21 days. An expired certificate gives no warning: it breaks every connection at once.'
