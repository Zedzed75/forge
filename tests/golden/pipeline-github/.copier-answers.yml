        on_pull_request: true
        on_tag: false
    undeployed: []
    unknown_tools: []
    validate_jobs:
    -   default_branch_only: false
        environment: ''
        key: valider-helm
        kind: validate
        manual: false
        name: Valider Helm
        needs: *id028
        steps:
        -   env: *id029
            name: Install the tools
            run: *id030
            script:
            - if command -v apt-get >/dev/null; then apt-get update -qq && apt-get
                install -y -qq --no-install-recommends curl; fi
            - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
                | bash -s -- --version v3.16.3
            - curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
            - tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
            - install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
            workdir: ''
        -   env: *id031
            name: helm lint (dev)
            run: *id032
            script:
            - (cd helm && NO_COLOR=1 helm lint charts/boutique --kube-version 1.34.0
                --values charts/boutique/values.yaml --values charts/boutique/values-dev.yaml)
            workdir: helm
        -   env: *id033
            name: helm template (dev)
            run: *id034
            script:
            - (cd helm && NO_COLOR=1 helm template boutique charts/boutique --namespace
                boutique-dev --kube-version 1.34.0 --values charts/boutique/values.yaml
                --values charts/boutique/values-dev.yaml > /tmp/forge-helm-template-dev.out)
            workdir: helm
        -   env: *id035
            name: kubeconform -strict (dev)
            run: *id036
            script:
            - (cd helm && NO_COLOR=1 kubeconform -strict -summary -kubernetes-version
                1.34.0 -schema-location default - < /tmp/forge-helm-template-dev.out)
            workdir: helm
        -   env: *id037
            name: helm lint (prod)
            run: *id038
            script:
            - (cd helm && NO_COLOR=1 helm lint charts/boutique --kube-version 1.34.0
                --values charts/boutique/values.yaml --values charts/boutique/values-prod.yaml)
            workdir: helm
        -   env: *id039
            name: helm template (prod)
            run: *id040
            script:
            - (cd helm && NO_COLOR=1 helm template boutique charts/boutique --namespace
                boutique-prod --kube-version 1.34.0 --values charts/boutique/values.yaml
                --values charts/boutique/values-prod.yaml > /tmp/forge-helm-template-prod.out)
            workdir: helm
        -   env: *id041
            name: kubeconform -strict (prod)
            run: *id042
            script:
            - (cd helm && NO_COLOR=1 kubeconform -strict -summary -kubernetes-version
                1.34.0 -schema-location default - < /tmp/forge-helm-template-prod.out)
            workdir: helm
        tools: *id043
        unknown_tools: *id044
    -   default_branch_only: false
        environment: ''
        key: valider-pipeline
        kind: validate
        manual: false
        name: Valider Pipeline
        needs: *id045
        steps:
        -   env: *id046
            name: Install the tools
            run: *id047
            script:
            - if command -v apt-get >/dev/null; then apt-get update -qq && apt-get
                install -y -qq --no-install-recommends curl; fi
            - curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
            - tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
            - install -m 0755 /tmp/actionlint /usr/local/bin/actionlint
            workdir: ''
        -   env: *id048
            name: actionlint
            run: *id049
            script:
            - NO_COLOR=1 actionlint -no-color -oneline .github/workflows/ci.yml
            workdir: ''
        tools: *id050
        unknown_tools: *id051
    -   default_branch_only: false
        environment: ''
        key: valider-terraform
        kind: validate
        manual: false
        name: Valider Terraform
        needs: *id052
        steps:
        -   env: *id053
            name: Install the tools
            run: *id054
            script:
            - if command -v apt-get >/dev/null; then apt-get update -qq && apt-get
                install -y -qq --no-install-recommends curl unzip; fi
            - curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
            - unzip -qo /tmp/terraform.zip -d /tmp
            - install -m 0755 /tmp/terraform /usr/local/bin/terraform
            - curl -fsSL -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.59.1/tflint_linux_amd64.zip
            - unzip -qo /tmp/tflint.zip -d /tmp
            - install -m 0755 /tmp/tflint /usr/local/bin/tflint
            workdir: ''
        -   env: *id055
            name: terraform fmt
            run: *id056
            script:
            - (cd terraform && CHECKPOINT_DISABLE=1 NO_COLOR=1 TF_IN_AUTOMATION=1
                terraform fmt -check -recursive -diff -no-color)
            workdir: terraform
        -   env: *id057
            name: terraform init (dev)
            run: *id058
            script:
            - (cd terraform/environments/dev && CHECKPOINT_DISABLE=1 NO_COLOR=1 TF_IN_AUTOMATION=1
                terraform init -backend=false -input=false -no-color)
            workdir: terraform/environments/dev
        -   env: *id059
            name: terraform validate (dev)
            run: *id060
            script:
            - (cd terraform/environments/dev && CHECKPOINT_DISABLE=1 NO_COLOR=1 TF_IN_AUTOMATION=1
                terraform validate -no-color)
            workdir: terraform/environments/dev
        -   env: *id061
            name: terraform init (prod)
            run: *id062
            script:
            - (cd terraform/environments/prod && CHECKPOINT_DISABLE=1 NO_COLOR=1 TF_IN_AUTOMATION=1
                terraform init -backend=false -input=false -no-color)
            workdir: terraform/environments/prod
        -   env: *id063
            name: terraform validate (prod)
            run: *id064
            script:
            - (cd terraform/environments/prod && CHECKPOINT_DISABLE=1 NO_COLOR=1 TF_IN_AUTOMATION=1
                terraform validate -no-color)
            workdir: terraform/environments/prod
        -   env: *id065
            name: tflint
            run: *id066
            script:
            - (cd terraform && CHECKPOINT_DISABLE=1 NO_COLOR=1 TF_IN_AUTOMATION=1
                tflint --recursive --no-color)
            workdir: terraform
        tools: *id067
        unknown_tools: *id068
    workflow_name: boutique
    workflow_path: .github/workflows/ci.yml
forge_version: 1
plugin: pipeline
service:
    description: Boutique en ligne, chaine complete
    environments:
    -   domain: dev.example.net
        name: dev
        production: false
    -   domain: example.net
        name: prod
        production: true
    labels:
        tier: frontend
    name: boutique
    owner: Equipe Plateforme
    owner_email: plateforme@example.net
template_subdir: src/forge/plugins/pipeline/template

