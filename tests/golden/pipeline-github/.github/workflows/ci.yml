# =============================================================================
# ci.yml — chaîne d'intégration de « boutique »
# =============================================================================
# Fichier généré par forge. Ne l'éditez pas à la main : modifiez `forge.yml` à la
# racine du dépôt, puis relancez `forge generate` — ou `forge update --only
# pipeline` pour ne recevoir que les évolutions du gabarit.
#
# Ce fichier n'a pas été écrit domaine par domaine : chaque domaine déclaré dans
# `forge.yml` a dit lui-même quels outils il fallait lancer et dans quel
# répertoire. Ajouter une section à `forge.yml` ajoute donc un job ici, sans que
# ce gabarit change.
#
# Domaines pris en compte :
#   - Helm (helm) — 6 commande(s) de validation, déploie dev, prod
#   - Pipeline (pipeline) — 1 commande(s) de validation
#   - Terraform (terraform) — 6 commande(s) de validation, déploie dev, prod
#
# Aucun identifiant n'est écrit dans ce fichier. Les accès passent par les
# secrets du dépôt (`${{ secrets.* }}`) ou par le jeton fourni d'office.
# =============================================================================

name: boutique

on:
  push:
    branches:
      - main
  # Une validation n'empêche vraiment quelque chose qu'avant la fusion.
  pull_request:

# Droits minimaux : seule la lecture du dépôt est accordée par défaut.
permissions:
  contents: read
  # Nécessaire pour publier l'image dans le registre du dépôt.
  packages: write

# Une exécution par référence : un push qui en remplace un autre annule le
# précédent, plutôt que de faire la queue derrière lui.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  valider-helm:
    name: Valider Helm
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl; fi
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version v3.16.3
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: helm lint (dev)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm lint charts/boutique --kube-version 1.34.0 --values charts/boutique/values.yaml --values charts/boutique/values-dev.yaml

      - name: helm template (dev)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm template boutique charts/boutique --namespace boutique-dev --kube-version 1.34.0 --values charts/boutique/values.yaml --values charts/boutique/values-dev.yaml > /tmp/forge-helm-template-dev.out

      - name: kubeconform -strict (dev)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          kubeconform -strict -summary -kubernetes-version 1.34.0 -schema-location default - < /tmp/forge-helm-template-dev.out

      - name: helm lint (prod)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm lint charts/boutique --kube-version 1.34.0 --values charts/boutique/values.yaml --values charts/boutique/values-prod.yaml

      - name: helm template (prod)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm template boutique charts/boutique --namespace boutique-prod --kube-version 1.34.0 --values charts/boutique/values.yaml --values charts/boutique/values-prod.yaml > /tmp/forge-helm-template-prod.out

      - name: kubeconform -strict (prod)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          kubeconform -strict -summary -kubernetes-version 1.34.0 -schema-location default - < /tmp/forge-helm-template-prod.out

  valider-pipeline:
    name: Valider Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl; fi
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: actionlint
        env:
          NO_COLOR: '1'
        run: |
          actionlint -no-color -oneline .github/workflows/ci.yml

  valider-terraform:
    name: Valider Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip; fi
          curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -qo /tmp/terraform.zip -d /tmp
          install -m 0755 /tmp/terraform /usr/local/bin/terraform
          curl -fsSL -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.59.1/tflint_linux_amd64.zip
          unzip -qo /tmp/tflint.zip -d /tmp
          install -m 0755 /tmp/tflint /usr/local/bin/tflint

      - name: terraform fmt
        working-directory: terraform
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform fmt -check -recursive -diff -no-color

      - name: terraform init (dev)
        working-directory: terraform/environments/dev
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform init -backend=false -input=false -no-color

      - name: terraform validate (dev)
        working-directory: terraform/environments/dev
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform validate -no-color

      - name: terraform init (prod)
        working-directory: terraform/environments/prod
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform init -backend=false -input=false -no-color

      - name: terraform validate (prod)
        working-directory: terraform/environments/prod
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform validate -no-color

      - name: tflint
        working-directory: terraform
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          tflint --recursive --no-color

  construire:
    name: Construire l'image
    runs-on: ubuntu-latest
    needs:
      - valider-helm
      - valider-pipeline
      - valider-terraform
    # Ne part que depuis la branche par défaut : une proposition de fusion ne
    # publie rien et ne déploie rien.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: docker buildx build (ghcr.io/acme/boutique)
        env:
          FORGE_IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx create --use --name forge-builder 2>/dev/null || docker buildx use forge-builder
          docker buildx build --platform linux/amd64 --file Dockerfile --tag "ghcr.io/acme/boutique:$FORGE_IMAGE_TAG" --push .

  deployer-dev:
    name: Déployer dev
    runs-on: ubuntu-latest
    needs:
      - valider-helm
      - valider-pipeline
      - valider-terraform
      - construire
    # Ne part que depuis la branche par défaut : une proposition de fusion ne
    # publie rien et ne déploie rien.
    if: github.ref == 'refs/heads/main'
    # C'est ici que GitHub attache l'approbation humaine : elle se configure
    # dans les réglages du dépôt (Settings > Environments > dev),
    # pas dans ce fichier. Sans « required reviewers » sur cet environnement,
    # le déploiement part sans approbation, ce que `forge.yml` demande.
    environment: dev
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip; fi
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version v3.16.3
          curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -qo /tmp/terraform.zip -d /tmp
          install -m 0755 /tmp/terraform /usr/local/bin/terraform

      - name: terraform init (dev)
        working-directory: terraform/environments/dev
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform init -input=false -no-color

      - name: terraform apply (dev)
        working-directory: terraform/environments/dev
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform apply -auto-approve -input=false -no-color

      - name: helm upgrade --install (dev)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm upgrade --install boutique charts/boutique --namespace boutique-dev --values charts/boutique/values.yaml --values charts/boutique/values-dev.yaml --atomic --timeout 10m

  deployer-prod:
    name: Déployer prod
    runs-on: ubuntu-latest
    needs:
      - valider-helm
      - valider-pipeline
      - valider-terraform
      - construire
      - deployer-dev
    # Ne part que depuis la branche par défaut : une proposition de fusion ne
    # publie rien et ne déploie rien.
    if: github.ref == 'refs/heads/main'
    # C'est ici que GitHub attache l'approbation humaine : elle se configure
    # dans les réglages du dépôt (Settings > Environments > prod),
    # pas dans ce fichier. Sans « required reviewers » sur cet environnement,
    # le déploiement partira sans que personne l'ait validé — alors que
    # `forge.yml` demande une approbation. Configurez-la.
    environment: prod
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer les outils
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip; fi
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version v3.16.3
          curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -qo /tmp/terraform.zip -d /tmp
          install -m 0755 /tmp/terraform /usr/local/bin/terraform

      - name: terraform init (prod)
        working-directory: terraform/environments/prod
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform init -input=false -no-color

      - name: terraform apply (prod)
        working-directory: terraform/environments/prod
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform apply -auto-approve -input=false -no-color

      - name: helm upgrade --install (prod)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm upgrade --install boutique charts/boutique --namespace boutique-prod --values charts/boutique/values.yaml --values charts/boutique/values-prod.yaml --atomic --timeout 10m
