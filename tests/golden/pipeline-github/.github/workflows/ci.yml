# =============================================================================
# ci.yml — integration chain of "storefront"
# =============================================================================
# File generated by forge. Do not edit it by hand: modify `forge.yml` at the root
# of the repository, then run `forge generate` again — or `forge update --only
# pipeline` to receive only the evolutions of the template.
#
# This file was not written domain by domain: each domain declared in `forge.yml`
# said itself which tools had to be run and in which directory. Adding a section
# to `forge.yml` therefore adds a job here, without this template changing.
#
# Domains taken into account:
#   - Helm (helm) — 6 validation command(s), deploys dev, prod
#   - Pipeline (pipeline) — 1 validation command(s)
#   - Terraform (terraform) — 6 validation command(s), deploys dev, prod
#
# No credential is written in this file. Access goes through the secrets of the
# repository (`${{ secrets.* }}`) or through the token provided as standard.
#
# Each action is pinned to a commit SHA rather than to a tag. A tag can be
# repointed at new code by whoever owns the action, and these jobs run in your
# repository with your permissions — a moved tag is code you never reviewed,
# running where you cannot see it. The comment beside each SHA is the release
# that SHA is.
#
# A pin does not update itself. Add a `.github/dependabot.yml` enabling the
# `github-actions` ecosystem and these pins become update pull requests you read
# before merging, which is the posture forge keeps on its own CI.
# =============================================================================

name: storefront

on:
  push:
    branches:
      - main
  # A validation only really prevents anything before the merge.
  pull_request:

# Minimal rights: only reading the repository is granted by default.
permissions:
  contents: read
  # Necessary in order to publish the image in the registry of the repository.
  packages: write

# One run per reference: a push that replaces another cancels the previous one,
# rather than queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-helm:
    name: Validate Helm
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the tools
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl; fi
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version v3.16.3
          curl -fsSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform

      - name: helm lint (dev)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm lint charts/storefront --kube-version 1.34.0 --values charts/storefront/values.yaml --values charts/storefront/values-dev.yaml

      - name: helm template (dev)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm template storefront charts/storefront --namespace storefront-dev --kube-version 1.34.0 --values charts/storefront/values.yaml --values charts/storefront/values-dev.yaml > /tmp/forge-helm-template-dev.out

      - name: kubeconform -strict (dev)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          kubeconform -strict -summary -kubernetes-version 1.34.0 -schema-location default - < /tmp/forge-helm-template-dev.out

      - name: helm lint (prod)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm lint charts/storefront --kube-version 1.34.0 --values charts/storefront/values.yaml --values charts/storefront/values-prod.yaml

      - name: helm template (prod)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm template storefront charts/storefront --namespace storefront-prod --kube-version 1.34.0 --values charts/storefront/values.yaml --values charts/storefront/values-prod.yaml > /tmp/forge-helm-template-prod.out

      - name: kubeconform -strict (prod)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          kubeconform -strict -summary -kubernetes-version 1.34.0 -schema-location default - < /tmp/forge-helm-template-prod.out

  validate-pipeline:
    name: Validate Pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the tools
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl; fi
          curl -fsSL -o /tmp/actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          install -m 0755 /tmp/actionlint /usr/local/bin/actionlint

      - name: actionlint
        env:
          NO_COLOR: '1'
        run: |
          actionlint -no-color -oneline .github/workflows/ci.yml

  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the tools
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip; fi
          curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -qo /tmp/terraform.zip -d /tmp
          install -m 0755 /tmp/terraform /usr/local/bin/terraform
          curl -fsSL -o /tmp/tflint.zip https://github.com/terraform-linters/tflint/releases/download/v0.59.1/tflint_linux_amd64.zip
          unzip -qo /tmp/tflint.zip -d /tmp
          install -m 0755 /tmp/tflint /usr/local/bin/tflint

      - name: terraform fmt
        working-directory: terraform
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform fmt -check -recursive -diff -no-color

      - name: terraform init (dev)
        working-directory: terraform/environments/dev
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform init -backend=false -input=false -no-color

      - name: terraform validate (dev)
        working-directory: terraform/environments/dev
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform validate -no-color

      - name: terraform init (prod)
        working-directory: terraform/environments/prod
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform init -backend=false -input=false -no-color

      - name: terraform validate (prod)
        working-directory: terraform/environments/prod
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform validate -no-color

      - name: tflint
        working-directory: terraform
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          tflint --recursive --no-color

  build:
    name: Build the image
    runs-on: ubuntu-latest
    needs:
      - validate-helm
      - validate-pipeline
      - validate-terraform
    # Only starts from the default branch: a pull request publishes nothing and
    # deploys nothing.
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: docker buildx build (ghcr.io/acme/storefront)
        env:
          FORGE_IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx create --use --name forge-builder 2>/dev/null || docker buildx use forge-builder
          docker buildx build --platform linux/amd64 --file Dockerfile --tag "ghcr.io/acme/storefront:$FORGE_IMAGE_TAG" --push .

  deploy-dev:
    name: Deploy dev
    runs-on: ubuntu-latest
    needs:
      - validate-helm
      - validate-pipeline
      - validate-terraform
      - build
    # Only starts from the default branch: a pull request publishes nothing and
    # deploys nothing.
    if: github.ref == 'refs/heads/main'
    # This is where GitHub attaches the human approval: it is configured in the
    # settings of the repository (Settings > Environments > dev),
    # not in this file. Without "required reviewers" on this environment,
    # the deployment starts without approval, which is what `forge.yml` asks for.
    environment: dev
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the tools
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip; fi
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version v3.16.3
          curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -qo /tmp/terraform.zip -d /tmp
          install -m 0755 /tmp/terraform /usr/local/bin/terraform

      - name: terraform init (dev)
        working-directory: terraform/environments/dev
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform init -input=false -no-color

      - name: terraform apply (dev)
        working-directory: terraform/environments/dev
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform apply -auto-approve -input=false -no-color

      - name: helm upgrade --install (dev)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm upgrade --install storefront charts/storefront --namespace storefront-dev --values charts/storefront/values.yaml --values charts/storefront/values-dev.yaml --atomic --timeout 10m

  deploy-prod:
    name: Deploy prod
    runs-on: ubuntu-latest
    needs:
      - validate-helm
      - validate-pipeline
      - validate-terraform
      - build
      - deploy-dev
    # Only starts from the default branch: a pull request publishes nothing and
    # deploys nothing.
    if: github.ref == 'refs/heads/main'
    # This is where GitHub attaches the human approval: it is configured in the
    # settings of the repository (Settings > Environments > prod),
    # not in this file. Without "required reviewers" on this environment,
    # the deployment will start without anybody having approved it — whereas
    # `forge.yml` asks for an approval. Configure it.
    environment: prod
    steps:
      - name: Check out the repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install the tools
        run: |
          if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip; fi
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash -s -- --version v3.16.3
          curl -fsSL -o /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
          unzip -qo /tmp/terraform.zip -d /tmp
          install -m 0755 /tmp/terraform /usr/local/bin/terraform

      - name: terraform init (prod)
        working-directory: terraform/environments/prod
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform init -input=false -no-color

      - name: terraform apply (prod)
        working-directory: terraform/environments/prod
        env:
          CHECKPOINT_DISABLE: '1'
          NO_COLOR: '1'
          TF_IN_AUTOMATION: '1'
        run: |
          terraform apply -auto-approve -input=false -no-color

      - name: helm upgrade --install (prod)
        working-directory: helm
        env:
          NO_COLOR: '1'
        run: |
          helm upgrade --install storefront charts/storefront --namespace storefront-prod --values charts/storefront/values.yaml --values charts/storefront/values-prod.yaml --atomic --timeout 10m
