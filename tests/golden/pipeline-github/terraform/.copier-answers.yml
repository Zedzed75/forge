    extras:
        makefile: true
        tflint_config: true
    families:
    -   details: 'Sets up the partition itself, with the app.kubernetes.io labels
            of the service. This is the pivot family: the others attach themselves
            to it by reference, which gives Terraform the creation order with no explicit
            depends_on.


            Absent, the module assumes the namespace already created by the platform
            team and merely attaches itself to it by its name.'
        name: namespace
        outputs:
        - namespace
        providers:
        - kubernetes
        resources:
        - kubernetes_namespace
        summary: Creates the namespace the service is deployed in
        traps:
        - '`terraform destroy` deletes the namespace, and therefore **everything**
            it contains -- including what a Helm chart deployed there and that Terraform
            does not know about. The destruction goes beyond the perimeter.'
        - 'Changing the name of the namespace destroys and recreates it (ForceNew
            behaviour): the content is lost, with no warning other than the plan line.'
        - A namespace being deleted stays in the Terminating phase as long as a finalizer
            has not given back control; Terraform waits, and the wait looks like a
            hang.
        variables: []
    -   details: 'Caps what the namespace can consume and gives a default size to
            the containers that do not declare one.


            This is the family that has the most effect on the other domains: as soon
            as a ResourceQuota covers cpu or memory, the API refuses any pod whose
            container has no `resources.requests`.'
        name: quota
        outputs:
        - resource_quota_name
        providers:
        - kubernetes
        resources:
        - kubernetes_resource_quota
        - kubernetes_limit_range
        summary: 'ResourceQuota and LimitRange: the budget of the namespace'
        traps:
        - As soon as a quota covers `requests.cpu` or `requests.memory`, **every**
            pod without `resources.requests` is refused at admission. The Helm chart
            of the same service must therefore declare its requests, otherwise the
            deployment breaks the day the quota is set up.
        - 'The LimitRange only applies to the pods **created after** it: the pods
            already in place keep their configuration, and the divergence is only
            seen at the next restart.'
        - 'A quota reduced below the current consumption evicts nothing: it only blocks
            the subsequent creations. The namespace looks healthy until the next deployment.'
        variables:
        - quota_cpu
        - quota_memory
        - quota_pods
        - limit_range_default_cpu
        - limit_range_default_memory
    kubernetes:
        auth: kubeconfig
        config_path: ~/.kube/config
        context_per_environment: true
        uses_kubeconfig: true
