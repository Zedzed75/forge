# =============================================================================
# .gitlab-ci.yml — integration chain of "passerelle"
# =============================================================================
# File generated by forge. Do not edit it by hand: modify `forge.yml` at the root
# of the repository, then run `forge generate` again — or `forge update --only
# pipeline` to receive only the evolutions of the template.
#
# This file was not written domain by domain: each domain declared in `forge.yml`
# said itself which tools had to be run and in which directory. Adding a section
# to `forge.yml` therefore adds a job here, without this template changing.
#
# Domains taken into account:
#   - Pipeline (pipeline) — 1 validation command(s)
#
# No credential is written here: use protected and masked variables, defined in
# the settings of the project.
# =============================================================================

# A minimal base image: each job installs what it needs, and nothing else. A
# do-everything image would hide which job depends on which tool.
image: debian:trixie-slim

# The stage names are French and stay so deliberately: each job references its
# stage by this exact string, so they are identifiers of the generated file
# rather than prose.
stages:
  - valider
  - construire

# One run per branch: a push that replaces another cancels the previous one
# rather than queueing behind it.
default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never

valider-pipeline:
  stage: valider
  script:
    # Install the tools
    - if command -v apt-get >/dev/null; then apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip; fi
    - python3 -m pip install --quiet yamllint
    # yamllint
    - 'NO_COLOR=1 yamllint --format parsable -d ''{extends: default, rules: {line-length: disable, comments-indentation: disable, document-start: disable, truthy: {check-keys: false}}}'' .gitlab-ci.yml'

construire:
  stage: construire
  needs:
    - valider-pipeline
  rules:
    # Only starts from the default branch: a merge request publishes nothing and
    # deploys nothing.
    - if: $CI_COMMIT_BRANCH == "main"
    - when: never
  script:
    # docker buildx build ($CI_REGISTRY/plateforme/passerelle)
    - FORGE_IMAGE_TAG='$CI_COMMIT_SHA' docker buildx create --use --name forge-builder 2>/dev/null || docker buildx use forge-builder
    - FORGE_IMAGE_TAG='$CI_COMMIT_SHA' docker buildx build --platform linux/amd64 --file Dockerfile --tag "$CI_REGISTRY/plateforme/passerelle:$FORGE_IMAGE_TAG" --push .
