---
# ---------------------------------------------------------------------------
# forge.yml - Specification du service
# ---------------------------------------------------------------------------
# Ce fichier decrit entierement ce qui doit etre genere. Il est rejouable :
#   forge generate --spec forge.yml
# produit exactement la meme arborescence, octet pour octet.
#
# Editez-le a la main puis relancez la generation ; ne modifiez pas
# 'forge_version' manuellement.
#
# Domaines generes par cette specification :
#   - terraform
# ---------------------------------------------------------------------------
forge_version: 1
service:
  name: boutique
  description: Boutique en ligne, socle d'infrastructure
  owner: Equipe Plateforme
  owner_email: plateforme@example.net
  labels:
    tier: frontend
    cost-center: '4210'
  environments:
    - name: dev
      domain: dev.example.net
    - name: staging
      domain: staging.example.net
    - name: prod
      domain: example.net
      production: true
terraform:
  terraform_version: ~> 1.9
  namespace_strategy: per_env
  resources:
    - namespace
    - quota
    - registry_secret
    - service_account
    - network_policy
    - random_secret
    - tls_certificate
  backend:
    kind: s3
    config:
      bucket: etats-terraform-plateforme
      region: eu-west-3
      encrypt: 'true'
  kubernetes:
    auth: kubeconfig
    config_path: ~/.kube/config
    context_per_environment: true
  environments:
    dev:
      quota:
        cpu: '2'
        memory: 4Gi
        pods: 20
    prod:
      kube_context: plateforme-prod-eu-west-3
      quota:
        cpu: '16'
        memory: 32Gi
        pods: 120
      labels:
        criticality: high
  extras:
    makefile: true
    tflint_config: true
