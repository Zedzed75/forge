    -   path: quota.tf
        purpose: 'ResourceQuota and LimitRange: the budget of the namespace (kubernetes_resource_quota,
            kubernetes_limit_range).'
    -   path: registry_secret.tf
        purpose: Image pull secret for a private registry (kubernetes_secret).
    -   path: service_account.tf
        purpose: ServiceAccount, Role and RoleBinding for the deployments (kubernetes_service_account,
            kubernetes_role, kubernetes_role_binding).
    -   path: network_policy.tf
        purpose: Closes the namespace by default, and reopens the strict minimum (kubernetes_network_policy).
    -   path: random_secret.tf
        purpose: Generated passwords, deposited as a Secret (random_password, kubernetes_secret).
    -   path: tls_certificate.tf
        purpose: Self-signed certificate of the working environments (tls_private_key,
            tls_self_signed_cert, kubernetes_secret).
    module_name: storefront
    namespace_strategy: per_env
    outputs:
    -   description: Namespace the service is deployed in.
        name: namespace
        value: local.namespace
    -   description: Name of the ResourceQuota set on the namespace.
        name: resource_quota_name
        value: kubernetes_resource_quota.this.metadata[0].name
    -   description: Name of the Secret to quote in imagePullSecrets, on the Helm
            chart side.
        name: image_pull_secret_name
        value: kubernetes_secret.registry.metadata[0].name
    -   description: Name of the deployment ServiceAccount.
        name: service_account_name
        value: kubernetes_service_account.deployer.metadata[0].name
    -   description: Name of the Secret carrying the generated values. Its value is
            not exposed as an output.
        name: generated_secret_name
        value: kubernetes_secret.generated.metadata[0].name
    -   description: Name of the kubernetes.io/tls Secret to quote in the Ingress.
        name: tls_secret_name
        value: kubernetes_secret.tls.metadata[0].name
    providers:
    -   name: kubernetes
        reason: sets up the Kubernetes objects that host the service
        source: hashicorp/kubernetes
        version: ~> 2.32
    -   name: random
        reason: generates the passwords, never written in the specification
        source: hashicorp/random
        version: ~> 3.6
    -   name: tls
        reason: builds the self-signed certificates of the working environments
        source: hashicorp/tls
        version: ~> 4.0
    resource_slots:
