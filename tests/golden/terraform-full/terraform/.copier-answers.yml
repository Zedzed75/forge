    root_files:
    -   path: .copier-answers.yml
        purpose: Answers of the template, read back by `forge update`. Do not edit.
    -   path: .gitignore
        purpose: 'Excludes the state, the plans and the provider cache. The state
            carries values in plain text: it must never be committed.'
    -   path: .tflint.hcl
        purpose: tflint rule set applied to the project.
    -   path: Makefile
        purpose: 'Shortcuts: `make init ENV=prod`, `make plan ENV=prod`.'
    -   path: README.md
        purpose: 'This file: how to use the project.'
    root_variables:
    -   default: '"~/.kube/config"'
        description: 'Path of the kubeconfig file used to reach the cluster. Specific
            to the machine: leave the default value and override it through TF_VAR_kube_config_path
            if needed.'
        has_default: true
        name: kube_config_path
        per_environment: false
        sensitive: false
        type: string
    -   default: '""'
        description: 'Targeted kubeconfig context. Never leave it empty: with no explicit
            context, Terraform applies on the current context of the machine, whatever
            it is.'
        has_default: true
        name: kube_context
        per_environment: true
        sensitive: false
        type: string
    -   default: ''
        description: Name of the service. Prefixes every created resource and feeds
            the app.kubernetes.io/name label.
        has_default: false
        name: service_name
        per_environment: false
        sensitive: false
        type: string
    -   default: ''
        description: Name of the environment (dev, staging, prod). Serves as a resource
            suffix and as the value of the app.kubernetes.io/instance label.
        has_default: false
        name: environment
        per_environment: false
        sensitive: false
        type: string
    -   default: ''
        description: Targeted Kubernetes namespace. Created by this module if the
            'namespace' family is retained, assumed to exist otherwise.
        has_default: false
        name: namespace
        per_environment: false
        sensitive: false
        type: string
    -   default: '{}'
        description: Labels applied to every resource, in addition to the app.kubernetes.io
            labels computed by the module.
        has_default: true
        name: labels
        per_environment: true
        sensitive: false
        type: map(string)
    -   default: '{}'
        description: Annotations applied to every resource. Leave empty if no controller
            of the cluster expects any.
        has_default: true
        name: annotations
        per_environment: false
        sensitive: false
        type: map(string)
    -   default: '"4"'
        description: Ceiling of CPU requestable in the namespace, in Kubernetes units
            (e.g. '4' for 4 cores, '500m' for a half).
        has_default: true
        name: quota_cpu
        per_environment: true
        sensitive: false
        type: string
    -   default: '"8Gi"'
        description: Ceiling of memory requestable, Kubernetes suffix mandatory (Mi,
            Gi). A bare number would be understood as bytes.
        has_default: true
        name: quota_memory
        per_environment: true
        sensitive: false
        type: string
    -   default: '30'
        description: Maximum number of simultaneous pods in the namespace.
        has_default: true
        name: quota_pods
        per_environment: true
        sensitive: false
        type: number
    -   default: '"500m"'
        description: CPU given to a container that does not request any.
        has_default: true
        name: limit_range_default_cpu
        per_environment: false
        sensitive: false
        type: string
    -   default: '"512Mi"'
        description: Memory given to a container that does not request any.
        has_default: true
        name: limit_range_default_memory
        per_environment: false
        sensitive: false
        type: string
    -   default: '"https://index.docker.io/v1/"'
        description: Address of the registry. Docker Hub requires the historical form
            https://index.docker.io/v1/ ; the other registries take their bare host
            name.
        has_default: true
        name: registry_server
        per_environment: false
        sensitive: false
