domain:
    author: Platform Team
    become: true
    collection_users:
        ansible.posix:
        - firewall
        - users
        community.general:
        - common
        - firewall
        community.postgresql:
        - postgresql
    collections:
    -   name: ansible.posix
        reason: 'authorized_key and firewalld have existed since 1.0.0, but no version
            older than the one validated in CI has been checked: the floor stays high.'
        validated: 2.2.2
        version: '>=2.2.2,<3.0.0'
    -   name: community.general
        reason: 'timezone and ufw have existed since 1.0.0, but no version older than
            the one validated in CI has been checked: the floor stays high.'
        validated: 13.4.0
        version: '>=13.4.0,<14.0.0'
    -   name: community.postgresql
        reason: postgresql_alter_system, used by the postgresql role, appeared in
            3.13.0; it replaced postgresql_set, removed in 5.0.0.
        validated: 5.0.0
        version: '>=3.13.0,<6.0.0'
    default_env: dev
    env_names:
    - dev
    - prod
    environments:
    -   domain: ''
        group_vars:
            dbservers: []
        groups:
        -   description: Database servers, outside the cluster
            hosts:
            -   ansible_host: 10.0.1.21
                ansible_port: null
                ansible_user: null
                name: db-dev-01
                variables: []
                vars: {}
            name: dbservers
            role_names:
            - common
            - users
            - ssh_hardening
            - firewall
            - postgresql
            roles:
            - &id001
                author: Platform Team
                collections:
                -   name: community.general
                    version: '>=13.4.0,<14.0.0'
                example_group: dbservers
                handlers:
                - Restart the time synchronisation service
                internal_vars:
                -   description: time synchronisation package resolved per OS family
                    name: common_ntp_package
                -   description: time synchronisation service resolved per OS family
                    name: common_ntp_service
                name: common
                options:
                -   allowed: Identifier from the tz database, for instance 'Europe/Paris'
                        or 'UTC'.
                    default: Europe/Paris
                    description: Time zone applied to every machine of the group.
                    name: timezone
                    var_name: common_timezone
                -   allowed: List of package names valid for the targeted OS family.
                    default:
                    - ca-certificates
                    - curl
                    - htop
                    - vim
                    description: Packages installed on every machine of the group.
                    name: packages
                    var_name: common_packages
                -   allowed: true or false.
                    default: true
                    description: Enables the configuration of the time zone by the
                        role.
                    name: manage_timezone
                    var_name: common_manage_timezone
                -   allowed: true or false.
                    default: true
                    description: Installs and enables time synchronisation (systemd-timesyncd).
                    name: enable_ntp
                    var_name: common_enable_ntp
                -   allowed: true or false.
                    default: true
                    description: Deploys an /etc/motd file describing the purpose
                        of the machine.
                    name: manage_motd
                    var_name: common_manage_motd
                os_families: []
                platforms:
                - Debian
                - Ubuntu
                summary: 'System baseline: base packages, time zone, NTP synchronisation,
                    MOTD banner.'
                tags:
                - common
                - base
            - &id002
                author: Platform Team
                collections:
                -   name: ansible.posix
                    version: '>=2.2.2,<3.0.0'
                example_group: dbservers
                handlers: []
                internal_vars:
                -   description: name of the file written to /etc/sudoers.d
                    name: users_sudoers_file
                -   description: secondary groups derived from users_accounts
                    name: users_secondary_groups
                -   description: present accounts that have sudo access
                    name: users_sudo_accounts
                name: users
                options:
                -   allowed: List of dictionaries (name, groups, sudo, shell, ssh_public_key,
                        state).
                    default: []
                    description: List of the local accounts managed by the role.
                    name: accounts
                    var_name: users_accounts
                -   allowed: true or false.
                    default: true
                    description: Writes a file in /etc/sudoers.d for the accounts
                        marked sudo.
                    name: manage_sudoers
                    var_name: users_manage_sudoers
                -   allowed: true or false.
                    default: false
                    description: Removes /home/<user> when the account moves to the
                        absent state.
                    name: remove_absent_home
                    var_name: users_remove_absent_home
                os_families: []
                platforms:
                - Debian
                - Ubuntu
                summary: 'Local accounts: creation, secondary groups, sudo and authorised
                    SSH keys.'
                tags:
                - users
                - security
            - &id003
                author: Platform Team
                collections: []
                example_group: dbservers
                handlers:
                - Restart the SSH service
                internal_vars:
                -   description: directory of the additional configuration files of
                        sshd
                    name: ssh_hardening_dropin_dir
                -   description: name of the SSH service, resolved per OS family
                    name: ssh_hardening_service
                name: ssh_hardening
                options:
                -   allowed: Integer from 1 to 65535.
                    default: 22
                    description: TCP port sshd listens on.
                    name: port
                    var_name: ssh_hardening_port
                -   allowed: yes, no, prohibit-password or forced-commands-only.
                    default: prohibit-password
                    description: Value of the PermitRootLogin directive.
                    name: permit_root_login
                    var_name: ssh_hardening_permit_root_login
                -   allowed: true or false.
                    default: false
                    description: Value of the PasswordAuthentication directive.
                    name: password_authentication
                    var_name: ssh_hardening_password_authentication
                -   allowed: true or false.
                    default: true
                    description: Value of the PubkeyAuthentication directive.
                    name: pubkey_authentication
                    var_name: ssh_hardening_pubkey_authentication
                -   allowed: true or false.
                    default: false
                    description: Value of the X11Forwarding directive.
                    name: x11_forwarding
                    var_name: ssh_hardening_x11_forwarding
                -   allowed: Integer from 1 to 10.
                    default: 3
                    description: Value of the MaxAuthTries directive.
                    name: max_auth_tries
                    var_name: ssh_hardening_max_auth_tries
                -   allowed: List of system group names.
                    default: []
                    description: Value of the AllowGroups directive; empty disables
                        the directive.
                    name: allow_groups
                    var_name: ssh_hardening_allow_groups
                os_families: []
                platforms:
                - Debian
                - Ubuntu
                summary: 'OpenSSH hardening: root login, password authentication,
                    limits.'
                tags:
                - ssh
                - security
                - hardening
            - &id004
                author: Platform Team
                collections:
                -   name: ansible.posix
                    version: '>=2.2.2,<3.0.0'
                -   name: community.general
                    version: '>=13.4.0,<14.0.0'
                example_group: dbservers
                handlers:
                - Reload the firewall
                internal_vars:
                -   description: backend actually used, once "auto" is resolved
                    name: firewall_effective_backend
                -   description: firewalld zone the rules are set in
                    name: firewall_zone
                -   description: firewalld zone target derived from the default policy
                    name: firewall_zone_target
                name: firewall
                options:
                -   allowed: auto, ufw or firewalld.
                    default: auto
                    description: Backend used; 'auto' picks ufw on Debian and firewalld
                        on RedHat.
                    name: backend
                    var_name: firewall_backend
                -   allowed: deny, reject or allow.
                    default: deny
                    description: Action applied to incoming traffic that is not explicitly
                        allowed.
                    name: default_incoming_policy
                    var_name: firewall_default_incoming_policy
                -   allowed: allow, deny or reject.
                    default: allow
                    description: Action applied to outgoing traffic that is not explicitly
                        allowed.
                    name: default_outgoing_policy
                    var_name: firewall_default_outgoing_policy
                -   allowed: List of integers from 1 to 65535.
                    default:
                    - 22
                    - 80
                    - 443
                    description: TCP ports opened for inbound traffic.
                    name: allowed_tcp_ports
                    var_name: firewall_allowed_tcp_ports
                -   allowed: List of integers from 1 to 65535.
                    default: []
                    description: UDP ports opened for inbound traffic.
                    name: allowed_udp_ports
                    var_name: firewall_allowed_udp_ports
                -   allowed: true or false.
                    default: true
                    description: Enables and starts the firewall service.
                    name: enabled
                    var_name: firewall_enabled
                -   allowed: off, low, medium, high or full.
                    default: low
                    description: Verbosity of the firewall logs.
                    name: log_level
                    var_name: firewall_log_level
                os_families: []
                platforms:
                - Debian
                - Ubuntu
                summary: 'Local firewall: ufw (Debian) or firewalld (RedHat), default
                    policy and open ports.'
                tags:
                - firewall
                - security
            - &id005
                author: Platform Team
                collections:
                -   name: community.postgresql
                    version: '>=3.13.0,<6.0.0'
                example_group: dbservers
                handlers:
                - Reload PostgreSQL
                - Restart PostgreSQL
                internal_vars:
                -   description: directory of postgresql.conf and pg_hba.conf, per
                        OS family
                    name: postgresql_config_dir
                -   description: parameters applied to the server, built from the
                        options
                    name: postgresql_settings
                -   description: roles that have a password variable filled in
                    name: postgresql_users_with_password
                name: postgresql
                options:
                -   allowed: Major version number, for instance '15' or '16'.
                    default: '16'
                    description: Major version installed from the repositories of
                        the distribution.
                    name: version
                    var_name: postgresql_version
                -   allowed: '''localhost'', ''*'' or a comma-separated list of addresses.'
                    default: localhost
                    description: Value of listen_addresses in postgresql.conf.
                    name: listen_addresses
                    var_name: postgresql_listen_addresses
                -   allowed: Integer from 1 to 65535.
                    default: 5432
                    description: TCP port of the PostgreSQL server.
                    name: port
                    var_name: postgresql_port
                -   allowed: List of dictionaries (name, owner, encoding).
                    default: []
                    description: Databases created and maintained by the role.
                    name: databases
                    var_name: postgresql_databases
                -   allowed: List of dictionaries (name, password_var, privileges).
                    default: []
                    description: Login roles created and maintained by the role.
                    name: db_users
                    var_name: postgresql_db_users
                -   allowed: List of five-field strings "type database user address
                        method", for instance 'host all all 10.0.0.0/8 scram-sha-256'.
                    default: []
                    description: Lines added to pg_hba.conf on top of the default
                        local rules.
                    name: hba_entries
                    var_name: postgresql_hba_entries
                -   allowed: Positive integer.
                    default: 100
                    description: Value of max_connections in postgresql.conf.
                    name: max_connections
                    var_name: postgresql_max_connections
                os_families: []
                platforms:
                - Debian
                - Ubuntu
                summary: 'PostgreSQL server: installation, network listening, databases,
                    roles and pg_hba rules.'
                tags:
                - postgresql
                - database
            variables: []
