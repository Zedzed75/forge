---
# ---------------------------------------------------------------------------
# playbooks/dbservers.yml — configuration of the "dbservers" group
# ---------------------------------------------------------------------------
# Database servers, outside the cluster
# Targeted run:
#   ansible-playbook -i inventories/<env> playbooks/dbservers.yml
# Partial run by tag:
#   ansible-playbook -i inventories/<env> playbooks/dbservers.yml --tags common
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

- name: Apply the configuration of the "dbservers" group
  hosts: dbservers
  # Privilege escalation: most system tasks require it.
  become: true
  # Fact gathering is needed by the roles that adapt their behaviour to the
  # detected distribution.
  gather_facts: true

  roles:
    # System baseline: base packages, time zone, NTP synchronisation, MOTD banner.
    - role: common
      tags:
        - common
        - base

    # Local accounts: creation, secondary groups, sudo and authorised SSH keys.
    - role: users
      tags:
        - users
        - security

    # OpenSSH hardening: root login, password authentication, limits.
    - role: ssh_hardening
      tags:
        - ssh
        - security
        - hardening

    # Local firewall: ufw (Debian) or firewalld (RedHat), default policy and open ports.
    - role: firewall
      tags:
        - firewall
        - security

    # PostgreSQL server: installation, network listening, databases, roles and pg_hba
    # rules.
    - role: postgresql
      tags:
        - postgresql
        - database
