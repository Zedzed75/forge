# ---------------------------------------------------------------------------
# requirements.yml — Galaxy dependencies of the project
# ---------------------------------------------------------------------------
# Install them before the first run:
#   ansible-galaxy collection install -r requirements.yml
# The roles of the project are shipped in roles/ and are therefore not listed here.
#
# Every dependency carries a version range, a floor and a ceiling.
# Without a ceiling, this command would install whatever Galaxy serves on the day you
# run it. A major released after this project was generated may have removed a module
# the roles below use, and the project would then break without a single one of its
# lines having moved.
# Widening a range remains your right; the consequence is then yours.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

collections:
  # Required by the role: firewall, users
  # Floor: authorized_key and firewalld have existed since 1.0.0, but no version older
  # than the one validated in CI has been checked: the floor stays high.
  # Ceiling: the major following 2.2.2, the version forge validates the generated
  # projects against.
  - name: ansible.posix
    version: ">=2.2.2,<3.0.0"
  # Required by the role: common, firewall
  # Floor: timezone and ufw have existed since 1.0.0, but no version older than the one
  # validated in CI has been checked: the floor stays high.
  # Ceiling: the major following 13.4.0, the version forge validates the generated
  # projects against.
  - name: community.general
    version: ">=13.4.0,<14.0.0"
  # Required by the role: postgresql
  # Floor: postgresql_alter_system, used by the postgresql role, appeared in 3.13.0; it
  # replaced postgresql_set, removed in 5.0.0.
  # Ceiling: the major following 5.0.0, the version forge validates the generated
  # projects against.
  - name: community.postgresql
    version: ">=3.13.0,<6.0.0"
