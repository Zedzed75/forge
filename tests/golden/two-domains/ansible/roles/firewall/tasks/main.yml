---
# ---------------------------------------------------------------------------
# roles/firewall/tasks/main.yml — dispatch to the firewall implementation
# ---------------------------------------------------------------------------
# The effective backend is resolved in vars/main.yml: "auto" picks ufw on
# Debian and firewalld on RedHat. The tasks specific to each
# implementation live in ufw.yml and firewalld.yml.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

- name: Check that the firewall backend is supported by the machine
  ansible.builtin.assert:
    that:
      - firewall_effective_backend in ['ufw', 'firewalld']
    fail_msg: >-
      Unknown firewall backend: {{ firewall_effective_backend }}.
      Supported values: ufw, firewalld.

- name: Apply the ufw rules
  ansible.builtin.include_tasks: ufw.yml
  when: firewall_effective_backend == 'ufw'

- name: Apply the firewalld rules
  ansible.builtin.include_tasks: firewalld.yml
  when: firewall_effective_backend == 'firewalld'
