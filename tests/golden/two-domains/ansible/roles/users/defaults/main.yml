---
# ---------------------------------------------------------------------------
# roles/users/defaults/main.yml — default values of the role
# ---------------------------------------------------------------------------
# Local accounts: creation, secondary groups, sudo and authorised SSH keys.
# These values have the lowest precedence: any group_vars or host_vars
# file overrides them. Prefer changing them there rather than here, so
# that the role stays reusable as it is.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

# List of the local accounts managed by the role.
# Allowed values: list of dictionaries (name, groups, sudo, shell, ssh_public_key,
# state).
users_accounts: []

# Writes a file in /etc/sudoers.d for the accounts marked sudo.
# Allowed values: true or false.
users_manage_sudoers: true

# Removes /home/<user> when the account moves to the absent state.
# Allowed values: true or false.
users_remove_absent_home: false
