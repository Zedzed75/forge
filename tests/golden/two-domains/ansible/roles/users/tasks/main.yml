---
# ---------------------------------------------------------------------------
# roles/users/tasks/main.yml — local accounts, sudo and SSH keys
# ---------------------------------------------------------------------------
# Order of execution: secondary groups, accounts, authorised keys, then
# sudo rules. An empty users_accounts list makes the role a no-op: every
# task then loops over zero items.
#
# File generated by forge from forge.yml.
# Regenerate the project rather than editing this file by hand.
# ---------------------------------------------------------------------------

- name: Create the declared secondary groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ users_secondary_groups }}"

- name: Manage the local accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    groups: "{{ item.groups }}"
    append: true
    shell: "{{ item.shell }}"
    state: "{{ item.state }}"
    create_home: true
    remove: "{{ users_remove_absent_home if item.state == 'absent' else omit }}"
  loop: "{{ users_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Install the authorised SSH public keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_public_key }}"
    state: present
    exclusive: false
  loop: "{{ users_key_accounts }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deploy the sudo rules of the authorised accounts
  ansible.builtin.template:
    src: sudoers.j2
    dest: "{{ '/etc/sudoers.d/' ~ users_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  when:
    - users_manage_sudoers | bool
    - users_sudo_accounts | length > 0

- name: Remove the sudoers file when no account needs it
  ansible.builtin.file:
    path: "{{ '/etc/sudoers.d/' ~ users_sudoers_file }}"
    state: absent
  when:
    - users_manage_sudoers | bool
    - users_sudo_accounts | length == 0
