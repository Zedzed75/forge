{{- /*
===============================================================================
Service of the "api" component
===============================================================================
File generated by forge.

Exposes the pods of api behind a stable DNS name and a virtual address.
The Service selects its pods by the selection labels of the component, never by
their name.
===============================================================================
*/}}
{{- if and .Values.api.enabled .Values.api.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "boutique.api.fullname" . }}
  labels:
    {{- include "boutique.api.labels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: {{ .Values.api.portName }}
      port: {{ .Values.api.service.port }}
      {{- /* targetPort designates the port of the container, here by its name. */}}
      targetPort: {{ .Values.api.portName }}
      protocol: TCP
  selector:
    {{- include "boutique.api.selectorLabels" . | nindent 4 }}
{{- end }}
