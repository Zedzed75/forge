{{/*
===============================================================================
Connection test of the "api" component
===============================================================================
File generated by forge.

This pod is only created by "helm test <release>", thanks to the
helm.sh/hook: test annotation. It queries the Service of api and fails
if that one does not answer, which makes it possible to validate a release before
declaring it good.

The hook-delete-policy annotation deletes the pod as soon as it has succeeded,
while keeping it on failure to allow its logs to be read.
===============================================================================
*/}}
{{- if and .Values.tests.enabled .Values.api.enabled .Values.api.service.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "storefront.api.fullname" . }}-test-connection
  labels:
    {{- include "storefront.api.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: connection-test
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      command:
        - wget
      args:
        - --spider
        - --timeout={{ .Values.tests.timeoutSeconds }}
        - "{{ include "storefront.api.fullname" . }}:{{ .Values.api.service.port }}"
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
{{- end }}
