---
# ---------------------------------------------------------------------------
# forge.yml - Spécification du projet Ansible
# ---------------------------------------------------------------------------
# Ce fichier décrit entièrement le projet à générer. Il est rejouable :
#   ansible-forge generate --spec forge.yml
# produit exactement la même arborescence, octet pour octet.
#
# Éditez-le à la main puis relancez la génération ; ne modifiez pas
# 'spec_version' manuellement.
# ---------------------------------------------------------------------------
spec_version: 1
project_name: plateforme-web
description: Plateforme web interne - frontaux nginx, workers Docker et base PostgreSQL
author: Equipe Infrastructure
os_family: debian
remote_user: deploy
become: true
ssh_port: 22
python_interpreter: auto_silent
environments:
  - name: dev
    hosts:
      webservers:
        - name: web-dev-01
          ansible_host: 10.10.0.11
          ansible_port: null
          ansible_user: null
          vars: {}
      workers:
        - name: worker-dev-01
          ansible_host: 10.10.0.31
          ansible_port: null
          ansible_user: null
          vars: {}
      dbservers:
        - name: db-dev-01
          ansible_host: 10.10.0.21
          ansible_port: null
          ansible_user: null
          vars: {}
    group_vars:
      all:
        ntp_server: 10.10.0.1
      webservers:
        web_healthcheck_path: /debug/healthz
  - name: staging
    hosts:
      webservers:
        - name: web-stg-01
          ansible_host: 10.20.0.11
          ansible_port: null
          ansible_user: null
          vars: {}
      workers:
        - name: worker-stg-01
          ansible_host: 10.20.0.31
          ansible_port: null
          ansible_user: null
          vars: {}
      dbservers:
        - name: db-stg-01
          ansible_host: 10.20.0.21
          ansible_port: null
          ansible_user: null
          vars: {}
    group_vars:
      all:
        ntp_server: 10.20.0.1
  - name: prod
    hosts:
      webservers:
        - name: web-prod-01
          ansible_host: 10.30.0.11
          ansible_port: null
          ansible_user: null
          vars: {}
        - name: web-prod-02
          ansible_host: 10.30.0.12
          ansible_port: null
          ansible_user: null
          vars: {}
      workers:
        - name: worker-prod-01
          ansible_host: 10.30.0.31
          ansible_port: null
          ansible_user: null
          vars: {}
        - name: worker-prod-02
          ansible_host: 10.30.0.32
          ansible_port: null
          ansible_user: null
          vars: {}
      dbservers:
        - name: db-prod-01
          ansible_host: 10.30.0.21
          ansible_port: null
          ansible_user: null
          vars:
            db_shared_buffers: 8GB
    group_vars:
      all:
        ntp_server: 10.30.0.1
groups:
  - name: webservers
    description: Serveurs web frontaux exposés derrière le répartiteur de charge
    roles:
      - common
      - users
      - ssh_hardening
      - firewall
      - nginx
    vars:
      web_healthcheck_path: /healthz
  - name: workers
    description: Exécuteurs de tâches asynchrones, en conteneurs Docker
    roles:
      - common
      - users
      - ssh_hardening
      - firewall
      - docker
    vars: {}
  - name: dbservers
    description: Serveurs de base de données PostgreSQL
    roles:
      - common
      - users
      - ssh_hardening
      - firewall
      - postgresql
    vars: {}
roles:
  - name: common
    options:
      timezone: Europe/Paris
      packages:
        - ca-certificates
        - curl
        - htop
        - rsync
        - vim
      manage_timezone: true
      enable_ntp: true
      manage_motd: true
  - name: users
    options:
      accounts:
        - name: deploy
          groups:
            - adm
          sudo: true
          shell: /bin/bash
          ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExempleDeCleFactice deploy@forge
          state: present
        - name: appuser
          groups: []
          sudo: false
          shell: /usr/sbin/nologin
          ssh_public_key: ''
          state: present
      manage_sudoers: true
      remove_absent_home: false
  - name: ssh_hardening
    options:
      port: 22
      permit_root_login: 'no'
      password_authentication: false
      pubkey_authentication: true
      x11_forwarding: false
      max_auth_tries: 3
      allow_groups:
        - adm
  - name: firewall
    options:
      backend: auto
      default_incoming_policy: deny
      default_outgoing_policy: allow
      allowed_tcp_ports:
        - 22
        - 80
        - 443
      allowed_udp_ports: []
      enabled: true
      log_level: low
  - name: nginx
    options:
      server_name: app.exemple.test
      document_root: /var/www/app
      listen_port: 80
      enable_https: true
      ssl_certificate: /etc/ssl/certs/ssl-cert-snakeoil.pem
      ssl_certificate_key: /etc/ssl/private/ssl-cert-snakeoil.key
      remove_default_site: true
      worker_processes: auto
      client_max_body_size: 20m
  - name: docker
    options:
      channel: stable
      install_compose_plugin: true
      users_in_docker_group:
        - deploy
      log_driver: json-file
      log_max_size: 50m
      log_max_file: 3
      service_enabled: true
  - name: postgresql
    options:
      version: '16'
      listen_addresses: '*'
      port: 5432
      databases:
        - name: application
          owner: app
          encoding: UTF8
      db_users:
        - name: app
          password_var: vault_postgresql_app_password
          privileges: application:ALL
      hba_entries:
        - host application app 10.0.0.0/8 scram-sha-256
      max_connections: 200
options:
  use_vault: true
  write_lint_config: true
  embed_spec: true
  write_ci: false
