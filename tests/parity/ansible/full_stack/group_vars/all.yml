---
# ---------------------------------------------------------------------------
# group_vars/all.yml — variables communes à tout le projet
# ---------------------------------------------------------------------------
# Ces valeurs s'appliquent à toutes les machines de tous les environnements.
# Elles constituent la couche de plus basse précédence après les valeurs par
# défaut des rôles ; un fichier inventories/<env>/group_vars/ les surcharge.
#
# Fichier généré par ansible-forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

# Connexion aux machines
# ------------------------------------------------------------
# Compte utilisé par Ansible pour se connecter en SSH.
# Valeurs admises : un nom de compte POSIX existant sur les machines cibles.
ansible_user: deploy

# Port SSH des machines cibles.
# Valeurs admises : entier de 1 à 65535.
ansible_port: 22

# Interpréteur Python utilisé sur les machines cibles.
# Valeurs admises : « auto_silent », « auto » ou un chemin absolu.
ansible_python_interpreter: auto_silent

# Identité du projet
# ------------------------------------------------------------
# Nom du projet, repris dans la bannière MOTD et les fichiers de configuration.
# Valeurs admises : chaîne libre.
project_name: full-stack

# Description du projet, reprise dans la bannière MOTD.
# Valeurs admises : chaîne libre, éventuellement vide.
project_description: Plateforme complète - web, conteneurs et base de données

# Réglages de rôles propres à ce projet
# ------------------------------------------------------------
# Ces variables surchargent la valeur par défaut du rôle correspondant.
# Les variables non listées ici gardent la valeur documentée dans
# roles/<rôle>/defaults/main.yml.

# Liste des comptes locaux gérés par le rôle.
# Valeurs admises : liste de dictionnaires (name, groups, sudo, shell, ssh_public_key,
# state).
users_accounts:
  - name: deploy
    groups:
      - adm
    sudo: true
    shell: /bin/bash
    ssh_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIExempleDeCleFactice deploy@forge
    state: present

# Ports TCP ouverts en entrée.
# Valeurs admises : liste d'entiers de 1 à 65535.
firewall_allowed_tcp_ports:
  - 22
  - 80
  - 443
  - 5432

# Nom de domaine de l'hôte virtuel principal.
# Valeurs admises : nom de domaine valide, par exemple 'www.example.com'.
nginx_server_name: app.exemple.test

# Répertoire servi par l'hôte virtuel principal.
# Valeurs admises : chemin absolu, créé par le rôle s'il n'existe pas.
nginx_document_root: /var/www/app

# Comptes locaux autorisés à piloter Docker sans sudo.
# Valeurs admises : liste de noms de comptes existants sur la machine.
docker_users_in_docker_group:
  - deploy

# Valeur de listen_addresses dans postgresql.conf.
# Valeurs admises : 'localhost', '*' ou une liste d'adresses séparées par des virgules.
postgresql_listen_addresses: '*'

# Bases créées et maintenues par le rôle.
# Valeurs admises : liste de dictionnaires (name, owner, encoding).
postgresql_databases:
  - name: application
    owner: app
    encoding: UTF8

# Rôles de connexion créés et maintenus par le rôle.
# Valeurs admises : liste de dictionnaires (name, password_var, privileges).
postgresql_db_users:
  - name: app
    password_var: vault_postgresql_app_password
    privileges: application:ALL

# Lignes ajoutées à pg_hba.conf en plus des règles locales par défaut.
# Valeurs admises : liste de chaînes à cinq champs « type base utilisateur adresse
# méthode », par exemple 'host all all 10.0.0.0/8 scram-sha-256'.
postgresql_hba_entries:
  - host application app 10.30.0.0/24 scram-sha-256
