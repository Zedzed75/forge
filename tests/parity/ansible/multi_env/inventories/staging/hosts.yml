---
# ---------------------------------------------------------------------------
# Inventaire de l'environnement « staging » — projet multi-env-infra
# ---------------------------------------------------------------------------
# Liste les machines de cet environnement et leur rattachement aux groupes.
# Les variables de connexion communes sont dans group_vars/all.yml ;
# les variables propres à une machine sont dans host_vars/<machine>.yml.
# Vérification : ansible-inventory -i inventories/staging --graph
#
# Fichier généré par ansible-forge à partir de forge.yml.
# Régénérez le projet plutôt que de modifier ce fichier à la main.
# ---------------------------------------------------------------------------

all:
  children:
    # Serveurs web frontaux
    # Rôles appliqués : common
    webservers:
      hosts:
        web-stg-01:
          # Adresse de connexion SSH utilisée par Ansible.
          ansible_host: 10.20.0.11

    # Serveurs de base de données
    # Rôles appliqués : common
    dbservers:
      hosts:
        db-stg-01:
          # Adresse de connexion SSH utilisée par Ansible.
          ansible_host: 10.20.0.21
