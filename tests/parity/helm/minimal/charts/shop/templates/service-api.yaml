{{- /*
===============================================================================
Service du composant « api »
===============================================================================
Fichier généré par helm-forge.

Expose les pods de api derrière un nom DNS stable et une adresse
virtuelle. Le Service sélectionne ses pods par les labels de sélection du
composant, jamais par leur nom.
===============================================================================
*/}}
{{- if and .Values.api.enabled .Values.api.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shop.api.fullname" . }}
  labels:
    {{- include "shop.api.labels" . | nindent 4 }}
  {{- with .Values.api.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: {{ .Values.api.portName }}
      port: {{ .Values.api.service.port }}
      {{- /* targetPort désigne le port du conteneur, ici par son nom. */}}
      targetPort: {{ .Values.api.portName }}
      protocol: TCP
  selector:
    {{- include "shop.api.selectorLabels" . | nindent 4 }}
{{- end }}
