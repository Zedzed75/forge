# -----------------------------------------------------------------------------
# forge.yml — spécification du projet, générée par helm-forge
# -----------------------------------------------------------------------------
# Ce fichier décrit intégralement le projet Kubernetes/Helm à générer.
# Il est rejouable : `helm-forge generate --spec forge.yml` reproduit le projet
# à l'identique, octet pour octet, sans reposer aucune question.
#
# Toutes les clés sont écrites, y compris celles laissées à leur valeur par
# défaut, afin que le fichier serve aussi de documentation des réglages
# disponibles. Modifiez-le puis relancez la génération.
# -----------------------------------------------------------------------------
schema_version: 1
app:
  name: shop
  description: Boutique en ligne
  chart_version: 0.1.0
  app_version: 1.0.0
  maintainer_name: unknown
  maintainer_email: unknown@example.com
kubernetes:
  version: '1.36'
layout: single
namespace_strategy: per_env
create_namespace: false
environments:
- name: dev
  namespace: shop-dev
  log_level: debug
  components:
    api:
      replicas: 1
      hpa_enabled: null
      pdb_enabled: null
      ingress_host: null
      resources: null
      image_tag: null
  extra_values: {}
- name: prod
  namespace: shop-prod
  log_level: info
  components:
    api:
      replicas: 3
      hpa_enabled: null
      pdb_enabled: null
      ingress_host: null
      resources:
        profile: custom
        cpu_request: 100m
        memory_request: 128Mi
        cpu_limit: 400m
        memory_limit: 256Mi
      image_tag: null
  extra_values: {}
image:
  registry: ghcr.io
  repository: acme/shop
  strategy: appVersion
  tag: ''
  pull_policy: IfNotPresent
  pull_secret_name: null
components:
- name: api
  kind: deployment
  addons:
  - service
  image_repository: null
  command: []
  args: []
  replicas: 1
  container_port: 8080
  port_name: http
  probes:
    enabled: true
    liveness_path: /healthz
    readiness_path: /ready
    startup_enabled: false
    initial_delay_seconds: 5
    period_seconds: 10
    timeout_seconds: 2
    failure_threshold: 3
  resources:
    profile: small
    cpu_request: 50m
    memory_request: 64Mi
    cpu_limit: 200m
    memory_limit: 128Mi
  security:
    strict: true
    run_as_non_root: true
    run_as_user: 10001
    run_as_group: 10001
    fs_group: 10001
    read_only_root_filesystem: true
    allow_privilege_escalation: false
    drop_capabilities:
    - ALL
    seccomp_profile: RuntimeDefault
  service:
    type: ClusterIP
    port: 80
    headless: false
    node_port: null
    annotations: {}
  ingress:
    controller: nginx
    base_domain: example.com
    path: /
    path_type: Prefix
    tls: true
    issuer: letsencrypt-prod
    class_name: null
    annotations: {}
  persistence:
    enabled: false
    storage_class: ''
    size: 10Gi
    access_mode: ReadWriteOnce
    mount_path: /data
  hpa:
    min_replicas: 2
    max_replicas: 5
    target_cpu: 80
    target_memory: null
  pdb:
    min_available: 1
  networkpolicy:
    allow_from_same_namespace: true
    allow_from_namespaces: []
    allow_dns: true
    allow_egress_all: false
  servicemonitor:
    path: /metrics
    port_name: http
    interval: 30s
    scrape_timeout: 10s
  config:
    keys:
    - LOG_LEVEL
    - APP_ENV
    mount_as: env
  secret:
    keys:
    - API_KEY
    mount_as: env
  cron: null
secrets:
  strategy: placeholder
  store_name: default
  refresh_interval: 1h
extras:
  makefile: true
  helmfile: false
  helm_tests: true
  ci: none
