---
# This case covers what the parity snapshot could not: the six legacy
# specifications all had `write_ci: false`, so the generated continuous
# integration workflow appeared in none of them. It is the only artefact this
# case adds over the others, and that is deliberate: kept small on purpose, so
# the golden reference stays readable.
forge_version: 1

service:
  name: gateway
  description: "Application gateway"
  owner: "Platform Team"
  environments:
    - name: prod
      production: true

ansible:
  os_family: debian
  remote_user: deploy
  ssh_port: 22
  options:
    use_vault: false
    write_lint_config: true
    write_ci: true
  groups:
    - name: gateways
      description: "Gateways exposed to the outside"
      roles:
        - common
        - ssh_hardening
  hosts:
    prod:
      gateways:
        - name: gw-prod-01
          ansible_host: 10.30.0.11
