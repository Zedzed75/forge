---
# Reference specification of the demonstration domain.
# It is the source of the core's golden tests: two environments, two widgets,
# only one of them "detailed", to exercise file filtering.
forge_version: 1

service:
  name: storefront
  description: "Demonstration online store"
  owner: "Platform Team"
  owner_email: platform@example.net
  labels:
    app.kubernetes.io/part-of: commerce
    tier: frontend
  environments:
    - name: dev
      domain: dev.example.net
    - name: prod
      domain: example.net
      production: true

demo:
  greeting: bonjour
  widgets:
    - name: cpu
      kind: gauge
      detailed: true
    - name: requetes
      kind: counter
