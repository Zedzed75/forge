---
# Minimal specification: a single environment, a single widget, no labels, no
# reachable owner. It checks that every optional field really is optional, and
# that the output stays complete and commented.
forge_version: 1

service:
  name: api
  description: "Minimal service"
  owner: "Platform Team"
  environments:
    - name: prod
      production: true

demo:
  widgets:
    - name: sante
      kind: log
