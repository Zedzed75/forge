---
# This case exercises what the parity snapshot could not: the two legacy
# specifications declared `addons: [service]` and `addons: []`, so none of the
# nine families written in phase 4 appeared in them. It therefore switches on
# everything that was written: the three workload kinds, the eight addons, a
# component name with a hyphen (which forces the `values_ref` detour), non-empty
# RBAC rules, and free-form per-environment values.
forge_version: 1

service:
  name: boutique
  description: "Online store, full chart"
  owner: "Platform Team"
  owner_email: plateforme@example.net
  labels:
    app.kubernetes.io/part-of: commerce
  environments:
    - name: dev
    - name: prod
      domain: boutique.example.net
      production: true

helm:
  chart_version: 1.2.0
  app_version: "2026.08.1"
  kubernetes:
    version: "1.34"
  namespace_strategy: per_env
  image:
    registry: ghcr.io
    repository: acme/boutique
    strategy: appVersion
    pull_secret_name: registre-prive

  components:
    # Exposed workload, with the full set of addons.
    - name: api
      kind: deployment
      addons:
        - service
        - ingress
        - configmap
        - secret
        - hpa
        - pdb
        - serviceaccount
        - networkpolicy
      container_port: 8080
      port_name: http
      ingress:
        base_domain: example.net
        tls: true
      config:
        keys:
          - LOG_LEVEL
          - APP_ENV
      secret:
        keys:
          - API_KEY
      rbac:
        create: true
        rules:
          - apiGroups: [""]
            resources: [configmaps]
            verbs: [get, list, watch]

    # Hyphenated name: `.Values.db-proxy` would break the chart, `values_ref` not.
    - name: db-proxy
      kind: statefulset
      addons:
        - configmap
        - serviceaccount
      container_port: 5432
      port_name: postgres
      persistence:
        size: 20Gi
      config:
        keys:
          - POOL_SIZE
        mount_as: file

    # Scheduled job: no Service, no Ingress, no autoscaling.
    - name: cleanup
      kind: cronjob
      addons:
        - configmap
      cron:
        schedule: "0 3 * * *"
        concurrency_policy: Forbid
      config:
        keys:
          - RETENTION_DAYS

  environments:
    prod:
      log_level: warn
      extra_values:
        global:
          monitoring: true
      components:
        api:
          replicas: 4
