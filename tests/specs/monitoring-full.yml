# ---------------------------------------------------------------------------
# Reference case of the monitoring domain: every family that was kept.
# ---------------------------------------------------------------------------
# Serves as both golden reference and integration case: this project is
# generated, then handed to promtool — check config, check rules, and above all
# test rules, which verifies that each alert really does fire.
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: boutique
  description: Online store, monitoring
  owner: Platform Team
  owner_email: plateforme@example.net
  labels:
    tier: frontend
  environments:
    - name: dev
      domain: dev.example.net
    - name: prod
      domain: example.net
      production: true

monitoring:
  scrape:
    interval: 30s
    timeout: 10s
    metrics_path: /metrics

  metrics:
    requests_total: http_requests_total
    request_duration_seconds: http_request_duration_seconds
    status_label: status

  rules:
    - availability
    - error_rate
    - latency
    - saturation
    - restarts
    - probe

  blackbox_address: blackbox-exporter:9115

  environments:
    dev:
      namespace: boutique-dev
      targets:
        - api-dev.example.net:9090
      probe_urls:
        - https://boutique.dev.example.net
      thresholds:
        error_rate: 0.2
        latency_p95_seconds: 2
    prod:
      namespace: boutique-prod
      targets:
        - api-1.example.net:9090
        - api-2.example.net:9090
      probe_urls:
        - https://boutique.example.net
      thresholds:
        error_rate: 0.02
        latency_p95_seconds: 0.8
        memory_ratio: 0.85
        cpu_cores: 3
        restarts_per_hour: 2
        certificate_days: 30
      labels:
        criticality: high

  extras:
    makefile: true
    dashboard: true
