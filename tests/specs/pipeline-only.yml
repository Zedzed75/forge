# ---------------------------------------------------------------------------
# Reference case of the pipeline domain, alone and in the GitLab dialect.
# ---------------------------------------------------------------------------
# Two reasons for this case:
#
# 1. **Single domain.** A repository may need nothing but a continuous
#    integration chain. The pipeline then produces the only job it can produce:
#    the one that validates its own output. That is little, and it is right —
#    it does not invent jobs for domains that are absent.
#
# 2. **GitLab.** `pipeline-github.yml` covers the other template; without this
#    case, the GitLab dialect would be rendered by no golden test at all.
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: gateway
  description: Application gateway, pipeline only
  owner: Platform Team
  owner_email: platform@example.net
  environments:
    - name: prod
      domain: example.net
      production: true

pipeline:
  provider: gitlab

  trigger:
    branches: [main]
    on_pull_request: true

  build:
    context: .
    dockerfile: Dockerfile
    # On GitLab, the token provided out of the box only opens the project's own
    # registry: any other value raises a warning from forge.
    registry: $CI_REGISTRY
    image: platform/gateway
