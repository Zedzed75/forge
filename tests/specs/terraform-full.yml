# ---------------------------------------------------------------------------
# Cas de reference du domaine Terraform : toutes les familles retenues.
# ---------------------------------------------------------------------------
# Sert de reference golden et de cas d'integration : ce projet est genere puis
# soumis aux validateurs reels (terraform fmt, init, validate, tflint).
#
# Le backend n'est volontairement pas `local` : c'est la forme qu'un projet
# reel prend, et elle exerce la derivation de la cle d'etat par environnement.
# Aucune cle secrete ne figure ici — le modele les refuserait.
# ---------------------------------------------------------------------------
forge_version: 1

service:
  name: storefront
  description: Online store, infrastructure foundation
  owner: Platform Team
  owner_email: platform@example.net
  labels:
    tier: frontend
    cost-center: "4210"
  environments:
    - name: dev
      domain: dev.example.net
    - name: staging
      domain: staging.example.net
    - name: prod
      domain: example.net
      production: true

terraform:
  terraform_version: "~> 1.9"
  namespace_strategy: per_env

  resources:
    - namespace
    - quota
    - registry_secret
    - service_account
    - network_policy
    - random_secret
    - tls_certificate

  backend:
    kind: s3
    config:
      bucket: etats-terraform-plateforme
      region: eu-west-3
      encrypt: "true"

  kubernetes:
    auth: kubeconfig
    config_path: ~/.kube/config
    context_per_environment: true

  environments:
    dev:
      quota:
        cpu: "2"
        memory: 4Gi
        pods: 20
    prod:
      kube_context: platform-prod-eu-west-3
      quota:
        cpu: "16"
        memory: 32Gi
        pods: 120
      labels:
        criticality: high

  extras:
    makefile: true
    tflint_config: true
