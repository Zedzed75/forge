---
# First specification that asks for BOTH domains at once. It is the one that
# gives the project's promise its meaning: a single description of the service,
# and two infrastructure projects consistent with each other.
#
# It is also the only case where the core's inter-domain checks have two
# projections to compare: service name, labels, materialised environments, and
# the facets of the shared vocabulary.
forge_version: 1

service:
  name: storefront
  description: "Online store, deployed on Kubernetes and managed by Ansible"
  owner: "Platform Team"
  owner_email: platform@example.net
  labels:
    app.kubernetes.io/part-of: commerce
    tier: frontend
  environments:
    - name: dev
    - name: prod
      domain: example.net
      production: true

# ---------------------------------------------------------------------------
# The machines: what hosts the dependencies outside the cluster.
# ---------------------------------------------------------------------------
ansible:
  os_family: debian
  remote_user: deploy
  ssh_port: 22
  groups:
    - name: dbservers
      description: "Database servers, outside the cluster"
      roles:
        - common
        - users
        - ssh_hardening
        - firewall
        - postgresql
  hosts:
    dev:
      dbservers:
        - name: db-dev-01
          ansible_host: 10.0.1.21
    prod:
      dbservers:
        - name: db-prod-01
          ansible_host: 10.0.2.21

# ---------------------------------------------------------------------------
# The chart: what runs inside the cluster.
# ---------------------------------------------------------------------------
helm:
  chart_version: 1.0.0
  app_version: "2026.08.1"
  kubernetes:
    version: "1.34"
  namespace_strategy: per_env
  image:
    registry: ghcr.io
    repository: acme/storefront
    strategy: appVersion
  components:
    - name: api
      kind: deployment
      addons:
        - service
        - ingress
        - configmap
        - serviceaccount
      container_port: 8080
      ingress:
        base_domain: example.net
      config:
        keys:
          - LOG_LEVEL
          - DATABASE_HOST
